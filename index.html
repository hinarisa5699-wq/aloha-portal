// ===== ランチミーティングのレジュメの締め切り =====
let DL_PEND=null;
function loadXlsxLib(){return window.XLSX?Promise.resolve():new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';sc.onload=res;sc.onerror=()=>rej(new Error('Excelを読む部品を読み込めませんでした'));document.head.appendChild(sc);});}
// 「行う職員」の言葉 → 職員ID
function dlTokens(who){return String(who||'').replace(/\s/g,'').split(/[・、,と]/).filter(Boolean);}
function dlResolve(tok){
  const act=S.staffList.filter(s=>s.active),map=(S.settings.dlWho||{})[tok];
  if(map) return map.filter(id=>act.some(s=>s.id===id));
  if(/^(職員)?全員$/.test(tok)) return act.map(s=>s.id);
  if(tok==='正社員') return act.filter(s=>s.cls==='正社員').map(s=>s.id);
  if(tok==='役員') return act.filter(s=>s.cls==='役員'||s.role==='幹部').map(s=>s.id);
  if(/^(全事業所)?管理者$/.test(tok)) return act.filter(s=>s.role==='管理者').map(s=>s.id);
  const dm=tok.match(/(ナース|ヘルパー|ケアマネ|事務|デイ)/);
  if(dm&&/管理者/.test(tok)) return act.filter(s=>s.role==='管理者'&&s.depts.includes(dm[1])).map(s=>s.id);
  if(dm&&tok.replace(/^オンコール有/,'')===dm[1]) return act.filter(s=>s.depts.includes(dm[1])).map(s=>s.id);
  const sur=x=>String(x.name).split(/[\s　]/)[0];const c=act.filter(s=>sur(s)===tok||normName(s.name)===tok);
  return c.length===1?[c[0].id]:null;
}
function dlTo(who){const ids=new Set(),un=[];dlTokens(who).forEach(t=>{const r=dlResolve(t);if(r)r.forEach(i=>ids.add(i));else un.push(t);});return {to:[...ids],un};}
function parseResume(rows){
  const title=String((rows[0]||[])[0]||'');const tm=title.match(/(20\d\d)\D(\d{1,2})\D(\d{1,2})/);if(!tm) throw new Error('1行目に「ランチミーティングレジュメ　2026.9.15（火）」の形の日付が見つかりません');
  const y=+tm[1],mm=+tm[2];const head=rows.findIndex(r=>String(r[0]||'').trim()==='締切日');if(head<0) throw new Error('「締切日」の表が見つかりません');
  const list=[];
  for(let i=head+1;i<rows.length;i++){const r=rows[i]||[];const a=String(r[0]||'').trim();if(!a)break;
    const m=a.match(/(\d{1,2})月(\d{1,2})日/);if(!m)continue;let yy=y;if(+m[1]<mm-6)yy++;if(+m[1]>mm+6)yy--;
    const time=a.replace(/^.*?日(\([^)]*\)|（[^）]*）)?/,'').trim();
    list.push({date:`${yy}-${String(m[1]).padStart(2,'0')}-${String(m[2]).padStart(2,'0')}`,time,who:String(r[1]||'').trim(),what:String(r[2]||'').trim()});}
  return {src:`${y}-${String(mm).padStart(2,'0')}`,meet:`${y}-${String(mm).padStart(2,'0')}-${String(tm[3]).padStart(2,'0')}`,list};
}
async function dlPick(f){
  const box=$('#dlPend');box.innerHTML='<p class="note">読み込み中…</p>';
  try{await loadXlsxLib();const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''});DL_PEND=Object.assign(parseResume(rows),{file:f});box.innerHTML=dlPendHtml();}
  catch(e){DL_PEND=null;box.innerHTML=`<p class="note" style="color:var(--red)">${esc(e.message)}</p>`;}
}
function dlPendHtml(){
  if(!DL_PEND) return '';const un=new Set();DL_PEND.list.forEach(d=>dlTo(d.who).un.forEach(t=>un.add(t)));
  const act=S.staffList.filter(s=>s.active);
  return `<p><b>${DL_PEND.src.replace('-','年')}月のレジュメ</b>：締め切り ${DL_PEND.list.length}件</p>
  ${un.size?`<div style="background:#fff7ed;border-radius:8px;padding:8px 10px;margin-bottom:8px"><b>だれのことか決めてください</b><span class="note">（一度決めると次の月からも使います）</span>${[...un].map(t=>`<details style="margin-top:6px"><summary>「${esc(t)}」 → <span class="note">${((S.settings.dlWho||{})[t]||[]).map(id=>esc((act.find(s=>s.id===id)||{}).name||'')).join('、')||'未設定'}</span></summary><div>${act.map(s=>`<label style="display:inline-block;margin:0 10px 4px 0;white-space:nowrap"><input type="checkbox" onchange="dlSetWho('${esc(t)}','${esc(s.id)}',this.checked)" ${((S.settings.dlWho||{})[t]||[]).includes(s.id)?'checked':''}>${esc(s.name)}</label>`).join('')}</div></details>`).join('')}</div>`:''}
  <table><tr><th>締切日</th><th>行う職員</th><th>内容</th><th>届く人数</th></tr>${DL_PEND.list.map(d=>{const r=dlTo(d.who);return `<tr><td style="white-space:nowrap">${md(d.date)} ${esc(d.time)}</td><td>${esc(d.who)}</td><td>${esc(d.what)}</td><td>${r.un.length?'<span class="tag red">未設定あり</span>':r.to.length+'人'}</td></tr>`;}).join('')}</table>
  <div class="row" style="margin-top:8px"><label><input type="checkbox" id="dlShare" checked> レジュメのファイルを「書類」→「会社の資料」にも置く（全員が見られる）</label><label><input type="checkbox" id="dlEach"> 取り込んだら、すぐ各自に<b>自分に関係ある締め切りだけ</b>をLINE WORKSで送る（送るときだけチェック）</label><button class="btn" id="dlBtn" onclick="dlSave()">取り込む</button></div><div id="dlMsg" class="note"></div>`;
}
async function dlSetWho(t,id,on){const m=S.settings.dlWho=S.settings.dlWho||{};const a=new Set(m[t]||[]);on?a.add(id):a.delete(id);m[t]=[...a];await save('settings');$('#dlPend').innerHTML=dlPendHtml();}
async function dlSave(){
  if(!DL_PEND)return;const un=DL_PEND.list.some(d=>dlTo(d.who).un.length);if(un&&!confirm('だれのことか決まっていない行があります。その人には通知されませんが、取り込みますか？'))return;
  $('#dlBtn').disabled=true;const list=DL_PEND.list.map(d=>Object.assign({},d,{to:dlTo(d.who).to}));const msg=[];
  try{await api('saveDeadlines',{src:DL_PEND.src,list});S.deadlines=S.deadlines.filter(d=>d.src!==DL_PEND.src).concat(list.map(d=>Object.assign(d,{src:DL_PEND.src})));msg.push(`締め切り${list.length}件を取り込みました`);}
  catch(e){$('#dlMsg').textContent=e.message;$('#dlBtn').disabled=false;return;}
  if($('#dlShare').checked){try{let data=await readFileUrl(DL_PEND.file);if(/^data:;base64,/.test(data))data=data.replace(/^data:;/,'data:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;');
    await api('shareUpload',{cat:'ランチミーティングレジュメ',scope:'all',date:DL_PEND.meet,title:`${DL_PEND.src.replace('-','年')}月 ランチミーティング レジュメ`,name:DL_PEND.file.name,data});msg.push('会社の資料にも置きました');}catch(e){msg.push('会社の資料には置けませんでした：'+e.message);}}
  if($('#dlEach')&&$('#dlEach').checked){const by={};for(const d of list){if(daysTo(d.date)<0)continue;for(const id of d.to||[])(by[id]=by[id]||[]).push(d);}
    const items=Object.keys(by).map(id=>({to:id,text:`【${DL_PEND.src.replace('-','年')}月 ランチミーティングのレジュメ】\nあなたに関係ある締め切りです。\n`+by[id].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(d=>`・${md(d.date)}${d.time?' '+d.time:''}　${String(d.what).replace(/^□\s*/,'')}`).join('\n')+'\n締め切りの日の朝にも、もう一度お知らせします。'}));
    if(items.length){try{const r=await api('lwSendEach',{items,label:'レジュメの締め切り（各自）'});msg.push(`各自に自分の締め切りを送りました（${r.sent.length}人）`+(r.failed.length?`。届かなかった人：${r.failed.map(f=>f.name).join('、')}`:''));}catch(e){msg.push('各自への送信に失敗：'+e.message);}}}
  $('#dlMsg').textContent=msg.join('　');$('#dlBtn').disabled=false;
}
function dlImportCard(){
  if(!isMgr()) return '';const srcs=[...new Set(S.deadlines.map(d=>d.src))].sort().reverse();
  return `<div class="card"><h2>ランチミーティングのレジュメ（締め切り）を取り込む</h2><p class="note">毎月のレジュメ（Excel）を入れると、「締切日・行う職員・内容」の表を読み取って、各職員のホームに出し、締め切りの当日朝8時ごろにLINE WORKSで本人に知らせます。同じ月を入れ直すと入れ替わります。</p><div class="drop" style="padding:18px" onclick="this.nextElementSibling.click()" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="event.preventDefault();this.classList.remove('over');if(event.dataTransfer.files[0])dlPick(event.dataTransfer.files[0])">ここにレジュメのExcelをドラッグ＆ドロップ<br><span class="note">またはクリックして選ぶ</span></div><input type="file" accept=".xlsx,.xls" class="hide" onchange="if(this.files[0])dlPick(this.files[0]);this.value=''"><div id="dlPend" style="margin-top:8px">${dlPendHtml()}</div>${srcs.length?`<p class="note" style="margin-top:8px">取り込み済み：${srcs.map(x=>x.replace('-','年')+'月').join('、')}</p>`:''}</div>`;
}
function deadlineCard(){
  const all=(S.deadlines||[]).filter(d=>daysTo(d.date)>=0&&daysTo(d.date)<=14);
  const mine=all.filter(d=>(d.to||[]).includes(ME.id)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const showAll=isMgr()&&STATE.dlAll;const list=showAll?all.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)):mine;
  if(!all.length) return '';
  return `<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">締め切り（2週間以内）</h2>${isMgr()?`<label class="note"><input type="checkbox" ${showAll?'checked':''} onchange="STATE.dlAll=this.checked;render()"> 全員分を見る</label>`:''}</div>${list.length?`<table style="margin-top:8px"><tr><th>締切日</th><th>内容</th>${showAll?'<th>行う職員</th>':''}</tr>${list.map(d=>`<tr><td style="white-space:nowrap">${daysTo(d.date)===0?'<span class="tag red">今日</span> ':daysTo(d.date)===1?'<span class="tag amber">明日</span> ':''}${md(d.date)} ${esc(d.time)}</td><td>${esc(d.what.replace(/^□\s*/,''))}</td>${showAll?`<td class="note">${esc(d.who)}</td>`:''}</tr>`).join('')}</table>`:'<p class="note">自分あての締め切りはありません。</p>'}</div>`;
}

// ===== 職員管理（管理者） =====
function vStaff(){
  return `<div class="card"><h2>職員管理</h2><label class="note" style="float:right"><input type="checkbox" ${STATE.showRetired?'checked':''} onchange="STATE.showRetired=this.checked;render()"> 退職した人も表示</label><p class="note">所属は予定データ（訪介→ヘルパー、訪看→ナース、担当ケアマネ→ケアマネ）から自動でつけています。直すとその人は自動で変わらなくなります。初期パスワードは生年月日8桁です。<br>役割：<b>幹部</b>＝すべて（職員の年齢・幹部の役割を含む）／<b>管理者</b>＝職員管理・設定・職員の空き・介護タクシー・利用者の住所・取り込み・お知らせとやることの指示／所属が<b>事務</b>の方＝期限・撮影依頼と「カイポケから更新」／<b>一般</b>＝自分の画面のみ。</p>
  <table><tr><th>ID</th><th>氏名</th><th>区分</th><th>所属</th><th>役割</th><th>在籍</th><th>パスワード</th></tr>${S.staffList.filter(s=>STATE.showRetired||s.status!=='退職').map(s=>`<tr style="${s.active?'':'opacity:.5'}"><td>${esc(s.id)}</td><td>${esc(s.name)}</td><td class="note">${esc(s.cls)}</td><td>${DEPTS.map(d=>`<label style="white-space:nowrap;margin-right:6px;font-size:12.5px"><input type="checkbox" ${s.depts.includes(d)?'checked':''} onchange="setDept('${esc(s.id)}','${d}',this.checked)">${d}</label>`).join('')}</td><td>${!isExec()&&s.role==='幹部'?'幹部':`<select onchange="setStaff('${esc(s.id)}','role',this.value)"><option ${s.role==='一般'?'selected':''}>一般</option><option ${s.role==='管理者'?'selected':''}>管理者</option>${isExec()?`<option ${s.role==='幹部'?'selected':''}>幹部</option>`:''}</select>`}</td><td><select ${!isExec()&&s.role==='幹部'?'disabled':''} onchange="setStaffStatus('${esc(s.id)}',this.value)">${['在籍','休職','退職'].map(v=>`<option ${(s.active?'在籍':(s.status||'退職'))===v?'selected':''}>${v}</option>`).join('')}</select>${s.active&&s.retireDate?` <span class="tag amber">退職日 ${mdy(s.retireDate)}</span>`:''}${isExec()&&!s.active&&s.status==='退職'?` <a href="#" style="color:var(--red)" class="note" onclick="staffDelete('${esc(s.id)}');return false">名前を消す</a>`:''}</td><td>${s.passSet?'<span class="tag green">設定済み</span>':'<span class="tag">初期のまま</span>'} ${!isExec()&&s.role==='幹部'?'':`<a href="#" onclick="resetPass('${esc(s.id)}');return false" class="note">初期化</a>`}</td></tr>`).join('')}</table></div>
  <div class="card"><h2>職員を追加</h2><div class="row"><input id="sId" placeholder="ID（職員番号）" style="width:120px"><input id="sName" placeholder="氏名"><input id="sBirth" type="date"><button class="btn" onclick="addStaff()">追加</button></div></div>`;
}
async function setDept(id,d,on){const s=S.staffList.find(x=>x.id===id);s.deptsManual=true;s.depts=on?[...new Set([...s.depts,d])]:s.depts.filter(x=>x!==d);await save('staff');render();}
// 在籍・休職・退職：休職と退職はLINE WORKSの送信先や一覧から外れる。退職は職員管理の一覧にも出さない（「退職した人も表示」で見られる）
async function staffDelete(id){const s=S.staffList.find(x=>x.id===id);if(!s)return;if(!confirm(`${s.name}さんを職員の一覧から消します。元に戻せません（登録した書類は残ります）。よろしいですか？`))return;try{await api('staffDelete',{id});await loadAll(true);render();}catch(e){alert(e.message);}}
async function setStaffStatus(id,v){const s=S.staffList.find(x=>x.id===id);if(!s)return;
  if(v==='退職'){ // 退職日を入れる。退職日の当日までは使え、翌日からポータルに入れない
    const d=prompt(`${s.name}さんの退職日（最後に働く日）を入れてください（例：${TODAY_ISO}）\n退職日の翌日からポータルに入れなくなり、LINE WORKSの送信先・担当職員の一覧から外れます。`,s.retireDate||TODAY_ISO);
    if(d===null){render();return;}const m=String(d).trim().replace(/\//g,'-').match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);if(!m){alert('日付は 2026-11-30 のように入れてください');render();return;}
    const iso=`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;s.retireDate=iso;
    if(iso>=TODAY_ISO){s.active=true;s.status='';}else{s.active=false;s.status='退職';}
    await save('staff');render();if(iso>=TODAY_ISO)alert(`${mdy(iso)}まで使えます。翌日からポータルに入れなくなります（その日の朝に自動で「退職」になります）。`);return;}
  if(v!=='在籍'&&!confirm(`${s.name}さんを「${v}」にします。LINE WORKSの送信先・担当職員の一覧から外れます。よろしいですか？`)){render();return;}
  s.status=v==='在籍'?'':v;s.active=v==='在籍';if(v==='在籍')s.retireDate='';await save('staff');render();}
async function setStaff(id,k,v){const s=S.staffList.find(x=>x.id===id);if(k==='role'&&v!=='幹部'&&s.id===ME.id&&!confirm('自分の幹部をはずすと、この画面に戻れなくなります。よろしいですか？')){render();return;}s[k]=v;if(k==='role')s.roleManual=true;await save('staff');render();}
async function resetPass(id){const s=S.staffList.find(x=>x.id===id);if(!confirm(`${s.name} さんのパスワードを初期（生年月日8桁）に戻しますか？`))return;try{await api('resetPass',{id});}catch(e){alert(e.message);return;}s.passSet=false;render();}
async function addStaff(){const id=$('#sId').value.trim(),n=$('#sName').value.trim();if(!id||!n)return;if(S.staffList.some(s=>s.id===id)){alert('そのIDはもう使われています');return;}S.staffList.push({id,name:n,birth:$('#sBirth').value,cls:'',depts:[],role:'一般',active:true});await save('staff');render();}

async function tkPages(f){
  if(!/pdf/i.test(f.type)&&!/\.pdf$/i.test(f.name))return [await shrink(f)];
  if(!window.pdfjsLib)throw new Error('PDF読み取り部品を読み込めませんでした');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const doc=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;const out=[];
  for(let i=1;i<=doc.numPages;i++){const pg=await doc.getPage(i);const v0=pg.getViewport({scale:1});const sc=Math.min(2.2,1800/Math.max(v0.width,v0.height));const v=pg.getViewport({scale:sc});const c=document.createElement('canvas');c.width=Math.round(v.width);c.height=Math.round(v.height);const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);await pg.render({canvasContext:ctx,viewport:v}).promise;out.push(c.toDataURL('image/jpeg',0.85));}
  return out;
}

// 写真の中から「1234-5678-9012」のような12けたの番号を探す。日本郵便の番号は、最後のけた＝前の11けたを7で割った余り なので、それで読み間違いを見分ける
const hsCheck=n=>/^\d{12}$/.test(n)&&Number(n.slice(0,11))%7===Number(n[11]);
function hsCands(text){const t=String(text||'').normalize('NFKC');const c=[];
  for(const m of t.matchAll(/\d{4}[\s\-ー－‐]?\d{4}[\s\-ー－‐]?\d{4}/g))c.push(m[0].replace(/\D/g,''));
  for(const l of t.split(/\n/).map(l=>l.replace(/[\s\-ー－‐]/g,'')))for(const m of l.matchAll(/\d{12}/g))c.push(m[0]);
  return [...new Set(c)];}
function hsPickNo(text){const c=hsCands(text);return c.find(hsCheck)||'';}
async function hsGray(file,long){const im=await loadImg(URL.createObjectURL(file));const k=long/Math.max(im.width,im.height);const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.filter='grayscale(1) contrast(1.4)';x.drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/png');}
async function hsOcr(file){const say=t=>{const r=$('#hsRead');if(r)r.textContent=t;};HS.reading=true;say('番号を読み取っています…（はじめは少し時間がかかります）');let guess='';
  try{await tessLoad();const w=await Tesseract.createWorker('eng');await w.setParameters({tessedit_pageseg_mode:'11'});
    for(const long of [1400,2000,2800]){const out=await w.recognize(await hsGray(file,long));const c=hsCands(out.data.text);const ok=c.find(hsCheck);if(ok){await w.terminate();HS.reading=false;HS.no=hsFmt(ok);const i=$('#hsNo');if(i)i.value=HS.no;$('#hsLink').innerHTML=hsLinkHtml(HS.no);say('番号を読み取りました。念のため写真と同じか確かめてください');return true;}if(!guess&&c[0])guess=c[0];}
    await w.terminate();HS.reading=false;
    if(guess){const i=$('#hsNo');if(i&&!i.value){i.value=hsFmt(guess);HS.no=i.value;$('#hsLink').innerHTML=hsLinkHtml(HS.no);}say('番号がはっきり読めませんでした。写真を見て、まちがっていたら直してください');}
    else say('番号は見つかりませんでした（番号のない郵便ならこのままでOK）');return false;}
  catch(e){HS.reading=false;say('番号を読み取れませんでした（'+e.message+'）。手で入れてください');return false;}}

async function kpSync(){
  const depts=KP_DEPTS.filter(d=>KP_SEL.has(d));if(!depts.length){alert('部署を選んでください');return;}
  const id=kpExtId();if(!id||!window.chrome||!chrome.runtime||!chrome.runtime.connect){alert('拡張機能「アロハ業務ポータル カイポケ更新」が見つかりません');return;}
  const nm=new Date(TODAY.getFullYear(),TODAY.getMonth()+1,1);const months=[TODAY_ISO.slice(0,7),iso(nm).slice(0,7)];
  const btn=$('#kpBtn');if(btn)btn.disabled=true;$('#kpLog').textContent='';kpLog('カイポケに接続しています…');
  try{
    const result=await new Promise((res,rej)=>{
      let port;try{port=chrome.runtime.connect(id,{name:'kaipoke-sync'});}catch(e){rej(new Error('拡張機能に接続できません'));return;}
      let done=false;
      port.onMessage.addListener(m=>{if(m.type==='progress')kpLog(m.text);else if(m.type==='done'){done=true;res(m.result);port.disconnect();}else if(m.type==='error'){done=true;rej(new Error(m.error));port.disconnect();}});
      port.onDisconnect.addListener(()=>{if(!done)rej(new Error('拡張機能との接続が切れました（拡張機能が古いか、無効になっています）'));});

// カイポケから読んだ利用者・被保険者証・予定をポータルに反映（選んだ部署だけ。ほかの部署はそのまま）
function applyKaipoke(R){

  const vSum=[];

    for(const [ym,list] of Object.entries(byYm)){

      for(const v of list){const o={src,staff:v.staff,date:v.date,start:v.start,end:v.end,user:v.user,service:v.service};if(v.note)o.note=v.note;if(v.other)o.other=true;if(v.oncall)o.oncall=true;S.visits.push(o);}
      vSum.push(`${label} ${ym.replace('-','年')}月 ${list.length}件`);

  }
  // ケアマネの利用票：アロハ以外の事業所の予定と関係事業所（月ごとに置き換え。先月より前は消す）
  if(R.gaibu){S.extra=S.extra||{};const G=S.extra['#gaibu']=S.extra['#gaibu']||{};let gn=0;
    for(const [ym,g] of Object.entries(R.gaibu)){G[ym]={at:new Date().toISOString(),v:(g.visits||[]).map(x=>({u:normName(x.user),d:x.date,s:x.start,e:x.end,sv:x.service,o:x.office})),of:(g.offices||[]).map(x=>({u:normName(x.user),o:x.office,sv:x.service}))};gn+=G[ym].v.length;}
    const pm=new Date(TODAY.getFullYear(),TODAY.getMonth()-1,1);const keep=`${pm.getFullYear()}-${String(pm.getMonth()+1).padStart(2,'0')}`;
    for(const ym of Object.keys(G))if(ym<keep)delete G[ym];
    vSum.push(`他社の予定（ケアマネの利用票） ${gn}件`);DIRTY.add('extra');}
  // 訪看の区分（介護・医療・保険外）は予定から
  const nurseKubun=new Map();
  for(const v of S.visits){if(v.src!=='訪看'||v.other||!v.user||!/^(介護|医療|保険外)$/.test(v.service))continue;const k=normName(v.user);if(!nurseKubun.has(k))nurseKubun.set(k,new Set());nurseKubun.get(k).add(v.service);}
  // カイポケの利用者を1人1件にまとめる
  const fresh=new Map();
  for(const o of Object.values(R.offices||{})){
    const dept=o.dept;const latestH=new Map();
    for(const h of (o.hoken||[])){const k=normName(h['利用者名']);const p=latestH.get(k);if(!p||(toISODate(h['認定有効終了年月日'])||'')>(toISODate(p['認定有効終了年月日'])||''))latestH.set(k,h);}
    for(const u of (o.users||[])){
      const name=u['利用者名'];if(!name)continue;const birth=toISODate(u['利用者生年月日']);
      const key=normName(u['利用者カナ']||name)+'|'+birth;
      let f=fresh.get(key);if(!f){f={key,name,kana:u['利用者カナ']||'',birth,sex:u['性別']||'',address:addrOf(u),depts:new Set(),kubun:{},hoken:[]};fresh.set(key,f);}
      if(!f.address)f.address=addrOf(u);
      if(/利用中|一時停止/.test(u['利用者状態']||'')){
        f.depts.add(dept);
        let kb=o.kubun?[o.kubun]:dept==='ナース'?[...(nurseKubun.get(normName(name))||[])]:[];
        f.kubun[dept]=[...new Set([...(f.kubun[dept]||[]),...kb])];
        const h=latestH.get(normName(name));if(h)f.hoken.push(h);
      }
    }
  }
  S.extra=S.extra||{};const stopped=S.extra['#stopped']||{};
  const all=new Map(S.users.map(u=>[u.key,u]));
  const byNB=new Map(S.users.map(u=>[normName(u.name)+'|'+(u.birth||''),u]));
  for(const u of all.values()){u.kubunBy=u.kubunBy||{};u.depts=u.depts.filter(d=>!synced.has(d));for(const d of synced)delete u.kubunBy[d];}
  let added=0,back=0;const addedNames=[];
  for(const f of fresh.values()){
    let u=all.get(f.key)||byNB.get(normName(f.name)+'|'+f.birth);
    if(!u&&stopped[f.key]&&f.depts.size){u=stopped[f.key];delete stopped[f.key];u.kubunBy=u.kubunBy||{};u.depts=(u.depts||[]).filter(d=>!synced.has(d));all.set(u.key,u);back++;}
    if(!u){if(!f.depts.size)continue;u={key:f.key,name:f.name,kana:f.kana,birth:f.birth,sex:f.sex,depts:[],kubun:[],kubunBy:{},using:true,ninteiStatus:'',hokensha:'',kaigodo:'',ninteiEnd:'',careMgr:'',kyotaku:'',houkatsu:'',iryoType:'',iryoEnd:'',jogen:null};all.set(u.key,u);added++;addedNames.push(f.name);}
    u.name=f.name;if(f.kana)u.kana=f.kana;if(f.birth)u.birth=f.birth;if(f.sex)u.sex=f.sex;if(f.address)u.address=f.address;
    for(const d of f.depts){if(!u.depts.includes(d))u.depts.push(d);u.kubunBy[d]=f.kubun[d]||[];}
    const h=f.hoken.sort((a,b)=>(toISODate(b['認定有効終了年月日'])||'').localeCompare(toISODate(a['認定有効終了年月日'])||''))[0];
    if(h){const v=x=>x&&x!=='-'?x:'';u.ninteiStatus=v(h['被保険者証認定区分'])||u.ninteiStatus;u.hokensha=v(h['保険者名'])||u.hokensha;u.kaigodo=v(h['要介護度'])||u.kaigodo;
      const ne=toISODate(h['認定有効終了年月日']);if(ne)u.ninteiEnd=ne;
      if(v(h['担当ケアマネ']))u.careMgr=h['担当ケアマネ'];if(v(h['担当居宅支援事業所']))u.kyotaku=h['担当居宅支援事業所'];if(v(h['担当地域包括支援センター']))u.houkatsu=h['担当地域包括支援センター'];}
  }
  // 訪問看護：医療保険の種類・期限、主治医（利用者一覧のCSVから）。障害：負担上限月額（利用者請求CSVから）
  const iryo=new Map(),jogenM=new Map();
  for(const o of Object.values(R.offices||{})){
    for(const r of (o.iryo||[]))iryo.set(normName(r['利用者名']),r);
    for(const r of (o.jogen||[])){const n=+String(r['負担上限月額']||'').replace(/[^\d]/g,'');if(r['負担上限月額']!==''&&!isNaN(n)){const k=normName(r['利用者名']);jogenM.set(k,Math.max(jogenM.get(k)??0,n));}}
  }
  let iryoN=0,jogenN=0;
  for(const u of all.values()){
    const k=normName(u.name);const r=iryo.get(k);
    if(r&&u.depts.includes('ナース')){const v=x=>x&&x!=='-'?x.trim():'';u.iryoType=v(r['医療保険種類']);u.iryoEnd=toISODate(v(r['医療被保証適用期間(至)']));u.hospital=v(r['医療機関名']);u.doctor=v(r['主治医名']);u.hospitalTel=v(r['医療機関電話番号']);if(u.iryoEnd)iryoN++;}
    if(jogenM.has(k)&&u.depts.includes('ヘルパー')){u.jogen=jogenM.get(k);jogenN++;}
  }
  // 区分：同期した部署はカイポケの値、まだ同期していない部署は前の値を残す
  const ORDER=['介護','支援','医療','障害','保険外'];
  let stop=0;const stopNames=[];
  for(const u of [...all.values()]){
    if(!u.depts.length){stopped[u.key]=u;all.delete(u.key);stop++;stopNames.push(u.name);continue;}
    const fromBy=u.depts.flatMap(d=>u.kubunBy[d]||[]);const unsynced=u.depts.some(d=>!(d in u.kubunBy));
    u.kubun=[...new Set([...fromBy,...(unsynced?(u.kubun||[]):[])])].sort((a,b)=>ORDER.indexOf(a)-ORDER.indexOf(b));
    u.using=true;
  }
  S.extra['#stopped']=stopped;
  S.users=[...all.values()].sort((a,b)=>(a.kana||a.name).localeCompare(b.kana||b.name,'ja'));
  S.meta.imports.users={at:new Date().toISOString(),file:'カイポケから自動更新'};
  S.meta.imports.kaipoke={at:new Date().toISOString(),by:ME.name,depts:[...synced]};
  autoDepts();
  ['users','visits','extra','meta','staff'].forEach(k=>DIRTY.add(k));
  return [`カイポケから更新しました（${[...synced].join('・')}）`,
    `利用中の利用者：${S.users.length}名（新規${added}名${back?`・利用再開${back}名`:''}・利用停止で外した方${stop}名）`,
    added?`新規：${addedNames.slice(0,20).join('、')}${added>20?' ほか':''}`:'',
    stop?`利用停止：${stopNames.slice(0,20).join('、')}${stop>20?' ほか':''}`:'',
    iryo.size?`医療保険の期限：${iryoN}名分`:'', jogenM.size?`障害の負担上限月額：${jogenN}名分`:'',
    vSum.length?`予定：${vSum.join('／')}`:''].filter(Boolean).join('\n');
}
function bindImport(){
  const d=$('#drop'),fi=$('#fileIn');if(!d)return;
  const run=async files=>{
    if(!ME){return firstRun(files);}
    $('#impLog').textContent='読み込み中…';const log=await importFiles([...files]);autoDepts();if(DIRTY.size)DIRTY.add('staff');
    try{await flush();log.push('サーバーに保存しました（どの職員の端末からも見られます）');}catch(e){log.push('サーバーに保存できませんでした：'+e.message);}
    render();const el=$('#impLog');if(el)el.innerHTML=log.map(esc).join('<br>');else alert(log.join('\n'));};
  d.onclick=()=>fi.click(); fi.onchange=()=>run(fi.files);
  d.ondragover=e=>{e.preventDefault();d.classList.add('over');}; d.ondragleave=()=>d.classList.remove('over');
  d.ondrop=e=>{e.preventDefault();d.classList.remove('over');run(e.dataTransfer.files);};
}
// 最初の設定：初期設定キー＋職員名簿CSV
async function firstRun(files){
  const key=($('#setupKey')||{}).value||'';if(!key){$('#impLog').textContent='初期設定キーを入れてください';return;}
  S.staffList=[];const log=await importFiles([...files]);DIRTY.clear();
  if(!S.staffList.length){$('#impLog').textContent='職員名簿CSVを入れてください';return;}
  try{const r=await api('initStaff',{key,staff:S.staffList});SETUP={hasStaff:true};render();alert(`職員${r.count}名を登録しました。IDと生年月日8桁でログインしてください。`);}
  catch(e){S.staffList=[];$('#impLog').textContent=e.message;}
}

// ===== 新しい版の確認 =====
// ブラウザに古い画面が残っていると直した内容が反映されないので、起動時と10分ごとに最新版を確かめる
const BUILD=(document.querySelector('meta[name=build]')||{}).content||'';
async function latestBuild(){try{const r=await fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'});const t=await r.text();const m=t.match(/<meta name="build" content="(\d+)">/);return m?m[1]:'';}catch(e){return '';}}
async function checkUpdate(atStart){const b=await latestBuild();if(!b||!BUILD||b<=BUILD)return;
  if(atStart){try{if(sessionStorage.getItem('reloadedFor')===b)return;sessionStorage.setItem('reloadedFor',b);}catch(e){} const p=new URLSearchParams(location.search);p.set('v',b);location.replace(location.pathname+'?'+p.toString());return;}
  if(!document.getElementById('upd')){const d=document.createElement('div');d.id='upd';d.style.cssText='position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#0f766e;color:#fff;padding:10px 16px;border-radius:10px;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.2);font-size:14px';d.innerHTML='ポータルが新しくなりました　<button class="btn" style="background:#fff;color:#0f766e;padding:4px 12px" onclick="location.replace(location.pathname+\'?v='+b+'\')">更新する</button>';document.body.appendChild(d);}}
checkUpdate(true);setInterval(()=>checkUpdate(false),10*60*1000);

// ===== 起動 =====
(async()=>{
  const p=new URLSearchParams(location.search);if(p.get('tab'))TAB=p.get('tab');if(p.get('u'))STATE.camUser=p.get('u');if(p.get('t')&&PHOTO_TYPES.includes(p.get('t')))STATE.camType=p.get('t');
  if(API()&&API()!=='__API_URL__'){
    const cached=TOKEN?cacheLoad():null;
    if(cached){
      // すぐ表示して、裏で最新に入れ替える
      try{applyBoot(cached);render();}catch(e){ME=null;}
      if(ME){busy('最新のデータに更新中…');
        try{await loadAll(true);busy('');if(!ME.passSet)TAB='setpass';const a=document.activeElement;const typing=a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName);if(TAB==='setpass'||(!typing&&TAB!=='camera'))render();}
        catch(e){busy('');if(!TOKEN){ME=null;render();}}
        return;}
    }
    if(TOKEN){try{await loadAll();if(!ME.passSet)TAB='setpass';}catch(e){ME=null;}}
    if(!ME){try{SETUP=await api('setupStatus');}catch(e){$('#main').innerHTML=`<div class="warn">${esc(e.message)}</div>`;return;}}
  }
  render();
})();
