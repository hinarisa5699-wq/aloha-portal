// ===== カイポケから更新（PCのChromeに入れた拡張機能「アロハ業務ポータル カイポケ更新」が読み取る） =====
const KP_DEPTS=['ヘルパー','ナース','ケアマネ','デイサービス'];
const KP_LABEL={'ヘルパー':'訪問介護（介護・支援・障害）','ナース':'訪問看護','ケアマネ':'居宅介護支援','デイサービス':'通所介護'};
function kpExtId(){try{return localStorage.getItem('kp_ext_id')||'';}catch(e){return '';}}
let KP_SEL=null;
function kpCard(){
  if(!KP_SEL){let v=null;try{v=JSON.parse(localStorage.getItem('kp_depts')||'null');}catch(e){} KP_SEL=new Set(Array.isArray(v)&&v.length?v:KP_DEPTS);}
  const im=S.meta.imports||{};const k=im.kaipoke;
  const ext=kpExtId();
  return `<div class="card"><h2>カイポケから更新</h2>
  <p class="note">選んだ部署の利用者（新規・利用中・利用停止）と、訪問介護のシフト・訪問看護のスケジュール（今月・来月）をカイポケから読み、ポータルを最新にします。利用停止になった方は一覧から外れます（写真や記録は消えません。利用再開すれば戻ります）。</p>
  <div class="row" style="margin:8px 0">${KP_DEPTS.map(d=>`<label style="margin-right:14px;white-space:nowrap"><input type="checkbox" id="kp_${d}" ${KP_SEL.has(d)?'checked':''} onchange="kpToggle('${d}',this.checked)"> ${esc(d)} <span class="note">${esc(KP_LABEL[d])}</span></label>`).join('')}</div>
  <div class="row"><button class="btn" id="kpBtn" onclick="kpSync()" ${ext?'':'disabled'}>カイポケから更新</button>
  <span class="note">${ext?'このPCのカイポケにログインした状態で押してください（1分ほどかかります）。':'このPCには拡張機能「アロハ業務ポータル カイポケ更新」が入っていません。カイポケにログインしているPCのChromeに入れると押せるようになります。'}</span></div>
  ${k?`<p class="note" style="margin-top:6px">前回の更新：${new Date(k.at).toLocaleString('ja-JP')}（${esc(k.by||'')}・${esc((k.depts||[]).join('・'))}）</p>`:''}
  <div id="kpLog" class="note" style="margin-top:8px;white-space:pre-wrap"></div></div>`;
}
function kpToggle(d,on){on?KP_SEL.add(d):KP_SEL.delete(d);try{localStorage.setItem('kp_depts',JSON.stringify([...KP_SEL]));}catch(e){}}
function kpLog(t){const el=$('#kpLog');if(el)el.textContent+=(el.textContent?'\n':'')+t;}
async function kpSync(){
  const depts=KP_DEPTS.filter(d=>KP_SEL.has(d));if(!depts.length){alert('部署を選んでください');return;}
  const id=kpExtId();if(!id||!window.chrome||!chrome.runtime||!chrome.runtime.connect){alert('拡張機能「アロハ業務ポータル カイポケ更新」が見つかりません');return;}
  const nm=new Date(TODAY.getFullYear(),TODAY.getMonth()+1,1);const months=[TODAY_ISO.slice(0,7),iso(nm).slice(0,7)];
  const btn=$('#kpBtn');if(btn)btn.disabled=true;$('#kpLog').textContent='';kpLog('カイポケに接続しています…');
  try{
    const result=await new Promise((res,rej)=>{
      let port;try{port=chrome.runtime.connect(id,{name:'kaipoke-sync'});}catch(e){rej(new Error('拡張機能に接続できません'));return;}
      let done=false;
      port.onMessage.addListener(m=>{if(m.type==='progress')kpLog(m.text);else if(m.type==='done'){done=true;res(m.result);port.disconnect();}else if(m.type==='error'){done=true;rej(new Error(m.error));port.disconnect();}});
      port.onDisconnect.addListener(()=>{if(!done)rej(new Error('拡張機能との接続が切れました（拡張機能が古いか、無効になっています）'));});
      port.postMessage({type:'sync',depts,months});
    });
    kpLog('ポータルに反映しています…');
    const msg=applyKaipoke(result);
    await flush();kpLog(msg+'\nサーバーに保存しました。');
    render();const el=$('#kpLog');if(el)el.textContent=msg+'\nサーバーに保存しました。';
  }catch(e){kpLog('止まりました：'+e.message);}
  finally{const b=$('#kpBtn');if(b)b.disabled=false;}
}
// カイポケから読んだ利用者・被保険者証・予定をポータルに反映（選んだ部署だけ。ほかの部署はそのまま）
function applyKaipoke(R){
  const synced=new Set(R.depts);
  const addrOf=u=>[[u['都道府県'],u['市区町村'],u['町名以下']].join(''),u['建物名']].map(x=>(x||'').replace(/\s+/g,' ').trim()).filter(Boolean).join(' ');
  // 予定（今月・来月）を置き換え
  const vSum=[];
  for(const [kind,src,label] of [['houkai','訪介','訪問介護シフト'],['houkan','訪看','訪問看護スケジュール'],['day','デイ','デイサービス利用予定']]){
    const byYm=(R.visits||{})[kind];if(!byYm)continue;
    for(const [ym,list] of Object.entries(byYm)){
      S.visits=S.visits.filter(v=>!(v.src===src&&v.date.startsWith(ym)));
      for(const v of list){const o={src,staff:v.staff,date:v.date,start:v.start,end:v.end,user:v.user,service:v.service};if(v.note)o.note=v.note;if(v.other)o.other=true;if(v.oncall)o.oncall=true;S.visits.push(o);}
      vSum.push(`${label} ${ym.replace('-','年')}月 ${list.length}件`);
    }
    S.meta.imports[kind]={at:new Date().toISOString(),file:'カイポケから自動更新',ym:Object.keys(byYm).join('・')};
  }
  // 訪看の区分（介護・医療・保険外）は予定から
  const nurseKubun=new Map();
  for(const v of S.visits){if(v.src!=='訪看'||v.other||!v.user||!/^(介護|医療|保険外)$/.test(v.service))continue;const k=normName(v.user);if(!nurseKubun.has(k))nurseKubun.set(k,new Set());nurseKubun.get(k).add(v.service);}
  // カイポケの利用者を1人1件にまとめる
  const fresh=new Map();
  for(const o of Object.values(R.offices||{})){
    const dept=o.dept;const latestH=new Map();
    for(const h of (o.hoken||[])){const k=normName(h['利用者名']);const p=latestH.get(k);if(!p||(toISODate(h['認定有効終了年月日'])||'')>(toISODate(p['認定有効終了年月日'])||''))latestH.set(k,h);}
    for(const u of (o.users||[])){
      const name=u['利用者名'];if(!name)continue;const birth=toISODate(u['利用者生年月日']);
      const key=normName(u['利用者カナ']||name)+'|'+birth;
      let f=fresh.get(key);if(!f){f={key,name,kana:u['利用者カナ']||'',birth,sex:u['性別']||'',address:addrOf(u),depts:new Set(),kubun:{},hoken:[]};fresh.set(key,f);}
      if(!f.address)f.address=addrOf(u);
      if(/利用中|一時停止/.test(u['利用者状態']||'')){
        f.depts.add(dept);
        let kb=o.kubun?[o.kubun]:dept==='ナース'?[...(nurseKubun.get(normName(name))||[])]:[];
        f.kubun[dept]=[...new Set([...(f.kubun[dept]||[]),...kb])];
        const h=latestH.get(normName(name));if(h)f.hoken.push(h);
      }
    }
  }
  S.extra=S.extra||{};const stopped=S.extra['#stopped']||{};
  const all=new Map(S.users.map(u=>[u.key,u]));
  const byNB=new Map(S.users.map(u=>[normName(u.name)+'|'+(u.birth||''),u]));
  for(const u of all.values()){u.kubunBy=u.kubunBy||{};u.depts=u.depts.filter(d=>!synced.has(d));for(const d of synced)delete u.kubunBy[d];}
  let added=0,back=0;const addedNames=[];
  for(const f of fresh.values()){
    let u=all.get(f.key)||byNB.get(normName(f.name)+'|'+f.birth);
    if(!u&&stopped[f.key]&&f.depts.size){u=stopped[f.key];delete stopped[f.key];u.kubunBy=u.kubunBy||{};u.depts=(u.depts||[]).filter(d=>!synced.has(d));all.set(u.key,u);back++;}
    if(!u){if(!f.depts.size)continue;u={key:f.key,name:f.name,kana:f.kana,birth:f.birth,sex:f.sex,depts:[],kubun:[],kubunBy:{},using:true,ninteiStatus:'',hokensha:'',kaigodo:'',ninteiEnd:'',careMgr:'',kyotaku:'',houkatsu:'',iryoType:'',iryoEnd:'',jogen:null};all.set(u.key,u);added++;addedNames.push(f.name);}
    u.name=f.name;if(f.kana)u.kana=f.kana;if(f.birth)u.birth=f.birth;if(f.sex)u.sex=f.sex;if(f.address)u.address=f.address;
    for(const d of f.depts){if(!u.depts.includes(d))u.depts.push(d);u.kubunBy[d]=f.kubun[d]||[];}
    const h=f.hoken.sort((a,b)=>(toISODate(b['認定有効終了年月日'])||'').localeCompare(toISODate(a['認定有効終了年月日'])||''))[0];
    if(h){const v=x=>x&&x!=='-'?x:'';u.ninteiStatus=v(h['被保険者証認定区分'])||u.ninteiStatus;u.hokensha=v(h['保険者名'])||u.hokensha;u.kaigodo=v(h['要介護度'])||u.kaigodo;
      const ne=toISODate(h['認定有効終了年月日']);if(ne)u.ninteiEnd=ne;
      if(v(h['担当ケアマネ']))u.careMgr=h['担当ケアマネ'];if(v(h['担当居宅支援事業所']))u.kyotaku=h['担当居宅支援事業所'];if(v(h['担当地域包括支援センター']))u.houkatsu=h['担当地域包括支援センター'];}
  }
  // 訪問看護：医療保険の種類・期限、主治医（利用者一覧のCSVから）。障害：負担上限月額（利用者請求CSVから）
  const iryo=new Map(),jogenM=new Map();
  for(const o of Object.values(R.offices||{})){
    for(const r of (o.iryo||[]))iryo.set(normName(r['利用者名']),r);
    for(const r of (o.jogen||[])){const n=+String(r['負担上限月額']||'').replace(/[^\d]/g,'');if(r['負担上限月額']!==''&&!isNaN(n)){const k=normName(r['利用者名']);jogenM.set(k,Math.max(jogenM.get(k)??0,n));}}
  }
  let iryoN=0,jogenN=0;
  for(const u of all.values()){
    const k=normName(u.name);const r=iryo.get(k);
    if(r&&u.depts.includes('ナース')){const v=x=>x&&x!=='-'?x.trim():'';u.iryoType=v(r['医療保険種類']);u.iryoEnd=toISODate(v(r['医療被保証適用期間(至)']));u.hospital=v(r['医療機関名']);u.doctor=v(r['主治医名']);u.hospitalTel=v(r['医療機関電話番号']);if(u.iryoEnd)iryoN++;}
    if(jogenM.has(k)&&u.depts.includes('ヘルパー')){u.jogen=jogenM.get(k);jogenN++;}
  }
  // 区分：同期した部署はカイポケの値、まだ同期していない部署は前の値を残す
  const ORDER=['介護','支援','医療','障害','保険外'];
  let stop=0;const stopNames=[];
  for(const u of [...all.values()]){
    if(!u.depts.length){stopped[u.key]=u;all.delete(u.key);stop++;stopNames.push(u.name);continue;}
    const fromBy=u.depts.flatMap(d=>u.kubunBy[d]||[]);const unsynced=u.depts.some(d=>!(d in u.kubunBy));
    u.kubun=[...new Set([...fromBy,...(unsynced?(u.kubun||[]):[])])].sort((a,b)=>ORDER.indexOf(a)-ORDER.indexOf(b));
    u.using=true;
  }
  S.extra['#stopped']=stopped;
  S.users=[...all.values()].sort((a,b)=>(a.kana||a.name).localeCompare(b.kana||b.name,'ja'));
  S.meta.imports.users={at:new Date().toISOString(),file:'カイポケから自動更新'};
  S.meta.imports.kaipoke={at:new Date().toISOString(),by:ME.name,depts:[...synced]};
  autoDepts();
  ['users','visits','extra','meta','staff'].forEach(k=>DIRTY.add(k));
  return [`カイポケから更新しました（${[...synced].join('・')}）`,
    `利用中の利用者：${S.users.length}名（新規${added}名${back?`・利用再開${back}名`:''}・利用停止で外した方${stop}名）`,
    added?`新規：${addedNames.slice(0,20).join('、')}${added>20?' ほか':''}`:'',
    stop?`利用停止：${stopNames.slice(0,20).join('、')}${stop>20?' ほか':''}`:'',
    iryo.size?`医療保険の期限：${iryoN}名分`:'', jogenM.size?`障害の負担上限月額：${jogenN}名分`:'',
    vSum.length?`予定：${vSum.join('／')}`:''].filter(Boolean).join('\n');
}
function bindImport(){
  const d=$('#drop'),fi=$('#fileIn');if(!d)return;
  const run=async files=>{
    if(!ME){return firstRun(files);}
    $('#impLog').textContent='読み込み中…';const log=await importFiles([...files]);autoDepts();if(DIRTY.size)DIRTY.add('staff');
    try{await flush();log.push('サーバーに保存しました（どの職員の端末からも見られます）');}catch(e){log.push('サーバーに保存できませんでした：'+e.message);}
    render();const el=$('#impLog');if(el)el.innerHTML=log.map(esc).join('<br>');else alert(log.join('\n'));};
  d.onclick=()=>fi.click(); fi.onchange=()=>run(fi.files);
  d.ondragover=e=>{e.preventDefault();d.classList.add('over');}; d.ondragleave=()=>d.classList.remove('over');
  d.ondrop=e=>{e.preventDefault();d.classList.remove('over');run(e.dataTransfer.files);};
}
// 最初の設定：初期設定キー＋職員名簿CSV
async function firstRun(files){
  const key=($('#setupKey')||{}).value||'';if(!key){$('#impLog').textContent='初期設定キーを入れてください';return;}
  S.staffList=[];const log=await importFiles([...files]);DIRTY.clear();
  if(!S.staffList.length){$('#impLog').textContent='職員名簿CSVを入れてください';return;}
  try{const r=await api('initStaff',{key,staff:S.staffList});SETUP={hasStaff:true};render();alert(`職員${r.count}名を登録しました。IDと生年月日8桁でログインしてください。`);}
  catch(e){S.staffList=[];$('#impLog').textContent=e.message;}
}

// ===== 新しい版の確認 =====
// ブラウザに古い画面が残っていると直した内容が反映されないので、起動時と10分ごとに最新版を確かめる
const BUILD=(document.querySelector('meta[name=build]')||{}).content||'';
async function latestBuild(){try{const r=await fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'});const t=await r.text();const m=t.match(/<meta name="build" content="(\d+)">/);return m?m[1]:'';}catch(e){return '';}}
async function checkUpdate(atStart){const b=await latestBuild();if(!b||!BUILD||b<=BUILD)return;
  if(atStart){try{if(sessionStorage.getItem('reloadedFor')===b)return;sessionStorage.setItem('reloadedFor',b);}catch(e){} const p=new URLSearchParams(location.search);p.set('v',b);location.replace(location.pathname+'?'+p.toString());return;}
  if(!document.getElementById('upd')){const d=document.createElement('div');d.id='upd';d.style.cssText='position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#0f766e;color:#fff;padding:10px 16px;border-radius:10px;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.2);font-size:14px';d.innerHTML='ポータルが新しくなりました　<button class="btn" style="background:#fff;color:#0f766e;padding:4px 12px" onclick="location.replace(location.pathname+\'?v='+b+'\')">更新する</button>';document.body.appendChild(d);}}
checkUpdate(true);setInterval(()=>checkUpdate(false),10*60*1000);

// ===== 起動 =====
(async()=>{
  const p=new URLSearchParams(location.search);if(p.get('tab'))TAB=p.get('tab');if(p.get('u'))STATE.camUser=p.get('u');if(p.get('t')&&PHOTO_TYPES.includes(p.get('t')))STATE.camType=p.get('t');
  if(API()&&API()!=='__API_URL__'){
    const cached=TOKEN?cacheLoad():null;
    if(cached){
      // すぐ表示して、裏で最新に入れ替える
      try{applyBoot(cached);render();}catch(e){ME=null;}
      if(ME){busy('最新のデータに更新中…');
        try{await loadAll(true);busy('');if(!ME.passSet)TAB='setpass';const a=document.activeElement;const typing=a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName);if(TAB==='setpass'||(!typing&&TAB!=='camera'))render();}
        catch(e){busy('');if(!TOKEN){ME=null;render();}}
        return;}
    }
    if(TOKEN){try{await loadAll();if(!ME.passSet)TAB='setpass';}catch(e){ME=null;}}
    if(!ME){try{SETUP=await api('setupStatus');}catch(e){$('#main').innerHTML=`<div class="warn">${esc(e.message)}</div>`;return;}}
  }
  render();
})();
</script>
<div id="cardPrint"></div>
</body>
</html>
