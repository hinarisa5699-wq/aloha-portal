<style>
:root{--bg:#eef9f7;--card:#fff;--ink:#1f2d3a;--sub:#5b6b78;--line:#c9e7e3;--accent:#0b8a94;--accent-soft:#dff4f2;--red:#c0264f;--red-soft:#fde8ee;--amber:#9a6a00;--amber-soft:#fff3d6;--blue:#1d4ed8;--blue-soft:#e6efff;--pink:#ec6f93;--pink-soft:#fde9ef;--sun:#f7b733;--frame:#7cc9c1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Yu Gothic UI","Hiragino Sans",Meiryo,sans-serif;font-size:14px}
header{background:var(--accent);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}

nav button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px}
.note{color:var(--sub);font-size:12.5px;line-height:1.6}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer}
.stat b{display:block;font-size:24px;margin-top:4px}
.stat.red b{color:var(--red)}.stat.amber b{color:var(--amber)}
table{width:100%;border-collapse:collapse;font-size:13px}table.ns th{position:static}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
th{background:#f9fafb;color:var(--sub);font-weight:600;position:sticky;top:44px}
.tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:999px;background:#f1f5f9;color:#334155;margin:1px 2px 1px 0}
.tag.red{background:var(--red-soft);color:var(--red)}.tag.amber{background:var(--amber-soft);color:var(--amber)}.tag.green{background:var(--accent-soft);color:var(--accent)}.tag.gray{background:#eef0f3;color:#475569}.tag.blue{background:var(--blue-soft);color:var(--blue)}
button.btn,label.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer;font-family:inherit;display:inline-block}
button.btn.sub,label.btn.sub{background:#fff;color:var(--accent)}
button.btn.danger{background:#fff;color:var(--red);border-color:var(--red)}
input,select,textarea{font-family:inherit;font-size:14px;padding:7px 9px;border:1px solid #cbd5e1;border-radius:8px;background:#fff}
.drop{border:2px dashed #94a3b8;border-radius:12px;padding:28px;text-align:center;color:var(--sub);background:#fafafa;cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.list-user{cursor:pointer}.list-user:hover{background:#f8fafc}
.split{display:grid;grid-template-columns:320px 1fr;gap:14px}
@media(max-width:800px){.split{grid-template-columns:1fr}th{top:0}}
.ulist{max-height:70vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
.ulist div{padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.ulist div.on{background:var(--accent-soft)}
.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;word-break:break-all}
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}.modalbox{background:var(--card,#fff);border-radius:16px;max-width:560px;width:100%;max-height:80vh;overflow:auto;padding:18px 18px 14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.narrowonly{display:none}@media(max-width:800px){.narrowonly{display:block}}
.kv{display:grid;grid-template-columns:130px 1fr;gap:4px 10px;font-size:13.5px}
.kv dt{color:var(--sub)}.kv dd{margin:0}
.photos{display:flex;flex-wrap:wrap;gap:10px}
.photo{width:150px;font-size:12px;color:var(--sub)}
.photo img{width:150px;height:110px;object-fit:cover;object-position:center top;border-radius:8px;border:1px solid var(--line);display:block;cursor:zoom-in}
.tl{position:relative;height:26px;background:#f1f5f9;border-radius:6px;overflow:hidden}
.tl .busy{position:absolute;top:0;bottom:0;background:#0f766e;opacity:.85;border-right:1px solid #fff}

.freeview .tl{background:#f7fcfb;border:1px solid var(--line)}
.freeview .tl .busy{background:#9fd0f5;opacity:1;border-right:1px solid #fff}
.freeview .tl .busy.other{background:#cdc4ec}
.tl .free{position:absolute;top:2px;bottom:2px;background:#f7a8c4;opacity:1;border-radius:6px}
.tl .brk{position:absolute;top:2px;bottom:2px;background:#fde08c;opacity:1;border-radius:6px}
.freesum{color:#d6517f;font-weight:bold;font-size:14px}
.tlhead{position:relative;height:16px;font-size:10.5px;color:var(--sub)}
.tlhead span{position:absolute;transform:translateX(-50%)}
.talkwrap{display:flex;gap:10px;min-height:360px}.talkside{width:220px;flex-shrink:0}.talklist{max-height:430px;overflow:auto;border-right:1px solid var(--line)}.talklist>div{padding:7px 8px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px}.talklist>div.on{background:var(--accent-soft)}
.talkpane{flex:1;display:flex;flex-direction:column;min-width:0}.talkhead{font-weight:bold;padding:4px 6px;border-bottom:1px solid var(--line)}.talkmsgs{flex:1;max-height:400px;overflow:auto;padding:8px;background:#f3faf8;border-radius:10px;margin:6px 0}
.bub{max-width:80%;margin:6px 0;display:flex;flex-direction:column}.bub.out{margin-left:auto;align-items:flex-end}.bub .bt{white-space:pre-wrap;padding:8px 12px;border-radius:14px;font-size:14px;line-height:1.5}.bub.out .bt{background:#d9f2dc}.bub.in .bt{background:#fff;border:1px solid var(--line)}.bub .bm{font-size:11px;color:var(--sub);margin-top:2px}
.talkin{display:flex;gap:6px}.talkin textarea{flex:1}.talkmsgs{overflow-x:hidden}.bub{min-width:0}.bub .bt{overflow-wrap:anywhere;max-width:100%}.talkhead .note{overflow-wrap:anywhere}.talkin textarea{min-width:0}@media(max-width:800px){main{overflow-x:clip}}.tag.pink{background:var(--pink-soft);color:var(--pink)}
@media(max-width:640px){.talkwrap{flex-direction:column;min-height:0}.talkside{width:auto}.talklist{max-height:none;overflow:visible;border-right:0}.talkwrap.m-list .talkpane{display:none}.talkwrap.m-chat .talkside{display:none}.talkmsgs{max-height:58vh}.talkhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--accent-soft);border-radius:10px;padding:8px 10px}}
.talkback{display:none}@media(max-width:640px){.talkback{display:inline-block;border:2px solid var(--accent);background:#fff;color:var(--accent);border-radius:10px;padding:6px 12px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer}}
@media(max-width:640px){.rtable tr:first-child{display:none}.rtable,.rtable tbody,.rtable tr,.rtable td{display:block;width:auto}.rtable tr{border:2px solid #d5ece9;border-radius:12px;margin:10px 0;padding:8px 12px;background:#fff}.rtable td{border:0!important;padding:3px 0}.rtable td[data-l]::before{content:attr(data-l)'：';color:var(--sub);font-size:12px;font-weight:600}.rtable td.list-user b{font-size:16px}}
@media(max-width:800px){nav.more{-webkit-mask-image:linear-gradient(to right,#000 82%,transparent);mask-image:linear-gradient(to right,#000 82%,transparent)}}
.msg{white-space:pre-wrap;background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px}
.warn{background:var(--red-soft);color:var(--red);border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:13px}
.ok{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:13px}
.typebtns{display:flex;flex-wrap:wrap;gap:8px}
.typebtns button{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:10px 12px;font-size:14px;font-family:inherit;cursor:pointer}
.typebtns button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#preview{max-width:100%;max-height:50vh;border-radius:10px;margin-top:10px;display:none}
.camwrap{position:relative;margin-top:12px;background:#000;border-radius:12px;overflow:hidden;max-width:720px}
.camwrap video{display:block;width:100%;max-height:65vh;object-fit:contain;background:#000}
.camguide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.camguide i{display:block;border:3px dashed rgba(255,255,255,.85);box-shadow:0 0 0 2000px rgba(0,0,0,.25)}
.camview{position:relative}
.camguide i.g-card{width:80%;max-height:84%;aspect-ratio:1.58;border-radius:12px}
.camguide i.g-paper{height:86%;max-width:90%;aspect-ratio:.71;border-radius:6px}
.camguide i.g-face{height:78%;max-width:80%;aspect-ratio:.8;border-radius:50%}
.camguide span{position:absolute;top:8px;left:50%;transform:translateX(-50%);max-width:92%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;color:#fff;font-size:12px;background:rgba(0,0,0,.55);padding:4px 10px;border-radius:8px}
.cambar{display:flex;align-items:center;justify-content:center;gap:28px;padding:12px;background:#111}
.shutter{width:72px;height:72px;border-radius:50%;border:5px solid #fff;background:#fff;box-shadow:inset 0 0 0 4px #111;cursor:pointer}
.shutter:active{transform:scale(.94)}
.cambar .cbtn{background:none;border:1px solid #666;color:#fff;border-radius:8px;padding:8px 12px;font-size:14px;font-family:inherit;cursor:pointer}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:20}
.zoom img{max-width:95vw;max-height:92vh}
.hide{display:none}
@media print{header,nav,.noprint{display:none!important}.card{border:0}th{position:static}}
#cardPrint{display:none}
@page tate{size:100mm 148mm;margin:0}
@page yoko{size:148mm 100mm;margin:0}
@media print{body.pcards>*:not(#cardPrint){display:none!important}body.pcards #cardPrint{display:block}
#cardPrint .pg{break-after:page;display:flex;align-items:center;justify-content:center;overflow:hidden}

#cardPrint .pg img{width:100%;height:100%;object-fit:contain}}

#printGo{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:9999}#printGo div{background:#fff;border-radius:16px;padding:22px;text-align:center;max-width:320px}
.cardedit{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px;align-items:start}
@media(max-width:760px){.cardedit{grid-template-columns:1fr}}
#cardCv{width:100%;height:auto;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.15);touch-action:none;cursor:grab;background:#D9E2F3}
.seg{display:inline-flex;border:1px solid var(--accent);border-radius:8px;overflow:hidden}.seg button{border:0;background:#fff;color:var(--accent);padding:8px 16px;font-size:14px;font-family:inherit;cursor:pointer}.seg button.on{background:var(--accent);color:#fff}

/* ===== アロハ調（パステル＋枠をはっきり） ===== */
body{background:linear-gradient(180deg,#e6f7f4 0%,#f3fbf9 35%,#fff8ec 100%) fixed;font-size:14.5px}
header{background:linear-gradient(100deg,#0b8a94 0%,#22b3b0 55%,#5fc9b8 100%);padding:12px 18px;box-shadow:0 2px 8px rgba(11,138,148,.25)}
header h1::before{content:"🌺 ";}
header h1{letter-spacing:.04em}
nav{background:#fffdf7;border-bottom:2px solid var(--frame);padding:6px 8px;gap:6px}
nav button{border:2px solid transparent;border-radius:999px;padding:8px 14px;color:#2f5f63;font-weight:600}
nav button:hover{background:var(--accent-soft)}
nav button.on{background:var(--accent);color:#fff;border-color:var(--accent);border-bottom-color:var(--accent)}
.card{border:2px solid var(--frame);border-radius:16px;box-shadow:0 3px 10px rgba(11,138,148,.08);padding:16px 18px}
.card h2{font-size:16px;color:#0a5f66;border-left:6px solid var(--pink);padding-left:10px;line-height:1.4}
.stat{border:2px solid var(--frame);border-radius:16px;background:#fff;box-shadow:0 3px 8px rgba(11,138,148,.08)}
.stat:nth-child(6n+1){background:#fff1f5}.stat:nth-child(6n+2){background:#fff8e1}.stat:nth-child(6n+3){background:#e8f7f5}
.stat:nth-child(6n+4){background:#eef4ff}.stat:nth-child(6n+5){background:#f6efff}.stat:nth-child(6n+6){background:#effaea}
.stat:hover{transform:translateY(-1px);box-shadow:0 5px 12px rgba(11,138,148,.15)}
th{background:#e3f5f2;color:#2f5f63;border-bottom:2px solid var(--frame)}
th,td{border-bottom:1px solid #d5ece9}
input,select,textarea{border:2px solid var(--frame);border-radius:10px;background:#fffef8;padding:8px 10px;font-size:15px;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pink);box-shadow:0 0 0 3px rgba(236,111,147,.2);background:#fff}
input::placeholder,textarea::placeholder{color:#8aa3a8}
input[type=checkbox],input[type=radio]{width:20px;height:20px;accent-color:var(--accent);padding:0;vertical-align:middle;cursor:pointer;flex:none}
input[type=file]{background:#fff;border-style:dashed}
button.btn,label.btn{border:2px solid var(--accent);background:var(--accent);border-radius:999px;padding:8px 18px;font-weight:700;box-shadow:0 2px 0 #06646c}
button.btn:hover,label.btn:hover{filter:brightness(1.07)}
button.btn:active,label.btn:active{transform:translateY(1px);box-shadow:none}
button.btn.sub,label.btn.sub{background:#fff;color:var(--accent);box-shadow:0 2px 0 #b6e0db}
button.btn.danger{border-color:var(--red);color:var(--red);box-shadow:0 2px 0 #f3c3d0}
button:disabled{opacity:.5;cursor:default}
.tag{border:1px solid #cfe3e6;background:#f2f8f9}
.tag.red{border-color:#f5c2d0}.tag.amber{border-color:#f5dc9c}.tag.green{border-color:#a9dcd6}.tag.blue{border-color:#bcd0fb}
.drop{border:3px dashed var(--frame);background:#f4fbfa;border-radius:16px;color:#2f5f63;font-weight:600}
.drop:hover{background:var(--accent-soft)}
.drop.over{border-color:var(--pink);background:var(--pink-soft)}
.ulist{border:2px solid var(--frame);border-radius:12px;background:#fff}
.ulist div.on{background:var(--accent-soft);border-left:5px solid var(--pink)}
.list-user:hover,.ulist div:hover{background:#f4fbfa}
.tl{background:#eef3f5;border:1px solid #d5e3e6}
.msg{background:#fffdf6;border:2px solid #f1e3c4}
.warn{border:2px solid #f5c2d0}.ok{border:2px solid #a9dcd6}
.typebtns button{border:2px solid var(--frame);border-radius:12px}
.seg{border-width:2px;border-radius:999px}
details summary{cursor:pointer}

<body>

<script>
// ===== 基本 =====
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const TODAY=new Date();TODAY.setHours(0,0,0,0);const TODAY_ISO=iso(TODAY);
const WD='日月火水木金土';
const md=s=>{if(!s)return'';const d=new Date(s+'T00:00');return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`};
const mdy=s=>{if(!s)return'';return (s.slice(0,4)==String(TODAY.getFullYear())?'':s.slice(0,4)+'/')+md(s)};
const daysTo=s=>Math.round((new Date(s+'T00:00')-TODAY)/864e5);
const normName=s=>String(s||'').replace(/[\s　★☆＊*]/g,'').replace(/様$/,'').replace(/髙/g,'高').replace(/﨑/g,'崎').replace(/德/g,'徳').replace(/濵/g,'浜');
const PHOTO_TYPES=['介護保険証','負担割合証','医療保険証','受給者証','上限管理票','指示書','提供票','顔写真（基本情報）','顔写真（誕生日）','その他'];
// 和暦・西暦の日付を YYYY-MM-DD に
function toISODate(s){
  s=String(s||'').trim(); if(!s||s==='-') return '';
  let m=s.match(/(\d{4})[-\/年](\d{1,2})[-\/月](\d{1,2})/); if(m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  m=s.match(/(令和|平成|昭和)(\d+|元)年(\d{1,2})月(\d{1,2})日/);
  if(m){const base={令和:2018,平成:1988,昭和:1925}[m[1]];const y=base+(m[2]==='元'?1:+m[2]);return `${y}-${pad(m[3])}-${pad(m[4])}`;}
  return '';
}
function ageOn(birth,on){if(!birth)return null;const b=new Date(birth+'T00:00');let a=on.getFullYear()-b.getFullYear();if(on.getMonth()<b.getMonth()||(on.getMonth()===b.getMonth()&&on.getDate()<b.getDate()))a--;return a;}

// ===== 保存サーバー（GAS）とのやりとり =====
// 画面を何度作り直しても、データと写真はサーバー（スプレッドシート・ドライブ）に残ります
const DEFAULT_API='https://script.google.com/macros/s/AKfycbzqLpjhu6GyK_JWsHLI6E_8xlMF8bQLFUbxm3FXe0pvwFozTq2wteiPWkh7vMGPyZNO/exec';
const API=()=>{const q=new URLSearchParams(location.search).get('api');if(q){try{localStorage.setItem('portalApi',q);}catch(e){}}let v='';try{v=localStorage.getItem('portalApi')||'';}catch(e){}return v||DEFAULT_API;};
let TOKEN='';try{TOKEN=localStorage.getItem('portalToken')||'';}catch(e){}
function busy(msg){let b=$('#busy');if(!b){b=document.createElement('div');b.id='busy';b.style.cssText='position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:30;display:none';document.body.appendChild(b);}b.textContent=msg||'';b.style.display=msg?'block':'none';}
// 職員画面のデモ（幹部）：架空の職員「アロハ 花子」として職員の画面を見せる。保存・送信はしない
let DEMO=null;
const DEMO_READ=new Set(['choreiList','shareList','shareGet','docList','docGet','docsAll','getPhoto','getThumbs','lwList','diary','shijiList','talkFile']);
// 「職員の画面を見る」は前垣茜さんだけ
function canViewAs(){return !!ME&&normName(ME.name)===normName('前垣 茜');}
function demoPick(){if(!canViewAs())return;
  const bg=document.createElement('div');bg.className='modalbg';bg.id='demoBg';bg.onclick=e=>{if(e.target===bg)bg.remove();};
  const list=S.staffList.filter(s=>s.active&&s.status!=='退職'&&s.role!=='幹部');
  bg.innerHTML=`<div class="modalbox" style="max-width:460px"><h2>職員の画面を見る</h2><p class="note">架空の職員「アロハ 花子」さんとして、職員に見える画面を表示します。予定は見本にした職員の今日から1週間分を借りて表示します。デモ中は保存・送信はされません。</p>
  <label>見本にする職員（部署・雇用区分・予定をまねます）<select id="demoSrc" style="width:100%;margin-top:4px">${list.map(s=>`<option value="${s.id}" ${s.name==='渡邊 由美子'?'selected':''}>${esc(s.name)}（${esc((s.depts||[]).join('・')||'部署なし')}・${esc(s.cls||'')}）</option>`).join('')}</select></label>
  <div class="row" style="margin-top:12px;flex-wrap:wrap"><button class="btn" onclick="demoStart($('#demoSrc').value,true)">この職員本人の画面を見る</button><button class="btn sub" onclick="demoStart($('#demoSrc').value)">アロハ 花子でデモ</button><button class="btn sub" onclick="$('#demoBg').remove()">やめる</button></div>
  <p class="note">「本人の画面を見る」は、その職員がログインしたときと同じ画面（予定・利用者・トーク・自分の書類など）を見られます。説明で映すときは「アロハ 花子でデモ」を使ってください（本物の書類やトークは出ません）。どちらも見るだけで、保存・送信はしません。</p></div>`;
  document.body.appendChild(bg);
}
function demoStart(srcId,real){
  const src=S.staffList.find(s=>String(s.id)===String(srcId));if(!src)return;const b=$('#demoBg');if(b)b.remove();
  if(real){DEMO={me:ME,tab:TAB,mytasks:S.mytasks,src:src.name,real:true};ME=Object.assign({},src,{depts:(src.depts||[]).slice(),demo:true,real:true});S.mytasks=[];TAB='home';document.body.classList.add('demoOn');render();window.scrollTo(0,0);return;}
  const name='アロハ 花子';const end=iso(new Date(TODAY.getTime()+6*864e5));
  const vs=S.visits.filter(v=>isMe2(v.staff,src.name)&&v.date>=TODAY_ISO&&v.date<=end).map(v=>Object.assign({},v,{staff:name,_demo:1}));
  const me={id:'demo',name,cls:src.cls||'パート',depts:(src.depts||[]).slice(),role:'一般',active:true,passSet:true,demo:true,hireDate:src.hireDate||''};
  DEMO={me:ME,tab:TAB,mytasks:S.mytasks,src:src.name};
  S.staffList.push(me);S.visits=S.visits.concat(vs);S.mytasks=[];ME=me;TAB='home';
  document.body.classList.add('demoOn');render();window.scrollTo(0,0);
}
function demoEnd(){if(!DEMO)return;if(!DEMO.real)S.staffList=S.staffList.filter(s=>s.id!=='demo');S.visits=S.visits.filter(v=>!v._demo);S.mytasks=DEMO.mytasks;ME=DEMO.me;TAB='home';DEMO=null;document.body.classList.remove('demoOn');try{videoClose();kisokuClose();}catch(e){}render();window.scrollTo(0,0);}
function demoBar(){if(DEMO&&DEMO.real)return `<div class="demobar">👀 <b>${esc(ME.name)}</b> さん本人の画面を見ています（${esc(ME.role)}・${esc(ME.depts.join('・')||'部署なし')}・${esc(ME.cls||'')}）。見るだけで、保存・送信はされません。本人が自分で書いた「やること」は出ません。<button class="btn sub" style="padding:3px 12px;margin-left:8px" onclick="demoEnd()">前垣の画面に戻る</button></div>`;return DEMO?`<div class="demobar">🎬 デモ表示中：<b>アロハ 花子</b> さん（${esc(ME.depts.join('・')||'部署なし')}・${esc(ME.cls)}）の画面です。予定は${esc(DEMO.src)}さんの分を借りています。保存・送信はされません。<button class="btn sub" style="padding:3px 12px;margin-left:8px" onclick="demoEnd()">デモを終わる</button></div>`:'';}
async function api(action,params={},quiet){
  if(DEMO&&!DEMO_READ.has(action)){alert('デモ表示中なので、保存・送信はしません。');throw new Error('デモ表示中');}
  if(!quiet)busy(action==='getPhoto'?'':'通信中…');
  try{
    let lastErr;
    for(let i=0;i<3;i++){
      let r;try{r=await fetch(API(),{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(Object.assign({action,token:TOKEN},params))});}catch(e){lastErr=new Error('サーバーにつながりませんでした（ネット接続を確認してください）');await new Promise(r=>setTimeout(r,1500));continue;}
      const t=await r.text();let j;try{j=JSON.parse(t);}catch(e){lastErr=new Error('サーバーの応答が読めませんでした');await new Promise(r=>setTimeout(r,1500));continue;}
      if(!j.ok){if(/ログインしてください|期限が切れ/.test(j.error||'')&&!['login','setupStatus','initStaff'].includes(action)){TOKEN='';try{localStorage.removeItem('portalToken');}catch(e){}cacheClear();ME=null;}throw new Error(j.error||'エラー');}
      return j.data;
    }
    throw lastErr;
  }finally{if(!quiet)busy('');}
}
// 変更したデータだけをサーバーへ保存
async function save(...keys){
  if(!keys.length) return;
  const sets={};keys.forEach(k=>sets[k]=k==='staff'?S.staffList:S[k]);
  try{await api('save',{sets});}catch(e){alert('保存できませんでした：'+e.message);throw e;}
}
const DIRTY=new Set();
async function flush(){const k=[...DIRTY];DIRTY.clear();await save(...k);}
const DEFAULT_KW=['至急','緊急','必ず','事故','転倒','救急','入院','死亡','亡くな','中止','キャンセル','変更','感染','発熱','コロナ','インフル','ヒヤリ','苦情','重要'];
let S={users:[],visits:[],staffList:[],notices:[],tasks:[],line:[],meta:{imports:{}},settings:{alertDays:60,workStart:'08:30',workEnd:'17:30',faceRequest:false,keywords:DEFAULT_KW.slice(),taxiDriver:'内田 伸也'}};
let PHOTOS=[];let CLAIMS={};

// ===== 取り込み =====
function decode(buf){try{return new TextDecoder('utf-8',{fatal:true}).decode(buf).replace(/^﻿/,'');}catch(e){return new TextDecoder('shift_jis').decode(buf);}}
function parseCSV(t){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}else if(c==='"')q=true;else if(c===','){row.push(f);f='';}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f='';}else f+=c;}if(f!==''||row.length){row.push(f);rows.push(row);}return rows.filter(r=>r.some(x=>x.trim()!==''));}
function objs(rows){const h=rows[0].map(x=>x.replace(/^﻿/,'').trim());return rows.slice(1).map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]||'').trim()])));}

async function importFiles(files){
  const log=[];
  for(const f of files){
    try{
      const buf=await f.arrayBuffer();
      if(/\.pdf$/i.test(f.name)){log.push(await importHoukanPDF(buf,f.name));continue;}
      if(/\.txt$/i.test(f.name)){log.push(importLine(decode(buf),f.name));continue;}
      const rows=parseCSV(decode(buf)); if(!rows.length){log.push(`${f.name}：中身がありません`);continue;}
      const h=rows[0].join(',');
      if(/1日労働時間/.test(h)&&/(^|,)月(,|$)/.test(h)) log.push(importKot(objs(rows),f.name));
      else if(/町名以下|利用者生年月日/.test(h)) log.push(importUserInfo(objs(rows),f.name));
      else if(/利用者カナ/.test(h)) log.push(importUsers(objs(rows),f.name));
      else if(/ヘルパー名/.test(h)&&/開始時間/.test(h)) log.push(importHoukai(objs(rows),f.name));
      else if(/(^|,)code(,|$)/.test(h)&&/(^|,)name(,|$)/.test(h)) log.push(importStaff(objs(rows).map(r=>({id:r.code,name:r.name,birth:r.birthDate,cls:r.classification})),f.name));
      else if(/(氏名|職員名|名前)/.test(h)&&/生年月日/.test(h)) log.push(importStaff(objs(rows).map(r=>({id:r['ID']||r['番号']||r['コード']||'',name:r['氏名']||r['職員名']||r['名前'],birth:r['生年月日'],cls:r['区分']||r['雇用形態']||''})),f.name));
      else log.push(`${f.name}：どの種類のファイルか判断できませんでした`);
    }catch(e){log.push(`${f.name}：読み込みエラー（${e.message}）`);}
  }
  return log;
}
function importUsers(list,name){
  const map=new Map();
  for(const r of list){
    const nm=r['利用者名']; if(!nm) continue;
    const key=normName(r['利用者カナ']||nm)+'|'+(r['生年月日']||'');
    const u=map.get(key)||{key,name:nm,kana:r['利用者カナ']||'',birth:toISODate(r['生年月日']),sex:r['性別']||'',depts:[],kubun:[],using:false,ninteiStatus:'',hokensha:'',kaigodo:'',ninteiEnd:'',careMgr:'',kyotaku:'',houkatsu:'',iryoType:'',iryoEnd:'',jogen:null};
    const add=(arr,v)=>{v&&v.split(/[・\/]/).forEach(x=>{x=x.trim();if(x&&!arr.includes(x))arr.push(x);});};
    add(u.depts,r['部署']); add(u.kubun,r['区分']);
    if(r['利用者状態']==='利用中') u.using=true;
    const set=(k,v)=>{if(v&&v!=='-'&&!u[k])u[k]=v;};
    set('ninteiStatus',r['被保険者証認定区分']); set('hokensha',r['保険者名']); set('kaigodo',r['要介護度']);
    set('careMgr',r['担当ケアマネ']); set('kyotaku',r['担当居宅支援事業所']); set('houkatsu',r['担当地域包括支援センター']); set('iryoType',r['医療保険種類']); set('address',r['住所']);
    const ne=toISODate(r['認定有効終了年月日']); if(ne&&(!u.ninteiEnd||ne>u.ninteiEnd)) u.ninteiEnd=ne;
    const ie=toISODate(r['医療保険適用期間(至)']); if(ie&&(!u.iryoEnd||ie>u.iryoEnd)) u.iryoEnd=ie;
    const j=r['障害_負担上限月額']; if(j!==''&&j!=null&&!isNaN(+j)) u.jogen=Math.max(u.jogen??0,+j);
    map.set(key,u);
  }
  S.users=[...map.values()].sort((a,b)=>(a.kana||a.name).localeCompare(b.kana||b.name,'ja'));
  applyExtra();
  S.meta.imports.users={at:new Date().toISOString(),file:name};DIRTY.add('users');DIRTY.add('meta');
  return `利用者一覧：${list.length}行 → ${S.users.length}名に整理しました`;
}
// 初期の役割：役員＝幹部、事業所の管理者4名＝管理者（あとから職員管理で変えられる）
const DEFAULT_MANAGERS=['前垣祐輔','川端英芽','谷井恭子','菊地順子'];
function defaultRole(r){if(/役員/.test(r.cls||''))return '幹部';if(DEFAULT_MANAGERS.includes(normName(r.name)))return '管理者';return '一般';}
// カイポケの利用者情報CSV（通所・居宅支援など）から、生年月日・性別・住所だけを補う
// ※このCSVには銀行・口座番号も入っているが、ここでは読まず保存もしない
function importUserInfo(list,name){
  S.extra=S.extra||{};let n=0;
  for(const r of list){const nm=r['利用者名'];if(!nm)continue;
    const addr=[[r['都道府県'],r['市区町村'],r['町名以下']].join(''),r['建物名']].map(x=>(x||'').replace(/\s+/g,' ').trim()).filter(Boolean).join(' ');
    S.extra[normName(nm)]={name:nm,kana:r['利用者カナ']||'',birth:toISODate(r['利用者生年月日']),sex:r['性別']||'',address:addr};n++;}
  const filled=applyExtra();
  S.meta.imports.userinfo={at:new Date().toISOString(),file:name};DIRTY.add('extra');DIRTY.add('users');DIRTY.add('meta');
  return `利用者情報：${n}名分を読み、${filled}名の生年月日・住所などを補いました（口座などの列は保存していません）`;
}
// 全利用者CSVで空欄のところだけを補う（全利用者CSVを取り込み直しても消えない）
function applyExtra(){
  if(!S.extra) return 0;let filled=0;
  for(const u of S.users){const x=S.extra[normName(u.name)];if(!x)continue;let ch=false;
    if(!u.birth&&x.birth){u.birth=x.birth;ch=true;} if(!u.sex&&x.sex){u.sex=x.sex;ch=true;} if(!u.kana&&x.kana){u.kana=x.kana;ch=true;}
    if(x.address&&(!u.address||u.address.length<x.address.length)){u.address=x.address;ch=true;}
    if(ch)filled++;}
  return filled;
}
// KOTの従業員CSV（曜日ごとの勤務予定）：職員の空き計算に使う。使うのは氏名・曜日の時間・祝日・休業期間・退職済みだけ
function importKot(list,name){
  const kot={};const days=['月','火','水','木','金','土','日'];let n=0;
  const cell=v=>{v=String(v||'').trim();if(!v)return null;if(/^休/.test(v))return 'off';const m=v.match(/(\d{1,2}:\d{2})\s*-\s*(\d{1,2}:\d{2})/);return m?[m[1].padStart(5,'0'),m[2].padStart(5,'0')]:null;};
  for(const r of list){const nm=r['氏名'];if(!nm)continue;
    if(String(r['退職済み']||'')==='1'){continue;}
    const leave=[];String(r['休業期間']||'').split(/[,、\s]+/).forEach(x=>{const m=x.match(/(\d{4}-\d{2}-\d{2})\s*[~〜]\s*(\d{4}-\d{2}-\d{2})?/);if(m)leave.push([m[1],m[2]||'9999-12-31',(x.split(':')[0]||'休業')]);});
    kot[normName(nm)]={name:nm,wk:days.map(d=>cell(r[d])),hol:cell(r['祝']),leave};n++;}
  S.settings.kot=kot;S.meta.imports.kot={at:new Date().toISOString(),file:name};DIRTY.add('settings');DIRTY.add('meta');
  return `KOTの勤務予定：${n}名分を取り込みました（退職済みの方は除外）`;
}
// 日本の祝日（振替休日・国民の休日を含む）
function jpHoliday(d){
  const y=+d.slice(0,4),m=+d.slice(5,7),day=+d.slice(8,10);
  const base=(Y,M,D)=>{const dt=new Date(Y,M-1,D);const w=dt.getDay();const nth=Math.ceil(D/7);
    const fixed={'1-1':1,'2-11':1,'2-23':1,'4-29':1,'5-3':1,'5-4':1,'5-5':1,'8-11':1,'11-3':1,'11-23':1};
    if(fixed[M+'-'+D])return true;
    if(w===1&&((M===1&&nth===2)||(M===7&&nth===3)||(M===9&&nth===3)||(M===10&&nth===2)))return true;
    if(M===3&&D===Math.floor(20.8431+0.242194*(Y-1980)-Math.floor((Y-1980)/4)))return true;
    if(M===9&&D===Math.floor(23.2488+0.242194*(Y-1980)-Math.floor((Y-1980)/4)))return true;
    return false;};
  if(base(y,m,day))return true;
  const dt=new Date(y,m-1,day);
  // 振替休日：祝日が日曜なら、その後の最初の祝日でない日
  if(dt.getDay()!==0){let k=new Date(dt);for(;;){k=new Date(k.getTime()-864e5);if(!base(k.getFullYear(),k.getMonth()+1,k.getDate()))break;if(k.getDay()===0)return true;}}
  // 国民の休日：前後が祝日の平日
  const pv=new Date(dt.getTime()-864e5),nx=new Date(dt.getTime()+864e5);
  if(dt.getDay()!==0&&base(pv.getFullYear(),pv.getMonth()+1,pv.getDate())&&base(nx.getFullYear(),nx.getMonth()+1,nx.getDate()))return true;
  return false;
}
// その職員のその日の勤務時間：{off:'休み'等} か {s,e（分）,kot:true/false}
function workHours(name,date){
  const ds=toMin(S.settings.workStart||'08:30'),de=toMin(S.settings.workEnd||'17:30');
  // カイポケ・ナースの予定に「公休」などが入っている日は休み
  const mine=S.visits.filter(v=>normName(v.staff)===normName(name)&&v.date===date);
  const offV=mine.find(v=>isOffSvc(v));if(offV)return {off:String(offV.service).trim().slice(0,6)};
  const working=mine.some(v=>!v.oncall);
  const k=(S.settings.kot||{})[normName(name)];
  if(!k){if(!working&&(new Date(date+'T00:00').getDay()===0||jpHoliday(date)))return {off:'予定なし'};return {s:ds,e:de,kot:false};}
  const lv=k.leave.find(x=>date>=x[0]&&date<=x[1]);if(lv)return {off:lv[2]||'休業'};
  let c=k.wk[(new Date(date+'T00:00').getDay()+6)%7];
  if(jpHoliday(date)&&k.hol)c=k.hol;
  if(c==='off')return {off:jpHoliday(date)?'祝日休み':'休み'};
  if(!c){if(!working)return {off:'勤務予定なし'};return {s:ds,e:de,kot:true,guess:true};}
  return {s:toMin(c[0]),e:toMin(c[1]),kot:true};
}

// ===== LINEトーク履歴 =====
function importLine(text,name){
  const lines=text.replace(/\r/g,'').split('\n');let date='',cur=null,add=0;const have=new Set(S.line.map(m=>m.id));const out=[];
  const push=()=>{if(!cur)return;cur.text=cur.text.replace(/^"|"$/g,'').trim();if(!cur.text||/^\[(スタンプ|写真|動画|ファイル|ボイスメッセージ|連絡先)\]$/.test(cur.text)||/メッセージの送信を取り消しました|がグループに参加しました|がグループを退会しました|を招待しました/.test(cur.text)){cur=null;return;}
    cur.id=hashStr(cur.date+cur.time+cur.from+cur.text);if(!have.has(cur.id)){have.add(cur.id);out.push(cur);add++;}cur=null;};
  for(const ln of lines){
    let m=ln.match(/^(\d{4})[\/.](\d{1,2})[\/.](\d{1,2})\((.)\)\s*$/); if(m){push();date=`${m[1]}-${pad(m[2])}-${pad(m[3])}`;continue;}
    m=ln.match(/^(\d{1,2}:\d{2})\t([^\t]*)\t?(.*)$/); if(m&&date){push();cur={date,time:m[1].padStart(5,'0'),from:m[2],text:m[3]};continue;}
    if(cur) cur.text+='\n'+ln;
  }
  push(); S.line.push(...out); S.line.sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  S.meta.imports.line={at:new Date().toISOString(),file:name};DIRTY.add('line');DIRTY.add('meta');
  return `LINEトーク履歴：新しい連絡${add}件を取り込みました（取り込み済みの連絡は二重になりません）`;
}
function hashStr(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}return h.toString(36);}

async function importHoukanPDF(buf,name){
  if(!window.pdfjsLib) throw new Error('PDF読み取り部品を読み込めませんでした（ネット接続を確認）');
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const doc=await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
  const out=[];const ranges={};
  for(let p=1;p<=doc.numPages;p++){
    const page=await doc.getPage(p);const tc=await page.getTextContent();
    const rows=[];for(const it of tc.items){if(!it.str.trim())continue;const y=it.transform[5],x=it.transform[4];let r=rows.find(r=>Math.abs(r.y-y)<2.5);if(!r){r={y,items:[]};rows.push(r);}r.items.push({x,s:it.str.trim()});}
    rows.sort((a,b)=>b.y-a.y);rows.forEach(r=>r.items.sort((a,b)=>a.x-b.x));
    const all=rows.map(r=>r.items.map(i=>i.s).join(' ')).join('\n');
    const sm=all.match(/職員名[：:]\s*([^\n]+)/);const staff=sm?sm[1].trim():'不明';
    const pm=all.match(/対象期間[：:]\s*令和(\d+)年(\d+)月(\d+)日\s*～\s*令和(\d+)年(\d+)月(\d+)日/);
    let y0=TODAY.getFullYear(),m0=1;
    if(pm){y0=2018+(+pm[1]);m0=+pm[2];const a=`${y0}-${pad(pm[2])}-${pad(pm[3])}`,b=`${2018+(+pm[4])}-${pad(pm[5])}-${pad(pm[6])}`;ranges[staff]={a,b};}
    rows.forEach((r,i)=>{
      const dm=r.items[0]&&r.items[0].s.match(/^(\d+)月(\d+)日/); if(!dm) return;
      const line=r.items.map(x=>x.s).join(' ');
      const tm=line.match(/(\d{1,2}:\d{2})\s*～\s*(\d{1,2}:\d{2})/); if(!tm) return;
      const mon=+dm[1];const yy=mon<m0?y0+1:y0;
      const nameIt=r.items.find(x=>/様$/.test(x.s)&&x.x>200&&x.x<320);
      let svc=r.items.filter(x=>x.x>=300&&x.x<420).map(x=>x.s).join('');
      if(!svc){ // 折り返しで上下の行に出ているとき
        const near=rows.filter((q,j)=>j!==i&&Math.abs(q.y-r.y)<=9&&!(q.items[0]&&/^\d+月\d+日/.test(q.items[0].s))).sort((a,b)=>b.y-a.y);
        svc=near.map(q=>q.items.filter(x=>x.x>=300&&x.x<420).map(x=>x.s).join('')).join('');
      }
      const oncall=(tm[1]==='00:00'&&tm[2]==='00:00')||(!nameIt&&/オンコール/.test(svc));
      out.push({src:'訪看',staff,date:`${yy}-${pad(mon)}-${pad(dm[2])}`,start:tm[1].padStart(5,'0'),end:tm[2].padStart(5,'0'),user:nameIt?nameIt.s.replace(/様$/,''):'',service:svc,other:!nameIt,oncall});
    });
  }
  // 同じ職員・同じ期間の訪看予定は置き換え
  for(const [st,r] of Object.entries(ranges)) S.visits=S.visits.filter(v=>!(v.src==='訪看'&&v.staff===st&&v.date>=r.a&&v.date<=r.b));
  S.visits.push(...out);
  S.meta.imports.houkan={at:new Date().toISOString(),file:name};DIRTY.add('visits');DIRTY.add('meta');
  const users=out.filter(v=>!v.other).length;
  return `訪問看護の職員別スケジュール：${Object.keys(ranges).length}名分・訪問${users}件（会議・オンコール等${out.length-users}件）を取り込みました`;
}

const isOffSvc=v=>/^\s*(公休|休み|休日|有休|有給|希望休|代休|特休)/.test(v.service||'');

const toMin=t=>{const [h,m]=t.split(':').map(Number);return h*60+m;};
const fromMin=n=>`${Math.floor(n/60)}:${pad(n%60)}`;
// 勤務時間内の「予定が入っていない時間」から、お昼休憩1時間を除いて、30分以上の空きを返す
// 休憩：基本 12:30〜13:30。取れなければ昼ごろの取れるところで1時間、それも無理なら30分＋30分
function lunchBreak(gaps,w){
  if(w.e-w.s<360)return [];
  const L0=toMin(S.settings.lunchStart||'12:30'),L1=L0+60,mid=L0+30;
  if(gaps.some(g=>g[0]<=L0&&g[1]>=L1))return [[L0,L1]];
  const near=(a,b)=>Math.abs((a+b)/2-mid);
  const pick=(len,win)=>{let best=null;for(const g of gaps){const a=Math.max(g[0],win[0]),z=Math.min(g[1],win[1]);if(z-a<len)continue;const st=Math.min(Math.max(a,mid-len/2),z-len);const c=[st,st+len];if(!best||near(...c)<near(...best))best=c;}return best;};
  for(const win of [[660,900],[w.s,w.e]]){const one=pick(60,win);if(one)return [one];
    const h=[];const rest=gaps.map(g=>g.slice());for(let i=0;i<2;i++){let best=null,bi=-1;rest.forEach((g,k)=>{const a=Math.max(g[0],win[0]),z=Math.min(g[1],win[1]);if(z-a<30)return;const st=Math.min(Math.max(a,mid-15),z-30);if(!best||near(st,st+30)<near(...best)){best=[st,st+30];bi=k;}});if(!best)break;h.push(best);rest[bi]=[0,0];}
    if(h.length===2)return h.sort((a,b)=>a[0]-b[0]);}
  return [];
}
function slotsOf(busy,w){
  const s=w.s,e=w.e;let cur=s;const gaps=[];
  for(const b of busy){const a=toMin(b.start),z=toMin(b.end);if(a>cur)gaps.push([cur,Math.min(a,e)]);cur=Math.max(cur,z);}
  if(e>cur)gaps.push([cur,e]);
  const g2=gaps.filter(x=>x[1]>x[0]);const brk=lunchBreak(g2,w);
  let free=[];for(const g of g2){let parts=[g];for(const k of brk)parts=parts.flatMap(p=>k[1]<=p[0]||k[0]>=p[1]?[p]:[[p[0],k[0]],[k[1],p[1]]]);free=free.concat(parts);}
  return {free:free.filter(x=>x[1]-x[0]>=30),brk};
}
function breakOf(staff,date){const w=workHours(staff,date);if(w.off)return [];return slotsOf(busyOf(staff,date),w).brk;}
function freeSlots(staff,date){
  const w=workHours(staff,date);if(w.off)return [];
  return slotsOf(busyOf(staff,date),w).free;

function bdayNotice(){const l=staffBdayToday();return l.map(s=>`<div style="border-left:4px solid #E06BC8;padding:4px 10px;margin-bottom:10px">🎂 今日は ${(s.depts||[]).map(d=>esc(DEPT_OFFICE[d]||d)).join('・')}${(s.depts||[]).length?' ':''}<b>${esc(s.name)}</b> さんの誕生日です</div>`).join('');}
function noticeCard(){const ns=myNotices();const bd=bdayNotice();return `<div class="card"><h2>お知らせ</h2>${bd}${ns.length||bd?ns.map(n=>`<div style="border-left:4px solid ${n.imp?'var(--red)':'var(--line)'};padding:4px 10px;margin-bottom:10px"><div>${n.imp?'<span class="tag red">重要</span>':''}<b>${esc(n.title)}</b> <span class="note">${md(n.date)}　${n.target==='all'?'全員':esc(n.target)}あて</span></div><div style="white-space:pre-wrap;font-size:13.5px;margin-top:3px">${esc(n.body)}</div></div>`).join(''):'<p class="note">お知らせはありません。</p>'}</div>`;}
function todoCard(){
  const ts=myTasks(),rq=myRequests();const items=[];const due=t=>t.due?` <span class="tag ${daysTo(t.due)<0?'red':daysTo(t.due)<=2?'amber':''}">${md(t.due)}まで</span>`:'';
  const mine=(S.mytasks||[]).filter(t=>!t.doneAt&&!sysKey(t)).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')||a.at.localeCompare(b.at));
  for(const t of mine) items.push(`<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line)"><label class="row" style="flex:1;gap:6px"><input type="checkbox" onchange="myTaskToggle('${t.id}',true)"> <span>${esc(t.title)}${due(t)}</span></label><a href="#" class="note" style="color:var(--red)" onclick="myTaskDel('${t.id}');return false">削除</a></div>`);
  for(const t of ts) items.push(`<label class="row" style="padding:6px 0;border-bottom:1px solid var(--line)"><input type="checkbox" onchange="doneTask('${t.id}')"> <span>${esc(t.title)}${due(t)} <span class="tag">${esc(t.by||'')}より</span>${t.tel?` <a href="tel:${esc(t.tel.replace(/[^0-9+]/g,''))}" class="tag blue">📞 電話する</a>`:''}</span></label>`);
  for(const r of rq.filter(r=>!sysDoneHas('ph:'+r.key))) items.push(`<div style="padding:6px 0;border-bottom:1px solid var(--line)"><div class="row"><input type="checkbox" title="済んだらチェック" onchange="sysDone('ph:${esc(r.key)}','撮影：${esc(r.u.name)} 様 ${esc(r.what)}')"><span class="tag blue">撮影</span><span>${md(r.v.date)} ${r.v.start} <b>${esc(r.u.name)} 様</b>：${esc(r.what)}</span><button class="btn sub" style="padding:4px 10px;font-size:13px" onclick="go('camera',{autoCam:1,camUser:'${esc(r.u.key)}',camType:'${r.type}'})">撮影する</button></div>${candLines(r)}</div>`);
  for(const r of otherRequests().filter(r=>!sysDoneHas('ph:'+r.key))) items.push(`<div style="padding:6px 0;border-bottom:1px solid var(--line);opacity:.85"><div class="row"><span class="tag">撮影</span><span><b>${esc(r.u.name)} 様</b>：${esc(r.what)}　<span class="note">いまの写真担当：${esc(r.v.staff)}（${md(r.v.date)}）</span></span><button class="btn sub" style="padding:4px 10px;font-size:13px" onclick="claimPhoto('${esc(r.key)}')">自分が写真担当になる</button></div>${candLines(r)}</div>`);
  items.push(...lmTodoItems());
  items.unshift(...kkTodoItems());
  if(isOffice()){const im=S.meta.imports;const old=['users','houkai','houkan'].filter(k=>!im[k]||(Date.now()-Date.parse(im[k].at))>36*3600e3);if(old.length&&!sysDoneHas('imp:'+TODAY_ISO))items.push(`<div class="row" style="padding:6px 0"><input type="checkbox" title="確認したらチェック（今日は表示しない）" onchange="sysDone('imp:${TODAY_ISO}','カイポケの取り込みを確認')"><span class="tag red">取り込み</span><span>カイポケの取り込みが古くなっています（遅番の更新を確認）</span><button class="btn sub" style="padding:4px 10px;font-size:13px" onclick="go('import')">取り込みへ</button></div>`);}
  // 済んだもの（自分で書いたもの・頼まれたもの、この2週間）
  const recent=x=>x&&daysTo(x.slice(0,10))>=-14;
  const doneMine=(S.mytasks||[]).filter(t=>recent(t.doneAt)).map(t=>({id:t.id,title:sysTitle(t),at:t.doneAt,mine:true,sys:!!sysKey(t)}));
  const doneAsg=S.tasks.filter(t=>(t.to==='all'||t.to===ME.id||ME.depts.includes(t.to))&&recent((t.done||{})[ME.id])).map(t=>({id:t.id,title:t.title,at:t.done[ME.id],mine:false}));
  const done=doneMine.concat(doneAsg).sort((a,b)=>b.at.localeCompare(a.at));
  return `<div class="card"><h2>やること <span class="note">${items.length}件</span></h2>
  ${S.mytasksOn?`<div class="row" style="margin-bottom:8px"><input id="myTaskIn" placeholder="自分のやることを書く（例：〇〇さんに電話）" style="flex:1;min-width:180px" onkeydown="if(event.key==='Enter'&&!event.isComposing)myTaskAdd()"><input type="date" id="myTaskDue" title="期限（なくてもOK）"><button class="btn" onclick="myTaskAdd()">追加</button></div>`:''}
  ${items.join('')||'<p class="note">いまやることはありません。</p>'}
  ${done.length?`<details style="margin-top:8px"><summary class="note">済んだもの（${done.length}件）</summary>${done.map(t=>`<label class="row" style="padding:4px 0;color:#94a3b8"><input type="checkbox" checked onchange="${t.sys?`sysUndo('${t.id}')`:t.mine?`myTaskToggle('${t.id}',false)`:`undoTask('${t.id}')`}"> <span style="text-decoration:line-through">${esc(t.title)}</span> <span class="note">${md(t.at.slice(0,10))}</span></label>`).join('')}</details>`:''}</div>`;
}
// 撮影依頼・取り込みのお知らせも、チェックで「済み」にできる（自分のやること欄に記録して、済んだものに出す）
const sysKey=t=>((t.title||'').match(/^⟦([^⟧]+)⟧/)||[])[1]||'';
const sysTitle=t=>(t.title||'').replace(/^⟦[^⟧]+⟧/,'');
const sysDoneHas=k=>(S.mytasks||[]).some(t=>t.doneAt&&sysKey(t)===k);
async function sysDone(key,title){if(DEMO){S.mytasks=(S.mytasks||[]).concat([{id:'d'+Date.now(),title:`⟦${key}⟧${title}`,at:new Date().toISOString(),doneAt:new Date().toISOString()}]);render();return;}try{const t=await api('myTaskAdd',{title:`⟦${key}⟧${title}`,due:''});const d=await api('myTaskToggle',{id:t.id,done:true});S.mytasks=(S.mytasks||[]).concat([d]);}catch(e){alert(e.message);}render();}
async function sysUndo(id){try{await api('myTaskDelete',{id});S.mytasks=S.mytasks.filter(x=>x.id!==id);}catch(e){alert(e.message);}render();}
async function myTaskAdd(){const i=$('#myTaskIn');const title=i.value.trim();if(!title){i.focus();return;}const dueV=$('#myTaskDue').value;i.disabled=true;try{const t=await api('myTaskAdd',{title,due:dueV});S.mytasks=(S.mytasks||[]).concat([t]);}catch(e){alert(e.message);i.disabled=false;return;}render();setTimeout(()=>{const x=$('#myTaskIn');if(x)x.focus();},0);}
async function myTaskToggle(id,done){try{const t=await api('myTaskToggle',{id,done});const k=S.mytasks.findIndex(x=>x.id===id);if(k>=0)S.mytasks[k]=t;}catch(e){alert(e.message);}render();}
async function myTaskDel(id){if(!confirm('このやることを削除しますか？'))return;try{await api('myTaskDelete',{id});S.mytasks=S.mytasks.filter(x=>x.id!==id);}catch(e){alert(e.message);}render();}
async function undoTask(id){try{await api('undoTask',{id});const t=S.tasks.find(x=>x.id===id);if(t&&t.done)delete t.done[ME.id];}catch(e){alert(e.message);}render();}
async function doneTask(id){const t=S.tasks.find(x=>x.id===id);if(!t)return;try{await api('doneTask',{id});}catch(e){alert(e.message);render();return;}t.done=t.done||{};t.done[ME.id]=new Date().toISOString();render();}
// ===== 文字の飾り（太字・下線・取り消し線・箇条書き）。ポータルでは飾って表示、LINE WORKSには太字を【】にして送る =====
const fmtMarks=h=>String(h).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/__(.+?)__/g,'<u>$1</u>').replace(/~~(.+?)~~/g,'<s>$1</s>');
function fmtText(t){let h=fmtMarks(esc(String(t||'')));
  return h.split('\n').map(l=>/^\s*[・•]\s?/.test(l)?`<span style="display:block;padding-left:1.2em;text-indent:-1.2em">・${l.replace(/^\s*[・•]\s?/,'')}</span>`:l).join('\n').replace(/<\/span>\n/g,'</span>');}
function fmtBar(id){const b=(lab,tip,js)=>`<button type="button" class="btn sub" style="padding:2px 10px;min-width:34px" title="${tip}" onmousedown="event.preventDefault()" onclick="${js}">${lab}</button>`;
  return `<div class="row" style="gap:4px;margin:0 0 4px;flex-wrap:wrap">${b('<b>B</b>','太字',`fmtWrap('${id}','**')`)}${b('<u>U</u>','下線',`fmtWrap('${id}','__')`)}${b('<s>S</s>','取り消し線',`fmtWrap('${id}','~~')`)}${b('・','箇条書き',`fmtLines('${id}','・')`)}${b('①','番号',`fmtLines('${id}','num')`)}</div>`;}
function fmtWrap(id,mk){const t=document.getElementById(id);if(!t)return;const a=t.selectionStart,e=t.selectionEnd,v=t.value;const sel=v.slice(a,e)||'ここに文字';t.value=v.slice(0,a)+mk+sel+mk+v.slice(e);t.focus();t.setSelectionRange(a+mk.length,a+mk.length+sel.length);}
function fmtLines(id,kind){const t=document.getElementById(id);if(!t)return;const v=t.value;let a=v.lastIndexOf('\n',t.selectionStart-1)+1,e=v.indexOf('\n',t.selectionEnd);if(e<0)e=v.length;
  const N='①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳';const lines=v.slice(a,e).split('\n').map((l,i)=>{l=l.replace(/^\s*([・•]|[①-⑳])\s?/,'');return (kind==='num'?N[i]||'・':'・')+l;});
  const out=lines.join('\n');t.value=v.slice(0,a)+out+v.slice(e);t.focus();t.setSelectionRange(a+out.length,a+out.length);}
// 履歴の本文を全部見る（モーダル）
function lwFull(id){const x=((LWQ&&LWQ.list)||[]).find(y=>y.id===id);if(!x)return;if(!isExec()&&x.by!==ME.name&&!(x.to||[]).map(String).includes(String(ME.id))&&String(x.from)!==String(ME.id))return;const bg=document.createElement('div');bg.className='modalbg';bg.onclick=e=>{if(e.target===bg)bg.remove();};
  bg.innerHTML=`<div class="modalbox"><div class="note" style="margin-bottom:8px">${esc(lwTime(x.sentAt||x.at))}　${esc(x.by||x.fromName||'')}${x.label?'　→ '+esc(x.label):''}</div><div style="white-space:pre-wrap;line-height:1.7;font-size:16px">${fmtText(x.text)}</div><div style="text-align:right;margin-top:12px"><button class="btn" onclick="this.closest('.modalbg').remove()">閉じる</button></div></div>`;document.body.appendChild(bg);}
function lineList(list,limit){

  return list.slice(0,limit||9999).map(m=>{const imp=isImp(m);return `<div style="border-left:4px solid ${imp?'var(--red)':'var(--line)'};padding:4px 10px;margin-bottom:10px"><div class="note">${imp?'<span class="tag red">重要</span>':'<span class="tag">通常</span>'} ${md(m.date)} ${m.time}　${esc(m.from)}　${(m.users||[]).map(k=>{const u=IDX.userByKey.get(k);return u&&MYUSERS.has(k)?`<a href="#" class="tag green" onclick="SEL='${esc(k)}';go('users');return false">${esc(u.name)}様</a>`:'';}).join('')}</div><div style="white-space:pre-wrap;font-size:13.5px;margin-top:3px">${fmtMarks(hl(m.text))}</div></div>`;}).join('');
}
function hl(t){let s=esc(t);for(const k of S.settings.keywords){if(!k)continue;s=s.split(esc(k)).join(`<mark style="background:var(--red-soft);color:var(--red)">${esc(k)}</mark>`);}return s;}
// ===== リアクション（対応完了・確認中・保留中）。押した人の名前が全員に見える =====
const REACTS=[['対応完了','✅'],['確認中','👀'],['保留中','⏸']];
function reactHtml(react,onclickFn,id,types,noBtns){
  const r=react||{},mine=r[ME.id]&&r[ME.id].r,by={};Object.values(r).forEach(v=>{(by[v.r]=by[v.r]||[]).push(v.name);});
  const shown=types.filter(([t])=>by[t]).map(([t,ic])=>`<span class="tag" style="background:#fff;border:1px solid var(--line);color:var(--ink,#222);font-size:11.5px;margin:2px 4px 0 0;display:inline-block">${ic} ${t}：${by[t].map(esc).join('、')}</span>`).join('');
  const btns=types.map(([t,ic])=>`<button class="btn sub" style="padding:1px 8px;font-size:11.5px;margin:2px 4px 0 0;${mine===t?'background:var(--accent);color:#fff':''}" onclick="${onclickFn}('${esc(id)}','${t}')">${ic} ${t}</button>`).join('');
  if(noBtns)return shown?`<div style="margin-top:3px;text-align:right">${shown}</div>`:'';

}

// ===== 朝礼ノート（留守電・休みの人・連絡事項）。全員が見られて、だれでも書ける =====

const PHOTO_CACHE={};const PHOTO_WAIT=new Set();
const BLANK='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10"><rect width="10" height="10" fill="#eef2f6"/></svg>');
// 写真の時刻（保存は世界標準時）を日本時間の「YYYY-MM-DD HH:MM」に
function localAt(at){const d=new Date(at);return isNaN(d)?String(at||''):`${iso(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`;}
// 一覧の小さい写真は縮小画像を、端末に保存して次からすぐ出す
const THUMB={};
const tdb=(()=>{let p=null;return ()=>p||(p=new Promise(res=>{try{const r=indexedDB.open('aloha-thumbs',1);r.onupgradeneeded=()=>r.result.createObjectStore('t');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);}catch(e){res(null);}}));})();
async function tGet(id){const db=await tdb();if(!db)return null;return new Promise(res=>{try{const q=db.transaction('t').objectStore('t').get(id);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);}catch(e){res(null);}});}
async function tPut(id,v){const db=await tdb();if(!db)return;try{db.transaction('t','readwrite').objectStore('t').put(v,id);}catch(e){}}
function photoImg(p,style,zoomable){const src=THUMB[p.id]||PHOTO_CACHE[p.id];if(!src)PHOTO_WAIT.add(p.id);return `<img data-pid="${p.id}" src="${src||BLANK}" style="${style||''}" ${zoomable||style.includes('zoom')?`onclick="zoom('${p.id}')"`:''} alt="">`;}
// 写真から一覧用の縮小画像（長い辺240px）を作る
async function makeThumb(dataUrl){const im=await loadImg(dataUrl);const k=Math.min(1,240/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',0.75);}
async function loadPhotos(){const ids=[...PHOTO_WAIT].filter(id=>!THUMB[id]);PHOTO_WAIT.clear();
  const show=id=>document.querySelectorAll(`img[data-pid="${id}"]`).forEach(im=>im.src=THUMB[id]);
  const need=[];for(const id of ids){if(PHOTO_CACHE[id]){THUMB[id]=PHOTO_CACHE[id];show(id);continue;}const c=await tGet(id);if(c){THUMB[id]=c;show(id);}else need.push(id);}
  if(!need.length)return;
  // サーバーの縮小画像をまとめて受け取る
  let got={};for(let i=0;i<need.length;i+=30){try{Object.assign(got,await api('getThumbs',{ids:need.slice(i,i+30)},true));}catch(e){}}
  const miss=[];for(const id of need){if(got[id]){THUMB[id]=got[id];tPut(id,got[id]);show(id);}else miss.push(id);}
  // 縮小画像がまだない写真は元の写真を読み、縮小版を作ってサーバーに保存（次から速くなる）
  const work=async()=>{while(miss.length){const id=miss.shift();try{const full=await api('getPhoto',{id},true);PHOTO_CACHE[id]=full;let t=full;try{t=await makeThumb(full);api('putThumb',{id,data:t},true).catch(()=>{});}catch(e){}THUMB[id]=t;tPut(id,t);show(id);}catch(e){}}};
  await Promise.all([work(),work(),work(),work()]);}
async function getPhotoData(id){if(!PHOTO_CACHE[id])PHOTO_CACHE[id]=await api('getPhoto',{id});return PHOTO_CACHE[id];}
async function zoom(id){try{$('#zoomimg').src=await getPhotoData(id);$('#zoom').style.display='flex';}catch(e){alert(e.message);}}

  const blocks=[...by.entries()].sort((a,b)=>a[0].localeCompare(b[0],'ja')).map(([st,list])=>{
    list.sort((a,b)=>(a.v.date+a.v.start).localeCompare(b.v.date+b.v.start));
    const text=`【撮影のお願い】\n${list.map(r=>`${md(r.v.date)} ${r.v.start} ${r.u.name} 様：${r.what}`).join('\n')}\n訪問の際に撮影し、ポータルの「撮影」から利用者を選んで保存してください。`;

const isMe2=(a,b)=>normName(a)===normName(b);
function busyOf2(name,date){return S.visits.filter(v=>isMe2(v.staff,name)&&v.date===date&&!v.oncall).sort((a,b)=>a.start.localeCompare(b.start));}
function freeSlots2(name,date){const w=workHours(name,date);if(w.off)return [];return slotsOf(busyOf2(name,date),w).free;}

// ===== 誕生日カード（はがき 縦・横） =====
const CARD_TPL={
  tate:{src:'card/tate.png',w:519,h:785,name:[116,119,428,161],birth:[38,171,435,219],oval:[7,302,513,651],year:[505,37,18],scale:3},
  yoko:{src:'card/yoko.png',w:1138,h:751,name:[343,148,795,204],birth:[282,205,856,276],oval:[223,289,974,740],year:[1116,53,26],scale:1.6}};
const CARD_FONT='"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","YuGothic","Meiryo",sans-serif';
const TPL_IMG={};const CARD_ADJ={};
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('画像を読み込めませんでした'));i.src=src;});}
async function tplImg(o){if(!TPL_IMG[o])TPL_IMG[o]=await loadImg(CARD_TPL[o].src);return TPL_IMG[o];}
function cardYear(){return TODAY.getFullYear();}
// 誕生日カードの写真は、その年の誕生日の60日前より後に撮ったものだけ使う（去年の写真は使わない）
function bdayOf(u,year){if(!u||!u.birth)return '';if(year)return `${year}-${u.birth.slice(5)}`;const y=cardYear();const bd=`${y}-${u.birth.slice(5)}`;return daysTo(bd)<-60?`${y+1}-${u.birth.slice(5)}`:bd;}
function freshBdayPhoto(u,year){const bd=bdayOf(u,year);if(!bd)return null;const from=iso(new Date(new Date(bd+'T00:00').getTime()-60*864e5));return photosOf(u,'顔写真（誕生日）').find(p=>String(p.at).slice(0,10)>=from)||null;}
function cardPhoto(u){return freshBdayPhoto(u);}
async function cardAdj(u){
  if(CARD_ADJ[u.key])return CARD_ADJ[u.key];
  const ph=cardPhoto(u);const img=await loadImg(await getPhotoData(ph.id));
  return CARD_ADJ[u.key]={o:img.width>=img.height?'yoko':'tate',z:1,dx:0,dy:0,img};
}
function fitText(ctx,t,maxW,size,weight){let s=size;do{ctx.font=`${weight||''} ${s}px ${CARD_FONT}`;if(ctx.measureText(t).width<=maxW)break;s-=1;}while(s>8);return s;}
async function drawCard(cv,u,a){
  const T=CARD_TPL[a.o],S=T.scale,tpl=await tplImg(a.o);
  cv.width=Math.round(T.w*S);cv.height=Math.round(T.h*S);const c=cv.getContext('2d');
  c.setTransform(S,0,0,S,0,0);c.imageSmoothingQuality='high';
  c.fillStyle='#D9E2F3';c.fillRect(0,0,T.w,T.h);
  // 写真（楕円の中に、はみ出さないように）
  const [x0,y0,x1,y1]=T.oval,ow=x1-x0+4,oh=y1-y0+4,cx=(x0+x1)/2,cy=(y0+y1)/2,img=a.img;
  const k=Math.max(ow/img.width,oh/img.height)*a.z,iw=img.width*k,ih=img.height*k;
  c.save();c.beginPath();c.ellipse(cx,cy,ow/2,oh/2,0,0,Math.PI*2);c.clip();
  c.drawImage(img,cx-iw/2+a.dx*ow,cy-ih/2+a.dy*oh,iw,ih);c.restore();
  c.drawImage(tpl,0,0,T.w,T.h);
  // 年
  c.fillStyle='#111';c.textBaseline='alphabetic';c.textAlign='right';c.font=`${T.year[2]}px ${CARD_FONT}`;c.fillText(`${cardYear()} 年`,T.year[0],T.year[1]);
  // 名前
  c.textAlign='center';c.textBaseline='middle';
  const [nx0,ny0,nx1,ny1]=T.name;const nm=u.name.replace(/\s+/g,' ').trim();

// 保険証の写真から日付を読み取り、いちばん新しい日付（有効期限の終わり）が今日より前なら「期限切れかも」と出す（保存はできる）
let EXP_WARN=null;
function expDates(txt){const t=String(txt).replace(/\s+/g,'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/元年/g,'1年');const out=[];const push=(y,m,d)=>{y=+y;m=+m;d=+d;if(m>=1&&m<=12&&d>=1&&d<=31&&y>1900&&y<2100)out.push(`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`);};
  let r;const re1=/(令和|平成|R|H)(\d{1,2})[年.\/](\d{1,2})[月.\/](\d{1,2})/g;while((r=re1.exec(t)))push((/令|R/.test(r[1])?2018:1988)+ +r[2],r[3],r[4]);
  const re2=/(20\d\d)[年.\/-](\d{1,2})[月.\/-](\d{1,2})/g;while((r=re2.exec(t)))push(r[1],r[2],r[3]);return out;}
async function expCheck(img){const box=$('#expWarn');if(box)box.innerHTML='';EXP_WARN=null;
  const tp=STATE.camType||'';if(!/保険証|負担割合証|受給者証/.test(tp))return;
  if(box)box.innerHTML='<p class="note">保険証の有効期限を確かめています…（そのまま保存もできます）</p>';
  try{await loadOcr();if(!OCRW){OCRW=await Tesseract.createWorker('jpn');}const r=await OCRW.recognize(img);if(PENDING!==img)return;
    const ds=expDates(r.data.text).filter(d=>d<=String(new Date().getFullYear()+10)).sort();const b=$('#expWarn');if(!b)return;
    if(ds.length>=2&&ds[ds.length-1]<TODAY_ISO){const msg=`期限が切れた${tp}かもしれません（読み取った一番新しい日付：${mdy(ds[ds.length-1])}）`;EXP_WARN={img,msg};
      b.innerHTML=`<div class="card" style="border:2px solid var(--red);background:#fff3f3;margin:8px 0"><b style="color:var(--red)">⚠ ${esc(msg)}</b><div class="note">新しい${esc(tp)}か確かめてください。古いものなら「撮り直す」で新しいものを撮ってください。</div></div>`;}
    else b.innerHTML='';}catch(e){const b=$('#expWarn');if(b)b.innerHTML='';}}
function shrink(file){return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{const max=1600,r=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.85));};img.onerror=rej;img.src=url;});}

function taskTargets(t){const act=S.staffList.filter(s=>s.active);if(t.to==='all')return act;const one=act.filter(s=>s.id===t.to);if(one.length)return one;return act.filter(s=>(s.depts||[]).includes(t.to));}
function taskCheckCard(){
  const list=S.tasks.slice().sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));
  const f=STATE.taskF||'undone';
  const rows=list.map(t=>{const tg=taskTargets(t),un=tg.filter(x=>!(t.done||{})[x.id]),dn=tg.filter(x=>(t.done||{})[x.id]);return {t,un,dn,tg};}).filter(r=>f==='all'||r.un.length);
  const st=r=>!r.un.length?'<span class="tag green">全員済み</span>':r.t.due&&daysTo(r.t.due)<0?'<span class="tag red">締め切りすぎ</span>':r.t.due&&daysTo(r.t.due)===0?'<span class="tag amber">今日まで</span>':'<span class="tag">まだ</span>';
  return `<div class="card"><div class="row"><h2 style="margin:0">やることの確認</h2><select onchange="STATE.taskF=this.value;render()"><option value="undone" ${f==='undone'?'selected':''}>まだ済んでいない人がいるもの</option><option value="all" ${f==='all'?'selected':''}>すべて</option><option value="staff" ${f==='staff'?'selected':''}>職員ごとに見る</option></select></div>
  <p class="note">頼んだやること・伝言が済んだかどうかを確認できます。締め切りの日の朝8時ごろ、まだ済んでいない人にLINE WORKSで自動で知らせます。「催促」を押すと、まだの人にすぐ送ります。</p>
  ${f==='staff'?taskByStaffHtml(list):rows.length?`<table><tr><th>内容</th><th>担当</th><th>締め切り</th><th>状態</th><th>まだの人</th><th>済んだ人</th><th></th></tr>${rows.map(r=>`<tr><td>${esc(r.t.title)}<div class="note">${esc(r.t.by||'')}より</div></td><td>${esc(targetName(r.t.to))}</td><td>${r.t.due?md(r.t.due):'—'}</td><td>${st(r)}</td><td style="color:var(--red)">${r.un.map(x=>esc(x.name)).join('、')||'—'}</td><td class="note">${r.dn.map(x=>esc(x.name)+' '+md(String(r.t.done[x.id]).slice(0,10))).join('、')||'—'}</td><td style="white-space:nowrap">${r.un.length?`<button class="btn sub" style="padding:4px 10px;font-size:13px" onclick="taskRemind('${r.t.id}',this)">催促（${r.un.length}人）</button> `:''}<a href="#" style="color:var(--red)" onclick="delItem('tasks','${r.t.id}');return false">削除</a></td></tr>`).join('')}</table>`:`<p class="note">${f==='all'?'まだありません。':'まだ済んでいない人がいるやることはありません。'}</p>`}</div>`;

// 職員ごと：その人に頼んだやること・伝言のうち、まだのものと済んだ数
function taskByStaffHtml(list){
  const act=S.staffList.filter(x=>x.active&&!isPseudoStaff(x.name));
  const rows=act.map(st=>{const mine=list.filter(t=>taskTargets(t).some(x=>x.id===st.id));const un=mine.filter(t=>!(t.done||{})[st.id]);return {st,mine,un};}).filter(r=>r.mine.length)

function deptsOf(st){const ex=(S.settings&&S.settings.deptExtra)||{};const d=new Set(st&&st.depts||[]);for(const k in ex)if((ex[k]||[]).map(String).includes(String(st&&st.id)))d.add(k);return [...d];}
function talkThreads(){
  // key：職員ID（1対1）か 'g:'＋利用者キー（利用者の担当グループ）
  const th={};const nm=id=>(S.staffList.find(s=>s.id===String(id))||{}).name||String(id);
  const add=(key,name,grp,m)=>{key=String(key);if(!th[key])th[key]={name,grp,msgs:[],to:[]};th[key].msgs.push(m);};
  const myG=new Set();for(const x of (LWQ&&LWQ.list)||[])if(x.group&&x.dir!=='in'&&(x.by===ME.name||(x.to||[]).map(String).includes(String(ME.id))))myG.add(x.group);
  // 幹部・管理者も含めて全員、自分が送った・自分あて・自分の入っているグループの分だけ（サーバーが全部返した場合やデモでも、ほかの人のトークは出さない）
  const isMine=x=>{const to=(x.to||[]).map(String),me=String(ME.id);
    if(x.by===ME.name||to.includes(me))return true;
    {const dg=x.group&&String(x.group).startsWith('d:')?String(x.group).slice(2).split('・'):(!x.group&&x.label&&x.label.split('、').every(n=>DEPTS.includes(n)))?x.label.split('、'):[];if(dg.some(n=>deptsOf(ME).includes(n)))return true;}
    if(x.dir==='in')return String(x.from)===me||(x.replyTo&&normName(x.replyTo)===normName(ME.name))||(x.group&&myG.has(x.group));
    if(DEMO&&!DEMO.real&&x.label&&x.label.split('、').some(n=>ME.depts.includes(n)))return true;return false;};
  for(const x of (LWQ&&LWQ.list)||[]){
    if(!isMine(x))continue;
    if(x.dir==='in'){const rel=String(x.from)!==String(ME.id)&&((x.replyTo&&normName(x.replyTo)===normName(ME.name))||(x.group&&myG.has(x.group)));const m={mine:false,who:x.fromName,text:x.text,at:x.at,iid:x.id,read:x.read||{},toMe:rel,x};
      if(x.group)add('g:'+x.group,x.groupName||'グループ',true,m);else add(x.from,x.fromName||nm(x.from),false,m);continue;}
    const pend=x.status==='wait';
    if(pend&&x.by!==ME.name)continue; // 送信待ち・予約中は送った本人にだけ見せる（相手にはまだ届いていない）
    const at=x.sentAt||x.at,mine=x.by===ME.name,failed=new Set(((x.result||{}).failed||[]).map(f=>f.name));
    if(!x.group&&x.label&&x.label.split('、').every(n=>DEPTS.includes(n)||n==='幹部'||n==='管理者')){x.group='d:'+x.label.split('、').join('・');x.groupName=x.label.split('、').join('・');}
    if(!x.group&&/ 様の担当$/.test(x.label||'')){const u=S.users.find(u=>u.name+' 様の担当'===x.label);if(u){x.group='u:'+u.key;x.groupName=x.label;}} // 前に送った分もグループにまとめる
    if(x.group){const k='g:'+x.group;add(k,x.groupName||x.label||'グループ',true,{mine,who:x.by,text:x.text,at,n:(x.to||[]).length,wait:pend,iid:x.id,read:x.read||{},rcpt:(x.to||[]).map(String),toMe:!mine&&(x.to||[]).map(String).includes(String(ME.id)),x});th[k].to=(x.to||[]).map(String);continue;}
    const toMe=!pend&&!mine&&(x.to||[]).map(String).includes(String(ME.id));
    if(toMe){const snd=S.staffList.find(s=>normName(s.name)===normName(x.by));if(snd)add(snd.id,snd.name,false,{mine:false,who:x.by,text:x.text,at,iid:x.id,read:x.read||{},toMe:true,x});}
    for(const id of x.to||[]){if(String(id)===String(ME.id))continue;const st=S.staffList.find(s=>s.id===String(id));add(id,nm(id),false,{mine,who:x.by,text:x.text,at,n:(x.to||[]).length,label:x.label,ng:st&&failed.has(st.name),wait:pend,iid:x.id,read:x.read||{},rcpt:[String(id)],x});}
  }
  for(const k in th)th[k].msgs.sort((a,b)=>a.at-b.at);
  for(const n of TALK_DEPTS())if(!th['g:d:'+n])th['g:d:'+n]={name:n,grp:true,msgs:[],to:[]};
  for(const k in TALK_NEW)if(!th[k])th[k]={name:TALK_NEW[k].name,grp:TALK_NEW[k].grp,msgs:[],to:[]};
  return th;
}

// ===== LINEアルバムの写真を取り込む（写真に書いてある利用者名で振り分け） =====
let ALB=[];
const ALB_TYPES=PHOTO_TYPES;
const ALB_DOC=t=>!/顔写真|その他/.test(t);
// LINEアルバムから保存したファイル名（LINE_ALBUM_アルバム名_日付_番号.jpg）のアルバム名から種類を決める
function albTypeOf(name,def){const n=String(name||'');
  if(/上限/.test(n))return '上限管理票';if(/受給者証|受給証/.test(n))return '受給者証';if(/負担割合/.test(n))return '負担割合証';
  if(/医療保険|健康保険/.test(n))return '医療保険証';if(/介護保険/.test(n))return '介護保険証';if(/誕生/.test(n))return '顔写真（誕生日）';return def;}
// 書類用：氏名が「姓」「名」の順で近くに並んでいるときだけ一致とみなす（書類は文字が多いので厳しく判定）
function albStrict(text){
  const t=normName(String(text||'').replace(/\s/g,''));const hits=[];
  for(const u of S.users){const n=normName(u.name);if(n.length<2)continue;
    if(t.includes(n)){hits.push([u,0,n.length]);continue;}
    const ps=String(u.name).trim().split(/[\s　]+/).map(normName).filter(Boolean);
    if(ps.length===2&&n.length>=3){let i=-1,ok=false;while((i=t.indexOf(ps[0],i+1))>=0){const g=t.indexOf(ps[1],i+ps[0].length);if(g>=0&&g-i-ps[0].length<=8){ok=true;break;}}if(ok){hits.push([u,0,n.length]);continue;}}
    if(n.length>=4){for(let i=0;i+n.length<=t.length;i++){let miss=0;for(let j=0;j<n.length&&miss<2;j++)if(t[i+j]!==n[j])miss++;if(miss<=1){hits.push([u,1,n.length]);break;}}}}
  hits.sort((a,b)=>a[1]-b[1]||b[2]-a[2]);return hits.length?hits[0][0].key:'';
}
function albRot(im,deg,scale){const w=im.width*scale,h=im.height*scale;const c=document.createElement('canvas');const sw=deg%180?h:w,sh=deg%180?w:h;c.width=sw;c.height=sh;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,sw,sh);g.translate(sw/2,sh/2);g.rotate(deg*Math.PI/180);g.drawImage(im,-w/2,-h/2,w,h);return c.toDataURL('image/png');}
// 書類の写真：全体を読む（横向きの書類にそなえて 0°・90°・270° を順に試す）
async function albDoc(dataUrl){
  await loadOcr();if(!OCRW){OCRW=await Tesseract.createWorker('jpn');}
  const im=await loadImg(dataUrl);
  for(const deg of [0,90,270]){await OCRW.setParameters({tessedit_pageseg_mode:'3'});const r=await OCRW.recognize(albRot(im,deg,1.5));const k=albStrict(r.data.text);if(k)return k;}
  return '';
}
function albMatch(text){
  const t=normName(String(text||'').replace(/[様さま\s]/g,''));if(t.length<2)return '';
  let best=null,bs=0;
  for(const u of S.users){const n=normName(u.name);if(!n)continue;let i=0,hit=0;for(const c of n){const k=t.indexOf(c,i);if(k>=0){hit++;i=k+1;}}
    const sc=hit/n.length;if(sc>bs||(sc===bs&&best&&n.length>normName(best.name).length)){bs=sc;best=u;}}
  return best&&bs>=0.75?best.key:'';
}
function loadOcr(){return window.Tesseract?Promise.resolve():new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';sc.onload=res;sc.onerror=()=>rej(new Error('文字読み取りの部品を読み込めませんでした'));document.head.appendChild(sc);});}
let OCRW=null;
// 写真の角に書かれた名前を読む：角だけを切り出して大きくし、白黒にしてから1行として読む
function albPrep(im,x,y,w,h){
  const sc=Math.max(2,Math.min(6,1500/w));const pad=40;
  const c=document.createElement('canvas');c.width=Math.round(w*sc)+pad*2;c.height=Math.round(h*sc)+pad*2;
  const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.imageSmoothingQuality='high';
  g.drawImage(im,x,y,w,h,pad,pad,Math.round(w*sc),Math.round(h*sc));
  const d=g.getImageData(pad,pad,Math.round(w*sc),Math.round(h*sc));const a=d.data;let mn=255,mx=0;
  for(let k=0;k<a.length;k+=4){const v=a[k]*.299+a[k+1]*.587+a[k+2]*.114;a[k]=v;if(v<mn)mn=v;if(v>mx)mx=v;}
  const th=mn+(mx-mn)*0.6;for(let k=0;k<a.length;k+=4){const v=a[k]>th?255:0;a[k]=a[k+1]=a[k+2]=v;}
  g.putImageData(d,pad,pad);return c.toDataURL('image/png');
}
async function albOcr(dataUrl){
  await loadOcr();if(!OCRW){OCRW=await Tesseract.createWorker('jpn');}
  const im=await loadImg(dataUrl);const W=im.width,H=im.height;const out=[];
  const band=(y0,h)=>{const c=document.createElement('canvas');c.width=W;c.height=Math.round(H*h);c.getContext('2d').drawImage(im,0,Math.round(H*y0),W,c.height,0,0,c.width,c.height);return c.toDataURL('image/png');};
  const tryOne=async(img,psm)=>{await OCRW.setParameters({tessedit_pageseg_mode:psm});const r=await OCRW.recognize(img);const t=(r.data.text||'').replace(/\s+/g,' ').trim();if(t)out.push(t);return albMatch(t);};
  // ①前からのやり方そのまま：上下の帯を標準の読み方（1ブロック）で読み、2つを合わせて名前を探す（井上陽子様などはこれで読めていた）
  for(const [y0,h] of [[0,0.11],[0.89,0.11]]) await tryOne(band(y0,h),'6');
  if(albMatch(out.join(' ')))return out.join(' ');
  // ②角だけを切り出して拡大・白黒にして1行として読む（宮田正子様のような小さい文字）
  for(const [cx,cy] of [[0,0],[1,0],[0,1],[1,1]]) for(const fh of [0.07,0.1]) for(const fw of [0.45,0.65]){
    const w=Math.round(W*fw),h=Math.max(12,Math.round(H*fh));if(await tryOne(albPrep(im,cx?W-w:0,cy?H-h:0,w,h),'7'))return out.join(' ');}
  // ③上下の帯を横いっぱいで拡大・白黒にして読む（真ん中に書いてある名前）
  for(const [y0,h] of [[0,0.08],[0,0.12],[0.92,0.08],[0.88,0.12]]) if(await tryOne(albPrep(im,0,Math.round(H*y0),W,Math.max(12,Math.round(H*h))),'7'))return out.join(' ');
  return out.join(' ');
}
async function albPick(files){
  const list=[...files].filter(f=>/^image\//.test(f.type)||/\.(jpe?g|png|heic)$/i.test(f.name));
  ALB=list.map(f=>({f,key:albMatch(f.name),type:albTypeOf(f.name,$('#albType').value),state:'',url:URL.createObjectURL(f)}));
  $('#albList').innerHTML=albListHtml();
  if($('#albOcr').checked){
    $('#albMsg').textContent='写真に書いてある名前を読み取っています…（はじめは1分ほどかかります）';
    for(let i=0;i<ALB.length;i++){const a=ALB[i];if(a.key)continue;try{if(ALB_DOC(a.type)){a.key=await albDoc(await shrink(a.f));if(!a.ocr&&!a.key)a.ocr='（書類：名前を読み取れませんでした）';}else{const t=await albOcr(await shrink(a.f));a.ocr=t;a.key=albMatch(t);}}catch(e){$('#albMsg').textContent=e.message+'。名前は手で選んでください。';break;}albRepaint(i);}
    if(!/部品/.test($('#albMsg').textContent))$('#albMsg').textContent='読み取りが終わりました。名前が合っているか確認して「保存」を押してください。';
  }
}
function albRowHtml(a,i){
  const u=IDX.userByKey.get(a.key);
  return `<div id="albRow${i}" style="display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)"><img src="${a.url}" style="width:70px;height:90px;object-fit:cover;border-radius:6px"><div style="flex:1"><input list="albUsers" value="${u?esc(u.name):''}" placeholder="利用者の名前" onchange="albSet(${i},this.value)" style="width:100%;max-width:260px"> ${u?'<span class="tag green">OK</span>':'<span class="tag red">未選択</span>'}<div class="note">${esc(a.f.name)}${a.ocr?`　読み取り：${esc(a.ocr.replace(/\s+/g,'').slice(0,20))}`:''}</div></div><select onchange="ALB[${i}].type=this.value">${ALB_TYPES.map(t=>`<option ${t===a.type?'selected':''}>${t}</option>`).join('')}</select><span class="note" style="width:70px">${a.state}</span></div>`;
}
function albListHtml(){return ALB.length?`<datalist id="albUsers">${S.users.map(u=>`<option value="${esc(u.name)}">`).join('')}</datalist>${ALB.map(albRowHtml).join('')}<div class="row" style="margin-top:8px"><button class="btn" id="albBtn" onclick="albSave()">名前が入っている${ALB.length}枚を保存</button></div>`:'';}
function albRepaint(i){setTimeout(()=>{const el=$('#albRow'+i);if(el&&el.isConnected){const t=document.createElement('template');t.innerHTML=albRowHtml(ALB[i],i).trim();el.replaceWith(t.content.firstChild);}},0);}
function albSet(i,v){const u=S.users.find(x=>normName(x.name)===normName(v));ALB[i].key=u?u.key:'';albRepaint(i);}
// ===== 同じ写真の見分け（縮小画像から16×16の明るさの並びを作って比べる。同じ写真なら種類が違っても重複とみなす） =====
const PHASH={};
async function dhash(src){const im=await loadImg(src);const a=document.createElement('canvas');a.width=68;a.height=64;const ga=a.getContext('2d');ga.imageSmoothingQuality='high';ga.drawImage(im,0,0,68,64);
  const c=document.createElement('canvas');c.width=17;c.height=16;const g=c.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(a,0,0,17,16);const d=g.getImageData(0,0,17,16).data;const L=i=>d[i]*.299+d[i+1]*.587+d[i+2]*.114;
  let h='';for(let r=0;r<16;r++)for(let x=0;x<16;x++){const i=(r*17+x)*4;h+=L(i)>L(i+4)?'1':'0';}return h;}
const hdist=(a,b)=>{let n=0;for(let i=0;i<a.length;i++)if(a[i]!==b[i])n++;return n;};
const isDupHash=(a,b)=>a&&b&&hdist(a,b)<=20;
async function photoHashes(ids,onProg){
  const need=ids.filter(id=>!(id in PHASH));let done=0;
  const src=[];for(const id of need){const c=THUMB[id]||PHOTO_CACHE[id]||await tGet(id);if(c){try{PHASH[id]=await dhash(c);}catch(e){PHASH[id]=null;}done++;}else src.push(id);}
  for(let i=0;i<src.length;i+=30){const part=src.slice(i,i+30);let got={};try{got=await api('getThumbs',{ids:part},true);}catch(e){}
    for(const id of part){let t=got[id];if(!t){try{const full=await api('getPhoto',{id},true);t=await makeThumb(full);api('putThumb',{id,data:t},true).catch(()=>{});}catch(e){t=null;}}
      if(t){THUMB[id]=t;tPut(id,t);try{PHASH[id]=await dhash(t);}catch(e){PHASH[id]=null;}}else PHASH[id]=null;done++;}
    if(onProg)onProg(done,need.length);}
}
// すでに入っている重複写真を探して、1枚だけ残して削除する（利用者ごと。いちばん新しく保存したものを残す）
async function dupClean(){
  const box=$('#dupMsg');const btn=$('#dupBtn');btn.disabled=true;box.textContent='写真を調べています…（枚数が多いと数分かかります）';
  try{await photoHashes(PHOTOS.map(p=>p.id),(d,t)=>{box.textContent=`写真を調べています… ${d}／${t}枚`;});}catch(e){box.textContent=e.message;btn.disabled=false;return;}
  const dels=[];const byU={};PHOTOS.forEach((p,i)=>{(byU[p.userKey]=byU[p.userKey]||[]).push(p);});
  for(const k in byU){const keep=[];for(const p of byU[k].slice().reverse()){const h=PHASH[p.id];if(!h)continue;if(keep.some(q=>isDupHash(PHASH[q.id],h)))dels.push(p);else keep.push(p);}}
  if(!dels.length){box.textContent='重複している写真はありませんでした。';btn.disabled=false;return;}
  const names=[...new Set(dels.map(p=>p.userName))];
  if(!confirm(`重複している写真が${dels.length}枚見つかりました（${names.length}人分：${names.slice(0,8).join('、')}${names.length>8?' ほか':''}）。\n同じ写真は、いちばん新しく保存した1枚だけ残して、残りを削除します。よろしいですか？\n（ドライブのゴミ箱に移り、30日間は元に戻せます）`)){box.textContent='削除しませんでした。';btn.disabled=false;return;}
  let ok=0;for(const p of dels){try{await api('deletePhoto',{id:p.id},true);PHOTOS=PHOTOS.filter(x=>x.id!==p.id);ok++;}catch(e){}box.textContent=`削除しています… ${ok}／${dels.length}枚`;}

}
async function albSave(){
  const todo=ALB.filter(a=>a.key&&a.state!=='保存済み');if(!todo.length){alert('利用者が選ばれている写真がありません');return;}
  $('#albBtn').disabled=true;let ok=0;
  let n=0;const tot=todo.length;const prog=()=>{const m=`保存しています… ${n}／${tot}枚（1枚5〜10秒かかります。終わるまでこの画面を閉じないでください）`;$('#albMsg').textContent=m;const bt=$('#albBtn');if(bt)bt.textContent=`保存中… ${n}／${tot}枚`;};prog();
  for(let i=0;i<ALB.length;i++){const a=ALB[i];if(!a.key||a.state==='保存済み')continue;a.state='保存中…';albRepaint(i);
    try{const data=await shrink(a.f);let th='';try{th=await makeThumb(data);}catch(e){}
      let h=null;try{h=await dhash(th||data);}catch(e){}
      if(h){await photoHashes(PHOTOS.filter(x=>x.userKey===a.key).map(x=>x.id));if(PHOTOS.some(x=>x.userKey===a.key&&isDupHash(PHASH[x.id],h))){a.state='同じ写真あり（保存しない）';n++;prog();albRepaint(i);continue;}}
      const p=await api('uploadPhoto',{userKey:a.key,type:a.type,data,thumb:th,src:'LINEアルバム',at:new Date(a.f.lastModified||Date.now()).toISOString()},true);PHOTO_CACHE[p.id]=data;if(h)PHASH[p.id]=h;PHOTOS.push(p);a.state='保存済み';ok++;}

  $('#albBtn').disabled=false;{const dp=ALB.filter(a=>a.state==='同じ写真あり（保存しない）').length,nk=ALB.filter(a=>!a.key).length;$('#albMsg').textContent=`${ok}枚を保存しました。利用者ページの写真に入っています。`+(dp?`同じ写真がすでにあった${dp}枚は保存していません。`:'')+(nk?`名前が入っていない${nk}枚は保存していません（名前を選んでもう一度「保存」を押すと保存できます）。`:'');}
}
