<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>アロハ業務ポータル</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1f2937;--sub:#6b7280;--line:#e5e7eb;--accent:#0f766e;--accent-soft:#e6f4f2;--red:#b91c1c;--red-soft:#fdecec;--amber:#a16207;--amber-soft:#fdf6e3;--blue:#1d4ed8;--blue-soft:#eaf0fd}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Yu Gothic UI","Hiragino Sans",Meiryo,sans-serif;font-size:14px}
header{background:var(--accent);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;font-weight:700}
header .today{font-size:13px;opacity:.85}
nav{background:#fff;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;position:sticky;top:0;z-index:5}
nav button{border:0;background:none;padding:12px 14px;font-size:14px;color:var(--sub);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;font-family:inherit}
nav button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px}
.note{color:var(--sub);font-size:12.5px;line-height:1.6}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer}
.stat b{display:block;font-size:24px;margin-top:4px}
.stat.red b{color:var(--red)}.stat.amber b{color:var(--amber)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
th{background:#f9fafb;color:var(--sub);font-weight:600;position:sticky;top:44px}
.tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:999px;background:#f1f5f9;color:#334155;margin:1px 2px 1px 0}
.tag.red{background:var(--red-soft);color:var(--red)}.tag.amber{background:var(--amber-soft);color:var(--amber)}.tag.green{background:var(--accent-soft);color:var(--accent)}.tag.blue{background:var(--blue-soft);color:var(--blue)}
button.btn,label.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer;font-family:inherit;display:inline-block}
button.btn.sub,label.btn.sub{background:#fff;color:var(--accent)}
button.btn.danger{background:#fff;color:var(--red);border-color:var(--red)}
input,select,textarea{font-family:inherit;font-size:14px;padding:7px 9px;border:1px solid #cbd5e1;border-radius:8px;background:#fff}
.drop{border:2px dashed #94a3b8;border-radius:12px;padding:28px;text-align:center;color:var(--sub);background:#fafafa;cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.list-user{cursor:pointer}.list-user:hover{background:#f8fafc}
.split{display:grid;grid-template-columns:320px 1fr;gap:14px}
@media(max-width:800px){.split{grid-template-columns:1fr}th{top:0}}
.ulist{max-height:70vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
.ulist div{padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.ulist div.on{background:var(--accent-soft)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:4px 10px;font-size:13.5px}
.kv dt{color:var(--sub)}.kv dd{margin:0}
.photos{display:flex;flex-wrap:wrap;gap:10px}
.photo{width:150px;font-size:12px;color:var(--sub)}
.photo img{width:150px;height:110px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block;cursor:zoom-in}
.tl{position:relative;height:26px;background:#f1f5f9;border-radius:6px;overflow:hidden}
.tl .busy{position:absolute;top:0;bottom:0;background:#0f766e;opacity:.85;border-right:1px solid #fff}
.tl .busy.other{background:#64748b}
.tlhead{position:relative;height:16px;font-size:10.5px;color:var(--sub)}
.tlhead span{position:absolute;transform:translateX(-50%)}
.msg{white-space:pre-wrap;background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px}
.warn{background:var(--red-soft);color:var(--red);border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:13px}
.ok{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:13px}
.typebtns{display:flex;flex-wrap:wrap;gap:8px}
.typebtns button{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:10px 12px;font-size:14px;font-family:inherit;cursor:pointer}
.typebtns button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#preview{max-width:100%;max-height:50vh;border-radius:10px;margin-top:10px;display:none}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:20}
.zoom img{max-width:95vw;max-height:92vh}
.hide{display:none}
@media print{header,nav,.noprint{display:none!important}.card{border:0}th{position:static}}
</style>
</head>
<body>
<header><h1>アロハ業務ポータル <span style="font-weight:400;font-size:12px;opacity:.8"></span></h1><span class="today" id="today"></span></header>
<nav id="nav"></nav>
<main id="main"></main>
<div class="zoom" id="zoom" onclick="this.style.display='none'"><img id="zoomimg" alt=""></div>
<input type="file" id="cam" accept="image/*" capture="environment" class="hide">
<script>
// ===== 基本 =====
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const TODAY=new Date();TODAY.setHours(0,0,0,0);const TODAY_ISO=iso(TODAY);
const WD='日月火水木金土';
const md=s=>{if(!s)return'';const d=new Date(s+'T00:00');return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`};
const mdy=s=>{if(!s)return'';return (s.slice(0,4)==String(TODAY.getFullYear())?'':s.slice(0,4)+'/')+md(s)};
const daysTo=s=>Math.round((new Date(s+'T00:00')-TODAY)/864e5);
const normName=s=>String(s||'').replace(/[\s　★☆＊*]/g,'').replace(/様$/,'').replace(/髙/g,'高').replace(/﨑/g,'崎').replace(/德/g,'徳').replace(/濵/g,'浜');
const PHOTO_TYPES=['介護保険証','医療保険証','受給者証','上限管理票','顔写真（基本情報）','顔写真（誕生日）','その他'];
// 和暦・西暦の日付を YYYY-MM-DD に
function toISODate(s){
  s=String(s||'').trim(); if(!s||s==='-') return '';
  let m=s.match(/(\d{4})[-\/年](\d{1,2})[-\/月](\d{1,2})/); if(m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  m=s.match(/(令和|平成|昭和)(\d+|元)年(\d{1,2})月(\d{1,2})日/);
  if(m){const base={令和:2018,平成:1988,昭和:1925}[m[1]];const y=base+(m[2]==='元'?1:+m[2]);return `${y}-${pad(m[3])}-${pad(m[4])}`;}
  return '';
}
function ageOn(birth,on){if(!birth)return null;const b=new Date(birth+'T00:00');let a=on.getFullYear()-b.getFullYear();if(on.getMonth()<b.getMonth()||(on.getMonth()===b.getMonth()&&on.getDate()<b.getDate()))a--;return a;}

// ===== 保存サーバー（GAS）とのやりとり =====
// 画面を何度作り直しても、データと写真はサーバー（スプレッドシート・ドライブ）に残ります
const DEFAULT_API='__API_URL__';
const API=()=>{const q=new URLSearchParams(location.search).get('api');if(q){try{localStorage.setItem('portalApi',q);}catch(e){}}let v='';try{v=localStorage.getItem('portalApi')||'';}catch(e){}return v||DEFAULT_API;};
let TOKEN='';try{TOKEN=localStorage.getItem('portalToken')||'';}catch(e){}
function busy(msg){let b=$('#busy');if(!b){b=document.createElement('div');b.id='busy';b.style.cssText='position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:30;display:none';document.body.appendChild(b);}b.textContent=msg||'';b.style.display=msg?'block':'none';}
async function api(action,params={},quiet){
  if(!quiet)busy(action==='getPhoto'?'':'通信中…');
  try{
    let lastErr;
    for(let i=0;i<3;i++){
      let r;try{r=await fetch(API(),{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(Object.assign({action,token:TOKEN},params))});}catch(e){lastErr=new Error('サーバーにつながりませんでした（ネット接続を確認してください）');await new Promise(r=>setTimeout(r,1500));continue;}
      const t=await r.text();let j;try{j=JSON.parse(t);}catch(e){lastErr=new Error('サーバーの応答が読めませんでした');await new Promise(r=>setTimeout(r,1500));continue;}
      if(!j.ok){if(/ログインしてください|期限が切れ/.test(j.error||'')&&!['login','setupStatus','initStaff'].includes(action)){TOKEN='';try{localStorage.removeItem('portalToken');}catch(e){}ME=null;}throw new Error(j.error||'エラー');}
      return j.data;
    }
    throw lastErr;
  }finally{if(!quiet)busy('');}
}
// 変更したデータだけをサーバーへ保存
async function save(...keys){
  if(!keys.length) return;
  const sets={};keys.forEach(k=>sets[k]=k==='staff'?S.staffList:S[k]);
  try{await api('save',{sets});}catch(e){alert('保存できませんでした：'+e.message);throw e;}
}
const DIRTY=new Set();
async function flush(){const k=[...DIRTY];DIRTY.clear();await save(...k);}
const DEFAULT_KW=['至急','緊急','必ず','事故','転倒','救急','入院','死亡','亡くな','中止','キャンセル','変更','感染','発熱','コロナ','インフル','ヒヤリ','苦情','重要'];
let S={users:[],visits:[],staffList:[],notices:[],tasks:[],line:[],meta:{imports:{}},settings:{alertDays:60,workStart:'08:30',workEnd:'18:00',faceRequest:false,keywords:DEFAULT_KW.slice(),taxiDriver:'内田 伸也'}};
let PHOTOS=[];

// ===== 取り込み =====
function decode(buf){try{return new TextDecoder('utf-8',{fatal:true}).decode(buf).replace(/^﻿/,'');}catch(e){return new TextDecoder('shift_jis').decode(buf);}}
function parseCSV(t){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}else if(c==='"')q=true;else if(c===','){row.push(f);f='';}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f='';}else f+=c;}if(f!==''||row.length){row.push(f);rows.push(row);}return rows.filter(r=>r.some(x=>x.trim()!==''));}
function objs(rows){const h=rows[0].map(x=>x.replace(/^﻿/,'').trim());return rows.slice(1).map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]||'').trim()])));}

async function importFiles(files){
  const log=[];
  for(const f of files){
    try{
      const buf=await f.arrayBuffer();
      if(/\.pdf$/i.test(f.name)){log.push(await importHoukanPDF(buf,f.name));continue;}
      if(/\.txt$/i.test(f.name)){log.push(importLine(decode(buf),f.name));continue;}
      const rows=parseCSV(decode(buf)); if(!rows.length){log.push(`${f.name}：中身がありません`);continue;}
      const h=rows[0].join(',');
      if(/町名以下|利用者生年月日/.test(h)) log.push(importUserInfo(objs(rows),f.name));
      else if(/利用者カナ/.test(h)) log.push(importUsers(objs(rows),f.name));
      else if(/ヘルパー名/.test(h)&&/開始時間/.test(h)) log.push(importHoukai(objs(rows),f.name));
      else if(/(^|,)code(,|$)/.test(h)&&/(^|,)name(,|$)/.test(h)) log.push(importStaff(objs(rows).map(r=>({id:r.code,name:r.name,birth:r.birthDate,cls:r.classification})),f.name));
      else if(/(氏名|職員名|名前)/.test(h)&&/生年月日/.test(h)) log.push(importStaff(objs(rows).map(r=>({id:r['ID']||r['番号']||r['コード']||'',name:r['氏名']||r['職員名']||r['名前'],birth:r['生年月日'],cls:r['区分']||r['雇用形態']||''})),f.name));
      else log.push(`${f.name}：どの種類のファイルか判断できませんでした`);
    }catch(e){log.push(`${f.name}：読み込みエラー（${e.message}）`);}
  }
  return log;
}
function importUsers(list,name){
  const map=new Map();
  for(const r of list){
    const nm=r['利用者名']; if(!nm) continue;
    const key=normName(r['利用者カナ']||nm)+'|'+(r['生年月日']||'');
    const u=map.get(key)||{key,name:nm,kana:r['利用者カナ']||'',birth:toISODate(r['生年月日']),sex:r['性別']||'',depts:[],kubun:[],using:false,ninteiStatus:'',hokensha:'',kaigodo:'',ninteiEnd:'',careMgr:'',kyotaku:'',houkatsu:'',iryoType:'',iryoEnd:'',jogen:null};
    const add=(arr,v)=>{v&&v.split(/[・\/]/).forEach(x=>{x=x.trim();if(x&&!arr.includes(x))arr.push(x);});};
    add(u.depts,r['部署']); add(u.kubun,r['区分']);
    if(r['利用者状態']==='利用中') u.using=true;
    const set=(k,v)=>{if(v&&v!=='-'&&!u[k])u[k]=v;};
    set('ninteiStatus',r['被保険者証認定区分']); set('hokensha',r['保険者名']); set('kaigodo',r['要介護度']);
    set('careMgr',r['担当ケアマネ']); set('kyotaku',r['担当居宅支援事業所']); set('houkatsu',r['担当地域包括支援センター']); set('iryoType',r['医療保険種類']); set('address',r['住所']);
    const ne=toISODate(r['認定有効終了年月日']); if(ne&&(!u.ninteiEnd||ne>u.ninteiEnd)) u.ninteiEnd=ne;
    const ie=toISODate(r['医療保険適用期間(至)']); if(ie&&(!u.iryoEnd||ie>u.iryoEnd)) u.iryoEnd=ie;
    const j=r['障害_負担上限月額']; if(j!==''&&j!=null&&!isNaN(+j)) u.jogen=Math.max(u.jogen??0,+j);
    map.set(key,u);
  }
  S.users=[...map.values()].sort((a,b)=>(a.kana||a.name).localeCompare(b.kana||b.name,'ja'));
  applyExtra();
  S.meta.imports.users={at:new Date().toISOString(),file:name};DIRTY.add('users');DIRTY.add('meta');
  return `利用者一覧：${list.length}行 → ${S.users.length}名に整理しました`;
}
// 初期の役割：役員＝幹部、事業所の管理者4名＝管理者（あとから職員管理で変えられる）
const DEFAULT_MANAGERS=['前垣祐輔','川端英芽','谷井恭子','菊地順子'];
function defaultRole(r){if(/役員/.test(r.cls||''))return '幹部';if(DEFAULT_MANAGERS.includes(normName(r.name)))return '管理者';return '一般';}
// カイポケの利用者情報CSV（通所・居宅支援など）から、生年月日・性別・住所だけを補う
// ※このCSVには銀行・口座番号も入っているが、ここでは読まず保存もしない
function importUserInfo(list,name){
  S.extra=S.extra||{};let n=0;
  for(const r of list){const nm=r['利用者名'];if(!nm)continue;
    const addr=[[r['都道府県'],r['市区町村'],r['町名以下']].join(''),r['建物名']].map(x=>(x||'').replace(/\s+/g,' ').trim()).filter(Boolean).join(' ');
    S.extra[normName(nm)]={name:nm,kana:r['利用者カナ']||'',birth:toISODate(r['利用者生年月日']),sex:r['性別']||'',address:addr};n++;}
  const filled=applyExtra();
  S.meta.imports.userinfo={at:new Date().toISOString(),file:name};DIRTY.add('extra');DIRTY.add('users');DIRTY.add('meta');
  return `利用者情報：${n}名分を読み、${filled}名の生年月日・住所などを補いました（口座などの列は保存していません）`;
}
// 全利用者CSVで空欄のところだけを補う（全利用者CSVを取り込み直しても消えない）
function applyExtra(){
  if(!S.extra) return 0;let filled=0;
  for(const u of S.users){const x=S.extra[normName(u.name)];if(!x)continue;let ch=false;
    if(!u.birth&&x.birth){u.birth=x.birth;ch=true;} if(!u.sex&&x.sex){u.sex=x.sex;ch=true;} if(!u.kana&&x.kana){u.kana=x.kana;ch=true;}
    if(x.address&&(!u.address||u.address.length<x.address.length)){u.address=x.address;ch=true;}
    if(ch)filled++;}
  return filled;
}
function importStaff(list,name){
  // 使うのは番号・氏名・区分・生年月日だけ（給与などの列は読みません）
  let add=0,upd=0;
  for(const r of list){ if(!r.name) continue; const id=String(r.id||'').trim()||('s'+(S.staffList.length+1));
    let st=S.staffList.find(x=>x.id===id)||S.staffList.find(x=>normName(x.name)===normName(r.name));
    if(st){st.name=r.name;st.birth=toISODate(r.birth)||st.birth;st.cls=r.cls||st.cls;upd++;}
    else{S.staffList.push({id,name:r.name,birth:toISODate(r.birth),cls:r.cls||'',depts:[],role:defaultRole(r),active:true,pass:''});add++;}
  }
  autoDepts();
  S.meta.imports.staff={at:new Date().toISOString(),file:name};DIRTY.add('staff');DIRTY.add('meta'); return `職員名簿：新規${add}名・更新${upd}名（番号・氏名・区分・生年月日のみ使用）`;
}
// 予定データから所属を自動でつける（管理者が手で直した所属は上書きしない）
function autoDepts(){
  const nurse=new Set(S.visits.filter(v=>v.src==='訪看').map(v=>normName(v.staff)));
  const helper=new Set(S.visits.filter(v=>v.src==='訪介').map(v=>normName(v.staff)));
  const cm=new Set(S.users.map(u=>normName(u.careMgr)).filter(Boolean));
  for(const st of S.staffList){ if(st.deptsManual) continue; const n=normName(st.name);const d=[];
    if(helper.has(n))d.push('ヘルパー'); if(nurse.has(n))d.push('ナース'); if(cm.has(n))d.push('ケアマネ'); if(st.role==='幹部'&&!d.length)d.push('事務'); st.depts=d; }
}
// ===== LINEトーク履歴 =====
function importLine(text,name){
  const lines=text.replace(/\r/g,'').split('\n');let date='',cur=null,add=0;const have=new Set(S.line.map(m=>m.id));const out=[];
  const push=()=>{if(!cur)return;cur.text=cur.text.replace(/^"|"$/g,'').trim();if(!cur.text||/^\[(スタンプ|写真|動画|ファイル|ボイスメッセージ|連絡先)\]$/.test(cur.text)||/メッセージの送信を取り消しました|がグループに参加しました|がグループを退会しました|を招待しました/.test(cur.text)){cur=null;return;}
    cur.id=hashStr(cur.date+cur.time+cur.from+cur.text);if(!have.has(cur.id)){have.add(cur.id);out.push(cur);add++;}cur=null;};
  for(const ln of lines){
    let m=ln.match(/^(\d{4})[\/.](\d{1,2})[\/.](\d{1,2})\((.)\)\s*$/); if(m){push();date=`${m[1]}-${pad(m[2])}-${pad(m[3])}`;continue;}
    m=ln.match(/^(\d{1,2}:\d{2})\t([^\t]*)\t?(.*)$/); if(m&&date){push();cur={date,time:m[1].padStart(5,'0'),from:m[2],text:m[3]};continue;}
    if(cur) cur.text+='\n'+ln;
  }
  push(); S.line.push(...out); S.line.sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  S.meta.imports.line={at:new Date().toISOString(),file:name};DIRTY.add('line');DIRTY.add('meta');
  return `LINEトーク履歴：新しい連絡${add}件を取り込みました（取り込み済みの連絡は二重になりません）`;
}
function hashStr(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}return h.toString(36);}

// 訪介シフトCSVは「日」だけなので、曜日が合う月を前後1か月から探す
function guessMonth(rows){
  for(const k of [0,1,-1]){const d=new Date(TODAY.getFullYear(),TODAY.getMonth()+k,1);const y=d.getFullYear(),m=d.getMonth();
    if(rows.every(r=>{const day=+r['日付'];if(!day)return true;const x=new Date(y,m,day);return x.getMonth()===m&&WD[x.getDay()]===r['曜日'];})) return {y,m};}
  return null;
}
function importHoukai(list,name){
  const g=guessMonth(list); if(!g) throw new Error('曜日から対象月を判断できませんでした');
  const ym=`${g.y}-${pad(g.m+1)}`;
  S.visits=S.visits.filter(v=>!(v.src==='訪介'&&v.date.startsWith(ym)));
  let n=0; for(const r of list){ if(!r['日付']||!r['利用者']) continue;
    S.visits.push({src:'訪介',staff:r['ヘルパー名'],date:`${ym}-${pad(r['日付'])}`,start:r['開始時間'],end:r['終了時間'],user:r['利用者'],service:[r['業務種別'],r['サービス内容']].filter(Boolean).join(' '),note:r['備考']||''}); n++; }
  S.meta.imports.houkai={at:new Date().toISOString(),file:name,ym};DIRTY.add('visits');DIRTY.add('meta');
  return `訪問介護シフト：${g.y}年${g.m+1}月 ${n}件を取り込みました（同じ月の訪介予定は置き換え）`;
}
async function importHoukanPDF(buf,name){
  if(!window.pdfjsLib) throw new Error('PDF読み取り部品を読み込めませんでした（ネット接続を確認）');
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const doc=await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
  const out=[];const ranges={};
  for(let p=1;p<=doc.numPages;p++){
    const page=await doc.getPage(p);const tc=await page.getTextContent();
    const rows=[];for(const it of tc.items){if(!it.str.trim())continue;const y=it.transform[5],x=it.transform[4];let r=rows.find(r=>Math.abs(r.y-y)<2.5);if(!r){r={y,items:[]};rows.push(r);}r.items.push({x,s:it.str.trim()});}
    rows.sort((a,b)=>b.y-a.y);rows.forEach(r=>r.items.sort((a,b)=>a.x-b.x));
    const all=rows.map(r=>r.items.map(i=>i.s).join(' ')).join('\n');
    const sm=all.match(/職員名[：:]\s*([^\n]+)/);const staff=sm?sm[1].trim():'不明';
    const pm=all.match(/対象期間[：:]\s*令和(\d+)年(\d+)月(\d+)日\s*～\s*令和(\d+)年(\d+)月(\d+)日/);
    let y0=TODAY.getFullYear(),m0=1;
    if(pm){y0=2018+(+pm[1]);m0=+pm[2];const a=`${y0}-${pad(pm[2])}-${pad(pm[3])}`,b=`${2018+(+pm[4])}-${pad(pm[5])}-${pad(pm[6])}`;ranges[staff]={a,b};}
    rows.forEach((r,i)=>{
      const dm=r.items[0]&&r.items[0].s.match(/^(\d+)月(\d+)日/); if(!dm) return;
      const line=r.items.map(x=>x.s).join(' ');
      const tm=line.match(/(\d{1,2}:\d{2})\s*～\s*(\d{1,2}:\d{2})/); if(!tm) return;
      const mon=+dm[1];const yy=mon<m0?y0+1:y0;
      const nameIt=r.items.find(x=>/様$/.test(x.s)&&x.x>200&&x.x<320);
      let svc=r.items.filter(x=>x.x>=300&&x.x<420).map(x=>x.s).join('');
      if(!svc){ // 折り返しで上下の行に出ているとき
        const near=rows.filter((q,j)=>j!==i&&Math.abs(q.y-r.y)<=9&&!(q.items[0]&&/^\d+月\d+日/.test(q.items[0].s))).sort((a,b)=>b.y-a.y);
        svc=near.map(q=>q.items.filter(x=>x.x>=300&&x.x<420).map(x=>x.s).join('')).join('');
      }
      const oncall=(tm[1]==='00:00'&&tm[2]==='00:00')||(!nameIt&&/オンコール/.test(svc));
      out.push({src:'訪看',staff,date:`${yy}-${pad(mon)}-${pad(dm[2])}`,start:tm[1].padStart(5,'0'),end:tm[2].padStart(5,'0'),user:nameIt?nameIt.s.replace(/様$/,''):'',service:svc,other:!nameIt,oncall});
    });
  }
  // 同じ職員・同じ期間の訪看予定は置き換え
  for(const [st,r] of Object.entries(ranges)) S.visits=S.visits.filter(v=>!(v.src==='訪看'&&v.staff===st&&v.date>=r.a&&v.date<=r.b));
  S.visits.push(...out);
  S.meta.imports.houkan={at:new Date().toISOString(),file:name};DIRTY.add('visits');DIRTY.add('meta');
  const users=out.filter(v=>!v.other).length;
  return `訪問看護の職員別スケジュール：${Object.keys(ranges).length}名分・訪問${users}件（会議・オンコール等${out.length-users}件）を取り込みました`;
}

let IDX={};
function buildIndex(){
  const byName=new Map(S.users.map(u=>[normName(u.name),u]));
  const vByUser=new Map();
  for(const v of S.visits){if(v.other||!v.user)continue;const u=byName.get(normName(v.user));const k=u?u.key:'?'+normName(v.user);if(!vByUser.has(k))vByUser.set(k,[]);vByUser.get(k).push(v);}
  for(const a of vByUser.values()) a.sort((x,y)=>(x.date+x.start).localeCompare(y.date+y.start));
  const staffNames=[...new Set(S.visits.map(v=>v.staff))].sort((a,b)=>a.localeCompare(b,'ja'));
  IDX={byName,vByUser,staffNames,userByKey:new Map(S.users.map(u=>[u.key,u]))};
}
const userVisits=u=>IDX.vByUser.get(u.key)||[];
const nextVisit=(u,from=TODAY_ISO)=>userVisits(u).find(v=>v.date>=from);
const photosOf=(u,type)=>PHOTOS.filter(p=>p.userKey===u.key&&(!type||p.type===type)).sort((a,b)=>b.at.localeCompare(a.at));
function expiries(){
  const lim=S.settings.alertDays;const out=[];
  for(const u of S.users){
    if(u.ninteiEnd){const d=daysTo(u.ninteiEnd);if(d<=lim)out.push({u,kind:'介護保険証',label:'介護認定の有効期限',end:u.ninteiEnd,d,photo:'介護保険証'});}
    if(u.iryoEnd&&u.depts.includes('ナース')&&u.kubun.some(k=>/医療/.test(k))){const d=daysTo(u.iryoEnd);if(d<=lim)out.push({u,kind:'医療保険証',label:'医療保険の適用期間',end:u.iryoEnd,d,photo:'医療保険証'});}
  }
  return out.sort((a,b)=>a.d-b.d);
}
function jogenTargets(){
  const ym=TODAY_ISO.slice(0,7);
  return S.users.filter(u=>u.jogen>0).map(u=>{const vs=userVisits(u).filter(v=>v.date.startsWith(ym));return {u,last:vs[vs.length-1]||null,done:photosOf(u,'上限管理票').some(p=>p.at.slice(0,7)===ym)};});
}
function requests(){
  const reqs=[];
  for(const e of expiries()){
    // 期限が切れる前に新しい証を撮影済みなら依頼しない
    if(photosOf(e.u,e.photo).some(p=>daysTo(p.at.slice(0,10))>=-90&&p.at.slice(0,10)>=iso(new Date(new Date(e.end+'T00:00')-120*864e5)))) continue;
    const v=nextVisit(e.u);
    reqs.push({u:e.u,what:`${e.photo}（新しいもの）`,why:`${e.label} ${mdy(e.end)}${e.d<-365?'（登録が古い可能性）':e.d<0?' 期限切れ':''}`,v});
  }
  for(const j of jogenTargets()){ if(j.done) continue; reqs.push({u:j.u,what:'上限管理票',why:'今月の最終訪問',v:j.last}); }
  if(S.settings.faceRequest){
    const lim=iso(new Date(TODAY.getTime()+14*864e5));
    for(const u of S.users){ if(photosOf(u,'顔写真（基本情報）').length) continue; const v=nextVisit(u); if(v&&v.date<=lim) reqs.push({u,what:'顔写真（基本情報）',why:'未登録',v}); }
  }
  return reqs;
}
function busyOf(staff,date){return S.visits.filter(v=>v.staff===staff&&v.date===date&&!v.oncall).sort((a,b)=>a.start.localeCompare(b.start));}
const toMin=t=>{const [h,m]=t.split(':').map(Number);return h*60+m;};
const fromMin=n=>`${Math.floor(n/60)}:${pad(n%60)}`;
function freeSlots(staff,date){
  const s=toMin(S.settings.workStart),e=toMin(S.settings.workEnd);let cur=s;const out=[];
  for(const b of busyOf(staff,date)){const a=toMin(b.start),z=toMin(b.end);if(a>cur&&a-cur>=30)out.push([cur,Math.min(a,e)]);cur=Math.max(cur,z);}
  if(e-cur>=30)out.push([cur,e]);return out.filter(x=>x[1]>x[0]);
}
function birthdays(month){
  const list=[];
  for(const u of S.users){if(u.birth&&+u.birth.slice(5,7)===month&&u.using)list.push({kind:'利用者',name:u.name,birth:u.birth,u});}
  for(const s of S.staffList){if(s.active&&s.birth&&+s.birth.slice(5,7)===month)list.push({kind:'職員',name:s.name,birth:s.birth});}
  return list.sort((a,b)=>a.birth.slice(8).localeCompare(b.birth.slice(8)));
}

function calcMyUsers(){
  if(!ME){MYUSERS=new Set();return;}
  if(isOffice()){MYUSERS=new Set(S.users.map(u=>u.key));return;}
  const set=new Set();
  for(const v of S.visits){if(!v.other&&isMe(v.staff)){const u=IDX.byName.get(normName(v.user));if(u)set.add(u.key);}}
  for(const u of S.users){if(isMe(u.careMgr))set.add(u.key);if(ME.depts.includes('デイ')&&u.depts.includes('デイサービス'))set.add(u.key);}
  MYUSERS=set;
}

function buildMentions(){
  const sur=n=>String(n||'').split(/[\s　]/)[0].replace(/[★☆]/g,'');
  const cnt=a=>{const c={};a.forEach(x=>{c[x]=(c[x]||0)+1});return c;};
  const uSur=cnt(S.users.map(u=>sur(u.name))),sSur=cnt(S.staffList.map(s=>sur(s.name)));
  const up=S.users.map(u=>({k:u.key,full:normName(u.name),s:uSur[sur(u.name)]===1?sur(u.name):''}));
  const sp=S.staffList.map(s=>({id:s.id,name:s.name,full:normName(s.name),s:sSur[sur(s.name)]===1?sur(s.name):''}));
  for(const m of S.line){const t=normName(m.text).replace(/[、。]/g,'');
    m.users=up.filter(p=>t.includes(p.full)||(p.s&&(t.includes(p.s+'様')||t.includes(p.s+'さま')))).map(p=>p.k);
    m.staffs=sp.filter(p=>t.includes(p.full)||(p.s&&t.includes(p.s+'さん'))).map(p=>p.name);
  }
}

function lineList(list,limit){

  return list.slice(0,limit||9999).map(m=>{const imp=isImp(m);return `<div style="border-left:4px solid ${imp?'var(--red)':'var(--line)'};padding:4px 10px;margin-bottom:10px"><div class="note">${imp?'<span class="tag red">重要</span>':'<span class="tag">通常</span>'} ${md(m.date)} ${m.time}　${esc(m.from)}　${(m.users||[]).map(k=>{const u=IDX.userByKey.get(k);return u&&MYUSERS.has(k)?`<a href="#" class="tag green" onclick="SEL='${esc(k)}';go('users');return false">${esc(u.name)}様</a>`:'';}).join('')}</div><div style="white-space:pre-wrap;font-size:13.5px;margin-top:3px">${hl(m.text)}</div></div>`;}).join('');
}
function hl(t){let s=esc(t);for(const k of S.settings.keywords){if(!k)continue;s=s.split(esc(k)).join(`<mark style="background:var(--red-soft);color:var(--red)">${esc(k)}</mark>`);}return s;}

function staleBanner(){
  const im=S.meta.imports,out=[];
  const chk=(k,l)=>{const x=im[k];if(!x)out.push(`${l}：未取り込み`);else if((Date.now()-Date.parse(x.at))>36*3600e3)out.push(`${l}：${new Date(x.at).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}（古くなっています）`);};
  chk('users','利用者一覧');chk('houkai','訪介シフト');chk('houkan','訪看予定');
  return out.length?`<div class="warn">最終取り込みを確認してください　${out.map(esc).join('　／　')}</div>`:`<div class="ok">利用者一覧・訪介シフト・訪看予定は最新です</div>`;
}

    ...photosOf(u).map(p=>({at:p.at.slice(0,10)+' '+p.at.slice(11,16),html:`<span class="tag blue">写真</span> ${esc(p.type)}${p.by?` <span class="note">${esc(p.by)}</span>`:''}`}))].sort((a,b)=>b.at.localeCompare(a.at)).slice(0,60);

  <div class="row" style="margin-top:8px"><button class="btn sub" onclick="go('camera',{camUser:'${esc(u.key)}'})">この方の写真を撮る</button></div></div></div></div>
  <div class="card"><h2>基本情報</h2><dl class="kv">
  <dt>生年月日</dt><dd>${u.birth?`${u.birth.replace(/-/g,'/')}（${ageOn(u.birth,TODAY)}歳）`:'—'}</dd><dt>性別</dt><dd>${esc(u.sex)||'—'}</dd>
  <dt>要介護度</dt><dd>${esc(u.kaigodo)||'—'} ${u.ninteiStatus==='申請中'?'<span class="tag amber">申請中</span>':''}</dd><dt>認定有効期限</dt><dd>${ex(u.ninteiEnd)}</dd>
  <dt>保険者</dt><dd>${esc(u.hokensha)||'—'}</dd><dt>医療保険</dt><dd>${esc(u.iryoType)||'—'}　${u.iryoEnd?'適用期間 '+ex(u.iryoEnd):''}</dd>
  ${isMgr()?`<dt>住所</dt><dd>${u.address?`${esc(u.address)}　<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(u.address)}" target="_blank" rel="noopener">地図</a>`:'—'}</dd>`:''}<dt>担当ケアマネ</dt><dd>${esc(u.careMgr)||'—'}　<span class="note">${esc(u.kyotaku)}</span></dd><dt>地域包括</dt><dd>${esc(u.houkatsu)||'—'}</dd>
  <dt>障害 負担上限</dt><dd>${u.jogen!=null?u.jogen.toLocaleString()+'円':'—'}</dd>

  <div class="card"><h2>今後の予定</h2>${vs.length?`<table><tr><th>日付</th><th>時間</th><th>種別</th><th>担当</th><th>内容</th></tr>${vs.map(v=>`<tr><td>${md(v.date)}</td><td>${v.start}〜${v.end}</td><td><span class="tag ${v.src==='訪看'?'blue':'green'}">${v.src}</span></td><td>${esc(v.staff)}</td><td class="note">${esc(v.service)}</td></tr>`).join('')}</table>`:'<p class="note">取り込んだ予定の中に、今日以降の訪問はありません。</p>'}</div>
  <div class="card"><h2>履歴 <span class="note">LINEの連絡・写真</span></h2>${hist.length?hist.map(h=>`<div style="padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px"><span class="note">${h.at.slice(5,10).replace('-','/')} ${h.at.slice(11)}</span>　${h.html}</div>`).join(''):'<p class="note">まだ履歴はありません。</p>'}</div>
  <div class="card"><h2>写真</h2>${photoGrid(photosOf(u))}</div>`;

function photoGrid(list){
  if(!list.length) return '<p class="note">まだ写真はありません。</p>';
  return `<div class="photos">${list.map(p=>`<div class="photo">${photoImg(p,'',true)}<b style="color:var(--ink)">${esc(p.type)}</b><br>${new Date(p.at).toLocaleString('ja-JP',{year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}${p.by?'<br>'+esc(p.by):''}<br><a href="#" onclick="dlPhoto('${p.id}');return false">保存</a>${isOffice()?`　<a href="#" onclick="delPhoto('${p.id}');return false" style="color:var(--red)">削除</a>`:''}</div>`).join('')}</div>`;
}
const PHOTO_CACHE={};const PHOTO_WAIT=new Set();
const BLANK='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10"><rect width="10" height="10" fill="#eef2f6"/></svg>');
function photoImg(p,style,zoomable){if(!PHOTO_CACHE[p.id])PHOTO_WAIT.add(p.id);return `<img data-pid="${p.id}" src="${PHOTO_CACHE[p.id]||BLANK}" style="${style||''}" ${zoomable||style.includes('zoom')?`onclick="zoom('${p.id}')"`:''} alt="">`;}
async function loadPhotos(){const ids=[...PHOTO_WAIT];PHOTO_WAIT.clear();for(const id of ids){if(PHOTO_CACHE[id])continue;try{PHOTO_CACHE[id]=await api('getPhoto',{id},true);document.querySelectorAll(`img[data-pid="${id}"]`).forEach(im=>im.src=PHOTO_CACHE[id]);}catch(e){}}}
async function getPhotoData(id){if(!PHOTO_CACHE[id])PHOTO_CACHE[id]=await api('getPhoto',{id});return PHOTO_CACHE[id];}
async function zoom(id){try{$('#zoomimg').src=await getPhotoData(id);$('#zoom').style.display='flex';}catch(e){alert(e.message);}}
async function dlPhoto(id){const p=PHOTOS.find(x=>x.id===id);try{const d=await getPhotoData(id);const a=document.createElement('a');a.href=d;a.download=`${p.userName}_${p.type}_${p.at.slice(0,10)}.jpg`;document.body.appendChild(a);a.click();a.remove();}catch(e){alert(e.message);}}
async function delPhoto(id){if(!confirm('この写真を削除しますか？（ドライブのゴミ箱に移り、30日間は元に戻せます）'))return;try{await api('deletePhoto',{id});}catch(e){alert(e.message);return;}PHOTOS=PHOTOS.filter(p=>p.id!==id);render();}

  <div class="card"><h2>上限管理票（障害の負担上限がある方）</h2><p class="note">今月の最終訪問日を担当する職員に撮影を依頼します。</p>

function vReq(){
  const rq=requests();const by=new Map();const none=[];
  for(const r of rq){if(!r.v){none.push(r);continue;}if(!by.has(r.v.staff))by.set(r.v.staff,[]);by.get(r.v.staff).push(r);}
  const blocks=[...by.entries()].sort((a,b)=>a[0].localeCompare(b[0],'ja')).map(([st,list])=>{
    list.sort((a,b)=>(a.v.date+a.v.start).localeCompare(b.v.date+b.v.start));
    const text=`【撮影のお願い】\n${list.map(r=>`${md(r.v.date)} ${r.v.start} ${r.u.name} 様：${r.what}`).join('\n')}\n訪問の際に撮影し、ポータルの「撮影」から利用者を選んで保存してください。`;
    return `<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(st)}　<span class="note">${list.length}件</span></h2><button class="btn sub" onclick="copyText(this)">文面をコピー</button></div><div class="msg" style="margin-top:8px">${esc(text)}</div><p class="note">${list.map(r=>`${esc(r.u.name)}：${esc(r.why)}`).join('　／　')}</p></div>`;}).join('');
  return `<div class="card"><h2>撮影依頼（訪問予定の職員あて）</h2><div class="note">各職員のトップ画面の「やること」にも自動で出ています。LINE WORKSにつながったら、ここから本人に届くようにします。</div>
  <label class="row note" style="margin-top:8px"><input type="checkbox" ${S.settings.faceRequest?'checked':''} onchange="S.settings.faceRequest=this.checked;save('settings');render()"> 顔写真（基本情報）が未登録で、2週間以内に訪問がある方も依頼に入れる</label></div>
  ${blocks||'<div class="card note">いま依頼が必要なものはありません。</div>'}
  ${none.length?`<div class="card"><h2>訪問予定がなく、事務で対応が必要</h2><table><tr><th>利用者</th><th>撮るもの</th><th>理由</th></tr>${none.map(r=>`<tr><td>${esc(r.u.name)}</td><td>${esc(r.what)}</td><td>${esc(r.why)}</td></tr>`).join('')}</table></div>`:''}`;
}
function copyText(btn){const t=btn.closest('.card').querySelector('.msg').textContent;navigator.clipboard.writeText(t).then(()=>{btn.textContent='コピーしました';setTimeout(()=>btn.textContent='文面をコピー',1500);});}

function vSched(){
  if(!isOffice()){
    const end=iso(new Date(TODAY.getTime()+6*864e5));
    const vs=S.visits.filter(v=>isMe(v.staff)&&!v.oncall&&v.date>=TODAY_ISO&&v.date<=end).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
    return `<div class="card"><h2>自分の予定（今日から1週間）</h2>${vs.length?`<table><tr><th>日付</th><th>時間</th><th>利用者</th><th>内容</th></tr>${vs.map(v=>{const u=IDX.byName.get(normName(v.user));return `<tr><td>${md(v.date)}</td><td>${v.start}〜${v.end}</td><td>${v.other?'<span class="note">（利用者以外）</span>':u?`<a href="#" onclick="SEL='${esc(u.key)}';go('users');return false">${esc(v.user)} 様</a>`:esc(v.user)}</td><td class="note">${esc(v.service)}</td></tr>`;}).join('')}</table>`:'<p class="note">この1週間の予定はありません。</p>'}</div>`;
  }

  return `<div class="card"><div class="row"><h2 style="margin:0">日別の予定</h2><input type="date" value="${STATE.date}" onchange="STATE.date=this.value;render()"><span class="note">${vs.filter(v=>!v.other).length}件の訪問</span></div></div>

}
function vFree(){
  const s=toMin(S.settings.workStart),e=toMin(S.settings.workEnd),span=e-s;
  const hours=[];for(let h=Math.ceil(s/60);h<=Math.floor(e/60);h++)hours.push(h);
  const rows=IDX.staffNames.map(st=>{const b=busyOf(st,STATE.date);const fr=freeSlots(st,STATE.date);const src=[...new Set(S.visits.filter(v=>v.staff===st).map(v=>v.src))].join('・');

}

const isTaxi=v=>/タクシー/.test(v.service||'');
function vTaxi(){
  const drv=S.settings.taxiDriver||'内田 伸也';const s=toMin(S.settings.workStart),e=toMin(S.settings.workEnd),span=e-s;
  const hours=[];for(let h=Math.ceil(s/60);h<=Math.floor(e/60);h++)hours.push(h);
  const start=new Date(STATE.date+'T00:00');const days=[...Array(7)].map((_,i)=>iso(new Date(start.getTime()+i*864e5)));
  const has=S.visits.some(v=>isMe2(v.staff,drv));
  const rows=days.map(d=>{const b=busyOf2(drv,d);const fr=freeSlots2(drv,d);
    return `<tr><td style="width:110px"><b>${md(d)}</b></td><td><div class="tl">${b.map(v=>{const a=Math.max(toMin(v.start),s),z=Math.min(toMin(v.end),e);if(z<=a)return'';return `<div class="busy" title="${esc(v.start+'〜'+v.end+' '+v.user+' '+v.service)}" style="left:${(a-s)/span*100}%;width:${(z-a)/span*100}%;background:${isTaxi(v)?'#b45309':'#0f766e'}"></div>`;}).join('')}</div></td><td style="width:230px" class="note">${fr.length?fr.map(x=>`<span class="tag green">${fromMin(x[0])}〜${fromMin(x[1])}</span>`).join(''):'<span class="tag red">空きなし</span>'}</td></tr>`;}).join('');
  const bookings=S.visits.filter(v=>isMe2(v.staff,drv)&&isTaxi(v)&&v.date>=days[0]&&v.date<=days[6]).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
  return `<div class="card"><div class="row"><h2 style="margin:0">介護タクシーの空き（${esc(drv)}）</h2><input type="date" value="${STATE.date}" onchange="STATE.date=this.value;render()"><span class="note">選んだ日から1週間。<span style="color:#b45309">■</span>介護タクシー　<span style="color:#0f766e">■</span>訪問介護など　緑の枠が空き（30分以上・${S.settings.workStart}〜${S.settings.workEnd}）</span></div>
  ${has?'':'<p class="warn" style="margin-top:10px">訪介シフトの中に、この運転手の予定が見つかりません。訪介シフトCSVを取り込むか、設定で運転手を確認してください。</p>'}</div>
  <div class="card"><table><tr><th>日付</th><th><div class="tlhead">${hours.map(h=>`<span style="left:${(h*60-s)/span*100}%">${h}</span>`).join('')}</div></th><th>空き</th></tr>${rows}</table></div>
  <div class="card"><h2>この1週間の介護タクシー予約（${bookings.length}件）</h2>${bookings.length?`<table><tr><th>日付</th><th>時間</th><th>利用者</th><th>内容</th><th>備考</th></tr>${bookings.map(v=>`<tr><td>${md(v.date)}</td><td>${v.start}〜${v.end}</td><td>${esc(v.user)} 様</td><td class="note">${esc(v.service)}</td><td class="note">${esc(v.note||'')}</td></tr>`).join('')}</table>`:'<p class="note">予約はありません。</p>'}</div>`;
}
const isMe2=(a,b)=>normName(a)===normName(b);
function busyOf2(name,date){return S.visits.filter(v=>isMe2(v.staff,name)&&v.date===date&&!v.oncall).sort((a,b)=>a.start.localeCompare(b.start));}
function freeSlots2(name,date){const s=toMin(S.settings.workStart),e=toMin(S.settings.workEnd);let cur=s;const out=[];for(const b of busyOf2(name,date)){const a=toMin(b.start),z=toMin(b.end);if(a>cur&&a-cur>=30)out.push([cur,Math.min(a,e)]);cur=Math.max(cur,z);}if(e-cur>=30)out.push([cur,e]);return out.filter(x=>x[1]>x[0]);}

function selUserKey(){const v=$('#camUserIn')&&$('#camUserIn').value;const u=visibleUsers().find(x=>x.name===v)||IDX.byName.get(normName(v));return u&&MYUSERS.has(u.key)?u.key:'';}
let PENDING=null;
function bindCamera(){
  const cam=$('#cam');
  $('#camUserIn').onchange=()=>{STATE.camUser=selUserKey();render();};
  $('#camBtn').onclick=()=>{STATE.camUser=selUserKey();if(!STATE.camUser){$('#camMsg').textContent='先に利用者を選んでください';return;}cam.value='';cam.click();};
  cam.onchange=async()=>{const f=cam.files[0];if(!f)return;PENDING=await shrink(f);$('#preview').src=PENDING;$('#preview').style.display='block';$('#saveRow').classList.remove('hide');};
  $('#retakeBtn').onclick=()=>{cam.value='';cam.click();};
  $('#saveBtn').onclick=async()=>{const u=IDX.userByKey.get(STATE.camUser);if(!u||!PENDING)return;$('#saveBtn').disabled=true;let p;try{p=await api('uploadPhoto',{userKey:u.key,type:STATE.camType,data:PENDING});}catch(e){$('#saveBtn').disabled=false;alert('保存できませんでした：'+e.message);return;}PHOTO_CACHE[p.id]=PENDING;PHOTOS.push(p);PENDING=null;render();$('#camMsg').textContent=`${u.name} 様の「${p.type}」を保存しました`;};
}
function shrink(file){return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{const max=1600,r=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.85));};img.onerror=rej;img.src=url;});}

(async()=>{
  const p=new URLSearchParams(location.search);if(p.get('tab'))TAB=p.get('tab');if(p.get('u'))STATE.camUser=p.get('u');if(p.get('t')&&PHOTO_TYPES.includes(p.get('t')))STATE.camType=p.get('t');
  if(API()&&API()!=='__API_URL__'){
    if(TOKEN){try{await loadAll();if(!ME.passSet)TAB='setpass';}catch(e){ME=null;}}
    if(!ME){try{SETUP=await api('setupStatus');}catch(e){$('#main').innerHTML=`<div class="warn">${esc(e.message)}</div>`;return;}}
  }
  render();
})();
</script>
