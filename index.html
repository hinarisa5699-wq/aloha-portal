<style>
:root{--bg:#eef9f7;--card:#fff;--ink:#1f2d3a;--sub:#5b6b78;--line:#c9e7e3;--accent:#0b8a94;--accent-soft:#dff4f2;--red:#c0264f;--red-soft:#fde8ee;--amber:#9a6a00;--amber-soft:#fff3d6;--blue:#1d4ed8;--blue-soft:#e6efff;--pink:#ec6f93;--pink-soft:#fde9ef;--sun:#f7b733;--frame:#7cc9c1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Yu Gothic UI","Hiragino Sans",Meiryo,sans-serif;font-size:14px}
header{background:var(--accent);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;font-weight:700}
header .today{font-size:13px;opacity:.85}
nav{background:#fff;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;position:sticky;top:0;z-index:5}
nav button{border:0;background:none;padding:12px 14px;font-size:14px;color:var(--sub);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;font-family:inherit}
nav button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px}
.note{color:var(--sub);font-size:12.5px;line-height:1.6}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer}
.stat b{display:block;font-size:24px;margin-top:4px}
.stat.red b{color:var(--red)}.stat.amber b{color:var(--amber)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
th{background:#f9fafb;color:var(--sub);font-weight:600;position:sticky;top:44px}
.tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:999px;background:#f1f5f9;color:#334155;margin:1px 2px 1px 0}
.tag.red{background:var(--red-soft);color:var(--red)}.tag.amber{background:var(--amber-soft);color:var(--amber)}.tag.green{background:var(--accent-soft);color:var(--accent)}.tag.blue{background:var(--blue-soft);color:var(--blue)}
button.btn,label.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer;font-family:inherit;display:inline-block}
button.btn.sub,label.btn.sub{background:#fff;color:var(--accent)}
button.btn.danger{background:#fff;color:var(--red);border-color:var(--red)}
input,select,textarea{font-family:inherit;font-size:14px;padding:7px 9px;border:1px solid #cbd5e1;border-radius:8px;background:#fff}
.drop{border:2px dashed #94a3b8;border-radius:12px;padding:28px;text-align:center;color:var(--sub);background:#fafafa;cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.list-user{cursor:pointer}.list-user:hover{background:#f8fafc}
.split{display:grid;grid-template-columns:320px 1fr;gap:14px}
@media(max-width:800px){.split{grid-template-columns:1fr}th{top:0}}
.ulist{max-height:70vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
.ulist div{padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.ulist div.on{background:var(--accent-soft)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:4px 10px;font-size:13.5px}
.kv dt{color:var(--sub)}.kv dd{margin:0}
.photos{display:flex;flex-wrap:wrap;gap:10px}
.photo{width:150px;font-size:12px;color:var(--sub)}
.photo img{width:150px;height:110px;object-fit:cover;object-position:center top;border-radius:8px;border:1px solid var(--line);display:block;cursor:zoom-in}
.tl{position:relative;height:26px;background:#f1f5f9;border-radius:6px;overflow:hidden}
.tl .busy{position:absolute;top:0;bottom:0;background:#0f766e;opacity:.85;border-right:1px solid #fff}
.tl .busy.other{background:#64748b}
.tl .offh{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,#e2e8f0 0 4px,#f8fafc 4px 8px)}
.freeview .tl .busy{background:#2563eb;opacity:.9}
.freeview .tl .busy.other{background:#64748b}
.tl .free{position:absolute;top:2px;bottom:2px;background:#ef4444;opacity:.9;border-radius:4px}
.tl .brk{position:absolute;top:2px;bottom:2px;background:#f59e0b;opacity:.9;border-radius:4px}
.freesum{color:#dc2626;font-weight:bold;font-size:14px}
.tlhead{position:relative;height:16px;font-size:10.5px;color:var(--sub)}
.tlhead span{position:absolute;transform:translateX(-50%)}
.msg{white-space:pre-wrap;background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px}
.warn{background:var(--red-soft);color:var(--red);border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:13px}
.ok{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:13px}
.typebtns{display:flex;flex-wrap:wrap;gap:8px}
.typebtns button{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:10px 12px;font-size:14px;font-family:inherit;cursor:pointer}
.typebtns button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#preview{max-width:100%;max-height:50vh;border-radius:10px;margin-top:10px;display:none}
.camwrap{position:relative;margin-top:12px;background:#000;border-radius:12px;overflow:hidden;max-width:720px}
.camwrap video{display:block;width:100%;max-height:65vh;object-fit:contain;background:#000}
.camguide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.camguide i{display:block;border:3px dashed rgba(255,255,255,.85);box-shadow:0 0 0 2000px rgba(0,0,0,.25)}
.camview{position:relative}
.camguide i.g-card{width:80%;max-height:84%;aspect-ratio:1.58;border-radius:12px}
.camguide i.g-paper{height:86%;max-width:90%;aspect-ratio:.71;border-radius:6px}
.camguide i.g-face{height:78%;max-width:80%;aspect-ratio:.8;border-radius:50%}
.camguide span{position:absolute;top:8px;left:50%;transform:translateX(-50%);max-width:92%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;color:#fff;font-size:12px;background:rgba(0,0,0,.55);padding:4px 10px;border-radius:8px}
.cambar{display:flex;align-items:center;justify-content:center;gap:28px;padding:12px;background:#111}
.shutter{width:72px;height:72px;border-radius:50%;border:5px solid #fff;background:#fff;box-shadow:inset 0 0 0 4px #111;cursor:pointer}
.shutter:active{transform:scale(.94)}
.cambar .cbtn{background:none;border:1px solid #666;color:#fff;border-radius:8px;padding:8px 12px;font-size:14px;font-family:inherit;cursor:pointer}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:20}
.zoom img{max-width:95vw;max-height:92vh}
.hide{display:none}
@media print{header,nav,.noprint{display:none!important}.card{border:0}th{position:static}}
#cardPrint{display:none}
@page tate{size:100mm 148mm;margin:0}
@page yoko{size:148mm 100mm;margin:0}
@media print{body.pcards>*:not(#cardPrint){display:none!important}body.pcards #cardPrint{display:block}
#cardPrint .pg{break-after:page;display:flex;align-items:center;justify-content:center;overflow:hidden}
#cardPrint .pg.tate{page:tate;width:100mm;height:148mm}#cardPrint .pg.yoko{page:yoko;width:148mm;height:100mm}
#cardPrint .pg img{width:100%;height:100%;object-fit:contain}}
@media print{body.pphoto>*:not(#cardPrint){display:none!important}body.pphoto #cardPrint{display:block}#cardPrint .pp{break-after:page;text-align:center}#cardPrint .pp img{max-width:100%;max-height:260mm;object-fit:contain}#cardPrint .pp p{font-size:10pt;margin:0 0 4mm;text-align:left}}
#printGo{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:9999}#printGo div{background:#fff;border-radius:16px;padding:22px;text-align:center;max-width:320px}
.cardedit{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px;align-items:start}
@media(max-width:760px){.cardedit{grid-template-columns:1fr}}
#cardCv{width:100%;height:auto;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.15);touch-action:none;cursor:grab;background:#D9E2F3}
.seg{display:inline-flex;border:1px solid var(--accent);border-radius:8px;overflow:hidden}.seg button{border:0;background:#fff;color:var(--accent);padding:8px 16px;font-size:14px;font-family:inherit;cursor:pointer}.seg button.on{background:var(--accent);color:#fff}

/* ===== アロハ調（パステル＋枠をはっきり） ===== */
body{background:linear-gradient(180deg,#e6f7f4 0%,#f3fbf9 35%,#fff8ec 100%) fixed;font-size:14.5px}
header{background:linear-gradient(100deg,#0b8a94 0%,#22b3b0 55%,#5fc9b8 100%);padding:12px 18px;box-shadow:0 2px 8px rgba(11,138,148,.25)}
header h1::before{content:"🌺 ";}
header h1{letter-spacing:.04em}
nav{background:#fffdf7;border-bottom:2px solid var(--frame);padding:6px 8px;gap:6px}
nav button{border:2px solid transparent;border-radius:999px;padding:8px 14px;color:#2f5f63;font-weight:600}
nav button:hover{background:var(--accent-soft)}
nav button.on{background:var(--accent);color:#fff;border-color:var(--accent);border-bottom-color:var(--accent)}
.card{border:2px solid var(--frame);border-radius:16px;box-shadow:0 3px 10px rgba(11,138,148,.08);padding:16px 18px}
.card h2{font-size:16px;color:#0a5f66;border-left:6px solid var(--pink);padding-left:10px;line-height:1.4}
.stat{border:2px solid var(--frame);border-radius:16px;background:#fff;box-shadow:0 3px 8px rgba(11,138,148,.08)}
.stat:nth-child(6n+1){background:#fff1f5}.stat:nth-child(6n+2){background:#fff8e1}.stat:nth-child(6n+3){background:#e8f7f5}
.stat:nth-child(6n+4){background:#eef4ff}.stat:nth-child(6n+5){background:#f6efff}.stat:nth-child(6n+6){background:#effaea}
.stat:hover{transform:translateY(-1px);box-shadow:0 5px 12px rgba(11,138,148,.15)}
th{background:#e3f5f2;color:#2f5f63;border-bottom:2px solid var(--frame)}
th,td{border-bottom:1px solid #d5ece9}
input,select,textarea{border:2px solid var(--frame);border-radius:10px;background:#fffef8;padding:8px 10px;font-size:15px;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pink);box-shadow:0 0 0 3px rgba(236,111,147,.2);background:#fff}
input::placeholder,textarea::placeholder{color:#8aa3a8}
input[type=checkbox],input[type=radio]{width:20px;height:20px;accent-color:var(--accent);padding:0;vertical-align:middle;cursor:pointer;flex:none}
input[type=file]{background:#fff;border-style:dashed}
button.btn,label.btn{border:2px solid var(--accent);background:var(--accent);border-radius:999px;padding:8px 18px;font-weight:700;box-shadow:0 2px 0 #06646c}
button.btn:hover,label.btn:hover{filter:brightness(1.07)}
button.btn:active,label.btn:active{transform:translateY(1px);box-shadow:none}
button.btn.sub,label.btn.sub{background:#fff;color:var(--accent);box-shadow:0 2px 0 #b6e0db}
button.btn.danger{border-color:var(--red);color:var(--red);box-shadow:0 2px 0 #f3c3d0}
button:disabled{opacity:.5;cursor:default}
.tag{border:1px solid #cfe3e6;background:#f2f8f9}
.tag.red{border-color:#f5c2d0}.tag.amber{border-color:#f5dc9c}.tag.green{border-color:#a9dcd6}.tag.blue{border-color:#bcd0fb}
.drop{border:3px dashed var(--frame);background:#f4fbfa;border-radius:16px;color:#2f5f63;font-weight:600}
.drop:hover{background:var(--accent-soft)}
.drop.over{border-color:var(--pink);background:var(--pink-soft)}
.ulist{border:2px solid var(--frame);border-radius:12px;background:#fff}
.ulist div.on{background:var(--accent-soft);border-left:5px solid var(--pink)}
.list-user:hover,.ulist div:hover{background:#f4fbfa}
.tl{background:#eef3f5;border:1px solid #d5e3e6}
.msg{background:#fffdf6;border:2px solid #f1e3c4}
.warn{border:2px solid #f5c2d0}.ok{border:2px solid #a9dcd6}
.typebtns button{border:2px solid var(--frame);border-radius:12px}
.seg{border-width:2px;border-radius:999px}
details summary{cursor:pointer}
@media print{body{background:#fff}.card{box-shadow:none}header h1::before{content:""}}
</style>

<body>
<header><h1>アロハ業務ポータル <span style="font-weight:400;font-size:12px;opacity:.8"></span></h1><span class="today" id="today"></span></header>
<nav id="nav"></nav>
<main id="main"></main>
<div class="zoom" id="zoom" onclick="this.style.display='none'"><img id="zoomimg" alt=""></div>
<input type="file" id="cam" accept="image/*" capture="environment" class="hide">
<script>
// ===== 基本 =====
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const TODAY=new Date();TODAY.setHours(0,0,0,0);const TODAY_ISO=iso(TODAY);
const WD='日月火水木金土';
const md=s=>{if(!s)return'';const d=new Date(s+'T00:00');return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`};
const mdy=s=>{if(!s)return'';return (s.slice(0,4)==String(TODAY.getFullYear())?'':s.slice(0,4)+'/')+md(s)};
const daysTo=s=>Math.round((new Date(s+'T00:00')-TODAY)/864e5);
const normName=s=>String(s||'').replace(/[\s　★☆＊*]/g,'').replace(/様$/,'').replace(/髙/g,'高').replace(/﨑/g,'崎').replace(/德/g,'徳').replace(/濵/g,'浜');
const PHOTO_TYPES=['介護保険証','負担割合証','医療保険証','受給者証','上限管理票','顔写真（基本情報）','顔写真（誕生日）','その他'];
// 和暦・西暦の日付を YYYY-MM-DD に
function toISODate(s){
  s=String(s||'').trim(); if(!s||s==='-') return '';
  let m=s.match(/(\d{4})[-\/年](\d{1,2})[-\/月](\d{1,2})/); if(m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  m=s.match(/(令和|平成|昭和)(\d+|元)年(\d{1,2})月(\d{1,2})日/);
  if(m){const base={令和:2018,平成:1988,昭和:1925}[m[1]];const y=base+(m[2]==='元'?1:+m[2]);return `${y}-${pad(m[3])}-${pad(m[4])}`;}
  return '';
}
function ageOn(birth,on){if(!birth)return null;const b=new Date(birth+'T00:00');let a=on.getFullYear()-b.getFullYear();if(on.getMonth()<b.getMonth()||(on.getMonth()===b.getMonth()&&on.getDate()<b.getDate()))a--;return a;}

// ===== 保存サーバー（GAS）とのやりとり =====
// 画面を何度作り直しても、データと写真はサーバー（スプレッドシート・ドライブ）に残ります
const DEFAULT_API='https://script.google.com/macros/s/AKfycbzqLpjhu6GyK_JWsHLI6E_8xlMF8bQLFUbxm3FXe0pvwFozTq2wteiPWkh7vMGPyZNO/exec';
const API=()=>{const q=new URLSearchParams(location.search).get('api');if(q){try{localStorage.setItem('portalApi',q);}catch(e){}}let v='';try{v=localStorage.getItem('portalApi')||'';}catch(e){}return v||DEFAULT_API;};
let TOKEN='';try{TOKEN=localStorage.getItem('portalToken')||'';}catch(e){}
function busy(msg){let b=$('#busy');if(!b){b=document.createElement('div');b.id='busy';b.style.cssText='position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:30;display:none';document.body.appendChild(b);}b.textContent=msg||'';b.style.display=msg?'block':'none';}
async function api(action,params={},quiet){
  if(!quiet)busy(action==='getPhoto'?'':'通信中…');
  try{
    let lastErr;
    for(let i=0;i<3;i++){
      let r;try{r=await fetch(API(),{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(Object.assign({action,token:TOKEN},params))});}catch(e){lastErr=new Error('サーバーにつながりませんでした（ネット接続を確認してください）');await new Promise(r=>setTimeout(r,1500));continue;}
      const t=await r.text();let j;try{j=JSON.parse(t);}catch(e){lastErr=new Error('サーバーの応答が読めませんでした');await new Promise(r=>setTimeout(r,1500));continue;}
      if(!j.ok){if(/ログインしてください|期限が切れ/.test(j.error||'')&&!['login','setupStatus','initStaff'].includes(action)){TOKEN='';try{localStorage.removeItem('portalToken');}catch(e){}cacheClear();ME=null;}throw new Error(j.error||'エラー');}
      return j.data;
    }
    throw lastErr;
  }finally{if(!quiet)busy('');}
}
// 変更したデータだけをサーバーへ保存
async function save(...keys){
  if(!keys.length) return;
  const sets={};keys.forEach(k=>sets[k]=k==='staff'?S.staffList:S[k]);
  try{await api('save',{sets});}catch(e){alert('保存できませんでした：'+e.message);throw e;}
}
const DIRTY=new Set();
async function flush(){const k=[...DIRTY];DIRTY.clear();await save(...k);}
const DEFAULT_KW=['至急','緊急','必ず','事故','転倒','救急','入院','死亡','亡くな','中止','キャンセル','変更','感染','発熱','コロナ','インフル','ヒヤリ','苦情','重要'];
let S={users:[],visits:[],staffList:[],notices:[],tasks:[],line:[],meta:{imports:{}},settings:{alertDays:60,workStart:'08:30',workEnd:'17:30',faceRequest:false,keywords:DEFAULT_KW.slice(),taxiDriver:'内田 伸也'}};
let PHOTOS=[];let CLAIMS={};

// ===== 取り込み =====
function decode(buf){try{return new TextDecoder('utf-8',{fatal:true}).decode(buf).replace(/^﻿/,'');}catch(e){return new TextDecoder('shift_jis').decode(buf);}}
function parseCSV(t){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}else if(c==='"')q=true;else if(c===','){row.push(f);f='';}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f='';}else f+=c;}if(f!==''||row.length){row.push(f);rows.push(row);}return rows.filter(r=>r.some(x=>x.trim()!==''));}
function objs(rows){const h=rows[0].map(x=>x.replace(/^﻿/,'').trim());return rows.slice(1).map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]||'').trim()])));}

async function importFiles(files){
  const log=[];
  for(const f of files){
    try{
      const buf=await f.arrayBuffer();
      if(/\.pdf$/i.test(f.name)){log.push(await importHoukanPDF(buf,f.name));continue;}
      if(/\.txt$/i.test(f.name)){log.push(importLine(decode(buf),f.name));continue;}
      const rows=parseCSV(decode(buf)); if(!rows.length){log.push(`${f.name}：中身がありません`);continue;}
      const h=rows[0].join(',');
      if(/1日労働時間/.test(h)&&/(^|,)月(,|$)/.test(h)) log.push(importKot(objs(rows),f.name));
      else if(/町名以下|利用者生年月日/.test(h)) log.push(importUserInfo(objs(rows),f.name));
      else if(/利用者カナ/.test(h)) log.push(importUsers(objs(rows),f.name));
      else if(/ヘルパー名/.test(h)&&/開始時間/.test(h)) log.push(importHoukai(objs(rows),f.name));
      else if(/(^|,)code(,|$)/.test(h)&&/(^|,)name(,|$)/.test(h)) log.push(importStaff(objs(rows).map(r=>({id:r.code,name:r.name,birth:r.birthDate,cls:r.classification})),f.name));
      else if(/(氏名|職員名|名前)/.test(h)&&/生年月日/.test(h)) log.push(importStaff(objs(rows).map(r=>({id:r['ID']||r['番号']||r['コード']||'',name:r['氏名']||r['職員名']||r['名前'],birth:r['生年月日'],cls:r['区分']||r['雇用形態']||''})),f.name));
      else log.push(`${f.name}：どの種類のファイルか判断できませんでした`);

// 日本の祝日（振替休日・国民の休日を含む）
function jpHoliday(d){
  const y=+d.slice(0,4),m=+d.slice(5,7),day=+d.slice(8,10);
  const base=(Y,M,D)=>{const dt=new Date(Y,M-1,D);const w=dt.getDay();const nth=Math.ceil(D/7);
    const fixed={'1-1':1,'2-11':1,'2-23':1,'4-29':1,'5-3':1,'5-4':1,'5-5':1,'8-11':1,'11-3':1,'11-23':1};
    if(fixed[M+'-'+D])return true;
    if(w===1&&((M===1&&nth===2)||(M===7&&nth===3)||(M===9&&nth===3)||(M===10&&nth===2)))return true;
    if(M===3&&D===Math.floor(20.8431+0.242194*(Y-1980)-Math.floor((Y-1980)/4)))return true;
    if(M===9&&D===Math.floor(23.2488+0.242194*(Y-1980)-Math.floor((Y-1980)/4)))return true;
    return false;};
  if(base(y,m,day))return true;
  const dt=new Date(y,m-1,day);
  // 振替休日：祝日が日曜なら、その後の最初の祝日でない日
  if(dt.getDay()!==0){let k=new Date(dt);for(;;){k=new Date(k.getTime()-864e5);if(!base(k.getFullYear(),k.getMonth()+1,k.getDate()))break;if(k.getDay()===0)return true;}}
  // 国民の休日：前後が祝日の平日
  const pv=new Date(dt.getTime()-864e5),nx=new Date(dt.getTime()+864e5);
  if(dt.getDay()!==0&&base(pv.getFullYear(),pv.getMonth()+1,pv.getDate())&&base(nx.getFullYear(),nx.getMonth()+1,nx.getDate()))return true;
  return false;
}
// その職員のその日の勤務時間：{off:'休み'等} か {s,e（分）,kot:true/false}
function workHours(name,date){
  const ds=toMin(S.settings.workStart||'08:30'),de=toMin(S.settings.workEnd||'17:30');
  // カイポケ・ナースの予定に「公休」などが入っている日は休み
  const mine=S.visits.filter(v=>normName(v.staff)===normName(name)&&v.date===date);
  const offV=mine.find(v=>isOffSvc(v));if(offV)return {off:String(offV.service).trim().slice(0,6)};
  const working=mine.some(v=>!v.oncall);
  const k=(S.settings.kot||{})[normName(name)];
  if(!k){if(!working&&(new Date(date+'T00:00').getDay()===0||jpHoliday(date)))return {off:'予定なし'};return {s:ds,e:de,kot:false};}
  const lv=k.leave.find(x=>date>=x[0]&&date<=x[1]);if(lv)return {off:lv[2]||'休業'};
  let c=k.wk[(new Date(date+'T00:00').getDay()+6)%7];
  if(jpHoliday(date)&&k.hol)c=k.hol;
  if(c==='off')return {off:jpHoliday(date)?'祝日休み':'休み'};
  if(!c){if(!working)return {off:'勤務予定なし'};return {s:ds,e:de,kot:true,guess:true};}
  return {s:toMin(c[0]),e:toMin(c[1]),kot:true};
}

function importLine(text,name){

    cur.id=hashStr(cur.date+cur.time+cur.from+cur.text);if(!have.has(cur.id)){have.add(cur.id);out.push(cur);add++;}cur=null;};
  for(const ln of lines){

}

const isOffSvc=v=>/^\s*(公休|休み|休日|有休|有給|希望休|代休|特休)/.test(v.service||'');

const toMin=t=>{const [h,m]=t.split(':').map(Number);return h*60+m;};
const fromMin=n=>`${Math.floor(n/60)}:${pad(n%60)}`;
// 勤務時間内の「予定が入っていない時間」から、お昼休憩1時間を除いて、30分以上の空きを返す
// 休憩：基本 12:30〜13:30。取れなければ昼ごろの取れるところで1時間、それも無理なら30分＋30分
function lunchBreak(gaps,w){
  if(w.e-w.s<360)return [];
  const L0=toMin(S.settings.lunchStart||'12:30'),L1=L0+60,mid=L0+30;
  if(gaps.some(g=>g[0]<=L0&&g[1]>=L1))return [[L0,L1]];
  const near=(a,b)=>Math.abs((a+b)/2-mid);
  const pick=(len,win)=>{let best=null;for(const g of gaps){const a=Math.max(g[0],win[0]),z=Math.min(g[1],win[1]);if(z-a<len)continue;const st=Math.min(Math.max(a,mid-len/2),z-len);const c=[st,st+len];if(!best||near(...c)<near(...best))best=c;}return best;};
  for(const win of [[660,900],[w.s,w.e]]){const one=pick(60,win);if(one)return [one];
    const h=[];const rest=gaps.map(g=>g.slice());for(let i=0;i<2;i++){let best=null,bi=-1;rest.forEach((g,k)=>{const a=Math.max(g[0],win[0]),z=Math.min(g[1],win[1]);if(z-a<30)return;const st=Math.min(Math.max(a,mid-15),z-30);if(!best||near(st,st+30)<near(...best)){best=[st,st+30];bi=k;}});if(!best)break;h.push(best);rest[bi]=[0,0];}
    if(h.length===2)return h.sort((a,b)=>a[0]-b[0]);}
  return [];
}
function slotsOf(busy,w){
  const s=w.s,e=w.e;let cur=s;const gaps=[];
  for(const b of busy){const a=toMin(b.start),z=toMin(b.end);if(a>cur)gaps.push([cur,Math.min(a,e)]);cur=Math.max(cur,z);}
  if(e>cur)gaps.push([cur,e]);
  const g2=gaps.filter(x=>x[1]>x[0]);const brk=lunchBreak(g2,w);
  let free=[];for(const g of g2){let parts=[g];for(const k of brk)parts=parts.flatMap(p=>k[1]<=p[0]||k[0]>=p[1]?[p]:[[p[0],k[0]],[k[1],p[1]]]);free=free.concat(parts);}
  return {free:free.filter(x=>x[1]-x[0]>=30),brk};
}
function breakOf(staff,date){const w=workHours(staff,date);if(w.off)return [];return slotsOf(busyOf(staff,date),w).brk;}
function freeSlots(staff,date){
  const w=workHours(staff,date);if(w.off)return [];
  return slotsOf(busyOf(staff,date),w).free;
}

function noticeCard(){const ns=myNotices();const bd=bdayNotice();return `<div class="card"><h2>お知らせ</h2>${bd}${ns.length||bd?ns.map(n=>`<div style="border-left:4px solid ${n.imp?'var(--red)':'var(--line)'};padding:4px 10px;margin-bottom:10px"><div>${n.imp?'<span class="tag red">重要</span>':''}<b>${esc(n.title)}</b> <span class="note">${md(n.date)}　${n.target==='all'?'全員':esc(n.target)}あて</span></div><div style="white-space:pre-wrap;font-size:13.5px;margin-top:3px">${esc(n.body)}</div></div>`).join(''):'<p class="note">お知らせはありません。</p>'}</div>`;}
function todoCard(){
  const ts=myTasks(),rq=myRequests();const items=[];const due=t=>t.due?` <span class="tag ${daysTo(t.due)<0?'red':daysTo(t.due)<=2?'amber':''}">${md(t.due)}まで</span>`:'';
  const mine=(S.mytasks||[]).filter(t=>!t.doneAt&&!sysKey(t)).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')||a.at.localeCompare(b.at));
  for(const t of mine) items.push(`<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line)"><label class="row" style="flex:1;gap:6px"><input type="checkbox" onchange="myTaskToggle('${t.id}',true)"> <span>${esc(t.title)}${due(t)}</span></label><a href="#" class="note" style="color:var(--red)" onclick="myTaskDel('${t.id}');return false">削除</a></div>`);
  for(const t of ts) items.push(`<label class="row" style="padding:6px 0;border-bottom:1px solid var(--line)"><input type="checkbox" onchange="doneTask('${t.id}')"> <span>${esc(t.title)}${due(t)} <span class="tag">${esc(t.by||'')}より</span></span></label>`);
  for(const r of rq.filter(r=>!sysDoneHas('ph:'+r.key))) items.push(`<div style="padding:6px 0;border-bottom:1px solid var(--line)"><div class="row"><input type="checkbox" title="済んだらチェック" onchange="sysDone('ph:${esc(r.key)}','撮影：${esc(r.u.name)} 様 ${esc(r.what)}')"><span class="tag blue">撮影</span><span>${md(r.v.date)} ${r.v.start} <b>${esc(r.u.name)} 様</b>：${esc(r.what)}</span><button class="btn sub" style="padding:4px 10px;font-size:13px" onclick="go('camera',{autoCam:1,camUser:'${esc(r.u.key)}',camType:'${r.type}'})">撮影する</button></div>${candLines(r)}</div>`);
  for(const r of otherRequests().filter(r=>!sysDoneHas('ph:'+r.key))) items.push(`<div style="padding:6px 0;border-bottom:1px solid var(--line);opacity:.85"><div class="row"><span class="tag">撮影</span><span><b>${esc(r.u.name)} 様</b>：${esc(r.what)}　<span class="note">いまの写真担当：${esc(r.v.staff)}（${md(r.v.date)}）</span></span><button class="btn sub" style="padding:4px 10px;font-size:13px" onclick="claimPhoto('${esc(r.key)}')">自分が写真担当になる</button></div>${candLines(r)}</div>`);
  if(isOffice()){const im=S.meta.imports;const old=['users','houkai','houkan'].filter(k=>!im[k]||(Date.now()-Date.parse(im[k].at))>36*3600e3);if(old.length&&!sysDoneHas('imp:'+TODAY_ISO))items.push(`<div class="row" style="padding:6px 0"><input type="checkbox" title="確認したらチェック（今日は表示しない）" onchange="sysDone('imp:${TODAY_ISO}','カイポケの取り込みを確認')"><span class="tag red">取り込み</span><span>カイポケの取り込みが古くなっています（遅番の更新を確認）</span><button class="btn sub" style="padding:4px 10px;font-size:13px" onclick="go('import')">取り込みへ</button></div>`);}
  // 済んだもの（自分で書いたもの・頼まれたもの、この2週間）
  const recent=x=>x&&daysTo(x.slice(0,10))>=-14;
  const doneMine=(S.mytasks||[]).filter(t=>recent(t.doneAt)).map(t=>({id:t.id,title:sysTitle(t),at:t.doneAt,mine:true,sys:!!sysKey(t)}));
  const doneAsg=S.tasks.filter(t=>(t.to==='all'||t.to===ME.id||ME.depts.includes(t.to))&&recent((t.done||{})[ME.id])).map(t=>({id:t.id,title:t.title,at:t.done[ME.id],mine:false}));
  const done=doneMine.concat(doneAsg).sort((a,b)=>b.at.localeCompare(a.at));
  return `<div class="card"><h2>やること <span class="note">${items.length}件</span></h2>
  ${S.mytasksOn?`<div class="row" style="margin-bottom:8px"><input id="myTaskIn" placeholder="自分のやることを書く（例：〇〇さんに電話）" style="flex:1;min-width:180px" onkeydown="if(event.key==='Enter'&&!event.isComposing)myTaskAdd()"><input type="date" id="myTaskDue" title="期限（なくてもOK）"><button class="btn" onclick="myTaskAdd()">追加</button></div>`:''}
  ${items.join('')||'<p class="note">いまやることはありません。</p>'}
  ${done.length?`<details style="margin-top:8px"><summary class="note">済んだもの（${done.length}件）</summary>${done.map(t=>`<label class="row" style="padding:4px 0;color:#94a3b8"><input type="checkbox" checked onchange="${t.sys?`sysUndo('${t.id}')`:t.mine?`myTaskToggle('${t.id}',false)`:`undoTask('${t.id}')`}"> <span style="text-decoration:line-through">${esc(t.title)}</span> <span class="note">${md(t.at.slice(0,10))}</span></label>`).join('')}</details>`:''}</div>`;
}
// 撮影依頼・取り込みのお知らせも、チェックで「済み」にできる（自分のやること欄に記録して、済んだものに出す）
const sysKey=t=>((t.title||'').match(/^⟦([^⟧]+)⟧/)||[])[1]||'';
const sysTitle=t=>(t.title||'').replace(/^⟦[^⟧]+⟧/,'');
const sysDoneHas=k=>(S.mytasks||[]).some(t=>t.doneAt&&sysKey(t)===k);
async function sysDone(key,title){try{const t=await api('myTaskAdd',{title:`⟦${key}⟧${title}`,due:''});const d=await api('myTaskToggle',{id:t.id,done:true});S.mytasks=(S.mytasks||[]).concat([d]);}catch(e){alert(e.message);}render();}
async function sysUndo(id){try{await api('myTaskDelete',{id});S.mytasks=S.mytasks.filter(x=>x.id!==id);}catch(e){alert(e.message);}render();}
async function myTaskAdd(){const i=$('#myTaskIn');const title=i.value.trim();if(!title){i.focus();return;}const dueV=$('#myTaskDue').value;i.disabled=true;try{const t=await api('myTaskAdd',{title,due:dueV});S.mytasks=(S.mytasks||[]).concat([t]);}catch(e){alert(e.message);i.disabled=false;return;}render();setTimeout(()=>{const x=$('#myTaskIn');if(x)x.focus();},0);}
async function myTaskToggle(id,done){try{const t=await api('myTaskToggle',{id,done});const k=S.mytasks.findIndex(x=>x.id===id);if(k>=0)S.mytasks[k]=t;}catch(e){alert(e.message);}render();}
async function myTaskDel(id){if(!confirm('このやることを削除しますか？'))return;try{await api('myTaskDelete',{id});S.mytasks=S.mytasks.filter(x=>x.id!==id);}catch(e){alert(e.message);}render();}
async function undoTask(id){try{await api('undoTask',{id});const t=S.tasks.find(x=>x.id===id);if(t&&t.done)delete t.done[ME.id];}catch(e){alert(e.message);}render();}
async function doneTask(id){const t=S.tasks.find(x=>x.id===id);if(!t)return;try{await api('doneTask',{id});}catch(e){alert(e.message);render();return;}t.done=t.done||{};t.done[ME.id]=new Date().toISOString();render();}
function lineList(list,limit){
  if(!list.length) return '<p class="note">連絡はありません。</p>';
  return list.slice(0,limit||9999).map(m=>{const imp=isImp(m);return `<div style="border-left:4px solid ${imp?'var(--red)':'var(--line)'};padding:4px 10px;margin-bottom:10px"><div class="note">${imp?'<span class="tag red">重要</span>':'<span class="tag">通常</span>'} ${md(m.date)} ${m.time}　${esc(m.from)}　${(m.users||[]).map(k=>{const u=IDX.userByKey.get(k);return u&&MYUSERS.has(k)?`<a href="#" class="tag green" onclick="SEL='${esc(k)}';go('users');return false">${esc(u.name)}様</a>`:'';}).join('')}</div><div style="white-space:pre-wrap;font-size:13.5px;margin-top:3px">${hl(m.text)}</div></div>`;}).join('');
}
function hl(t){let s=esc(t);for(const k of S.settings.keywords){if(!k)continue;s=s.split(esc(k)).join(`<mark style="background:var(--red-soft);color:var(--red)">${esc(k)}</mark>`);}return s;}
function vHomeStaff(){
  const mine=S.visits.filter(v=>isMe(v.staff)&&!v.oncall&&(v.date===TODAY_ISO||daysTo(v.date)===1)).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
  const imp=myLine().filter(m=>isImp(m)&&daysTo(m.date)>=-7);
  return `${todoCard()}${noticeCard()}${deadlineCard()}
  <div class="card"><h2>今日・明日の予定</h2>${mine.length?`<table><tr><th>日付</th><th>時間</th><th>利用者</th><th>内容</th></tr>${mine.map(v=>{const u=IDX.byName.get(normName(v.user));return `<tr><td>${md(v.date)}</td><td>${v.start}〜${v.end}</td><td>${v.other?'<span class="note">（利用者以外）</span>':u?`<a href="#" onclick="SEL='${esc(u.key)}';go('users');return false">${esc(v.user)} 様</a>`:esc(v.user)}</td><td class="note">${esc(v.service)}</td></tr>`;}).join('')}</table>`:'<p class="note">今日・明日の予定はありません。</p>'}</div>
  <div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">業務連絡（重要・この1週間）</h2><button class="btn sub" onclick="go('line')">すべて見る</button></div><div style="margin-top:10px">${lineList(imp,8)}</div></div>`;
}
function vHomeOffice(){
  const ex=expiries(),rq=requests(),bd=birthdays(TODAY.getMonth()+1),jg=jogenTargets();
  const todayV=S.visits.filter(v=>v.date===TODAY_ISO&&!v.other).length;
  const imp=myLine().filter(m=>isImp(m)&&daysTo(m.date)>=-7);
  return staleBanner()+todoCard()+`<div class="stats">
  <div class="stat red" onclick="go('limit')">期限切れ<b>${ex.filter(e=>e.d<0).length}</b><span class="note">介護認定・医療保険</span></div>
  <div class="stat amber" onclick="go('limit')">${S.settings.alertDays}日以内に期限<b>${ex.filter(e=>e.d>=0).length}</b><span class="note">新しい証の撮影が必要</span></div>
  <div class="stat" onclick="go('req')">撮影依頼<b>${rq.length}</b><span class="note">訪問予定の職員へ</span></div>
  <div class="stat" onclick="go('limit')">上限管理対象<b>${jg.length}</b><span class="note">月末最終訪問で撮影</span></div>
  <div class="stat" onclick="go('bday')">今月の誕生日<b>${bd.length}</b><span class="note">利用者・職員</span></div>
  <div class="stat" onclick="go('line')">重要な連絡（1週間）<b>${imp.length}</b><span class="note">LINEから</span></div>
  <div class="stat" onclick="go('sched')">今日の訪問<b>${todayV}</b><span class="note">訪介・訪看</span></div>
  </div><div style="height:14px"></div>${noticeCard()}${deadlineCard()}
  <div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">業務連絡（重要・この1週間）</h2><button class="btn sub" onclick="go('line')">すべて見る</button></div><div style="margin-top:10px">${lineList(imp,8)}</div></div>`;
}
function staleBanner(){
  const im=S.meta.imports,out=[];
  const chk=(k,l)=>{const x=im[k];if(!x)out.push(`${l}：未取り込み`);else if((Date.now()-Date.parse(x.at))>36*3600e3)out.push(`${l}：${new Date(x.at).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}（古くなっています）`);};
  chk('users','利用者一覧');chk('houkai','訪介シフト');chk('houkan','訪看予定');
  return out.length?`<div class="warn">最終取り込みを確認してください　${out.map(esc).join('　／　')}</div>`:`<div class="ok">利用者一覧・訪介シフト・訪看予定は最新です</div>`;
}

// ===== 業務連絡 =====
function vLine(){
  const q=normName(STATE.lineQ);
  let list=myLine();if(STATE.lineFilter==='imp')list=list.filter(isImp);if(q)list=list.filter(m=>normName(m.text+m.from).includes(q));
  const im=S.meta.imports.line;
  return `<div class="card"><div class="row"><h2 style="margin:0">業務連絡</h2><select onchange="STATE.lineFilter=this.value;render()"><option value="imp" ${STATE.lineFilter==='imp'?'selected':''}>重要のみ</option><option value="all" ${STATE.lineFilter==='all'?'selected':''}>すべて</option></select><input placeholder="言葉で探す" value="${esc(STATE.lineQ)}" onchange="STATE.lineQ=this.value;render()"><span class="note">${list.length}件</span></div>
  <p class="note">LINEグループのトーク履歴から取り込んだ連絡です。${isOffice()?'すべての連絡を表示しています。':'利用者の名前が入った連絡は、その方に訪問している職員にだけ表示されます。'}「重要」はキーワード（${S.settings.keywords.slice(0,8).map(esc).join('・')}など）で判定しています。${im?`最終取り込み：${new Date(im.at).toLocaleString('ja-JP')}`:'まだ取り込まれていません。'}</p></div>
  <div class="card">${lineList(list,300)}${list.length>300?'<p class="note">300件まで表示しています。言葉で絞り込んでください。</p>':''}</div>`;
}

// ===== 利用者 =====
// 検索：日本語入力の変換中は画面を作り直さない（作り直すと「つ」が「tう」になる）
// 入力欄は作り直さず、一覧だけ入れ替える（変換中も、打ったそばから絞り込む）
function userSearch(v){STATE.q=v;const box=document.querySelector('.ulist');if(!box){render();return;}const list=userFiltered();const u=SEL&&MYUSERS.has(SEL)&&IDX.userByKey.get(SEL);box.innerHTML=userListHtml(list,u);const c=document.getElementById('ucount');if(c)c.textContent=list.length+'名';}
function userFiltered(){
  // ひらがな・カタカナどちらで打っても探せるように（ローマ字の打ちかけは外して比べる）
  const kata=x=>String(x||'').replace(/[\u3041-\u3096]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60));
  const q=normName(String(STATE.q||'').replace(/[a-zA-Z]+$/,'')),qk=kata(q);
  return visibleUsers().filter(u=>!q||normName(u.name).includes(q)||kata(normName(u.kana)).includes(qk)||kata(normName(u.name)).includes(qk));
}
function userListHtml(list,u){return list.map(x=>`<div class="${u&&x.key===u.key?'on':''}" onclick="SEL='${esc(x.key)}';render()">${esc(x.name)} <span class="note">${x.depts.map(esc).join('・')}</span>${photosOf(x,'顔写真（基本情報）').length?'':' <span class="tag">顔写真なし</span>'}</div>`).join('')||'<div class="note">該当なし</div>';}
function vUsers(){
  const list=userFiltered();
  const u=SEL&&MYUSERS.has(SEL)&&IDX.userByKey.get(SEL)||list[0];
  return `${isOffice()?'':'<p class="note">あなたが訪問している方・担当している方だけを表示しています。</p>'}<div class="split"><div><input placeholder="名前・カナで検索" value="${esc(STATE.q)}" oninput="userSearch(this.value)" oncompositionend="userSearch(this.value)" style="width:100%;margin-bottom:8px">
  <div class="ulist">${userListHtml(list,u)}</div><p class="note" id="ucount">${list.length}名</p></div>
  <div>${u?userDetail(u):''}</div></div>`;
}
function userDetail(u){
  const face=photosOf(u,'顔写真（基本情報）')[0];
  const vs=userVisits(u).filter(v=>v.date>=TODAY_ISO).slice(0,30);
  const staffSeen=[...new Set(userVisits(u).filter(v=>v.staff).map(v=>v.staff))];
  const ex=d=>d?`${mdy(d)}${daysTo(d)<0?' <span class="tag red">期限切れ</span>':daysTo(d)<=S.settings.alertDays?' <span class="tag amber">あと'+daysTo(d)+'日</span>':''}`:'—';
  // 履歴：LINEの連絡と写真を新しい順に
  const hist=[...S.line.filter(m=>(m.users||[]).includes(u.key)).map(m=>({at:m.date+' '+m.time,html:`${isImp(m)?'<span class="tag red">重要</span>':'<span class="tag">連絡</span>'} <span class="note">${esc(m.from)}</span><div style="white-space:pre-wrap">${hl(m.text)}</div>`})),
    ...photosOf(u).map(p=>({at:localAt(p.at),album:p.src==='LINEアルバム',html:`<span class="tag blue">写真</span> ${esc(p.type)}${p.src==='LINEアルバム'?' <span class="note">LINEアルバムから取り込み</span>':p.by?` <span class="note">${esc(p.by)}</span>`:''}`}))].sort((a,b)=>b.at.localeCompare(a.at)).slice(0,60);
  return `<div class="card"><div class="row" style="align-items:flex-start">${face?photoImg(face,'width:96px;height:96px;object-fit:cover;object-position:center top;border-radius:10px'):'<div style="width:96px;height:96px;border-radius:10px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:12px">顔写真なし</div>'}
  <div><h2 style="margin:0">${esc(u.name)} 様</h2><div class="note">${esc(u.kana)}</div><div style="margin-top:6px">${u.depts.map(d=>`<span class="tag green">${esc(d)}</span>`).join('')}${u.kubun.map(d=>`<span class="tag">${esc(d)}</span>`).join('')}${u.jogen>0?'<span class="tag blue">上限管理</span>':''}</div>
  <div class="row" style="margin-top:8px"><button class="btn sub" onclick="go('camera',{autoCam:1,camUser:'${esc(u.key)}'})">この方の写真を撮る</button></div></div></div></div>
  <div class="card"><h2>基本情報</h2><dl class="kv">
  <dt>生年月日</dt><dd>${u.birth?`${u.birth.replace(/-/g,'/')}（${ageOn(u.birth,TODAY)}歳）`:'—'}</dd><dt>性別</dt><dd>${esc(u.sex)||'—'}</dd>
  <dt>要介護度</dt><dd>${esc(u.kaigodo)||'—'} ${u.ninteiStatus==='申請中'?'<span class="tag amber">申請中</span>':''}</dd><dt>認定有効期限</dt><dd>${ex(u.ninteiEnd)}</dd>
  <dt>保険者</dt><dd>${esc(u.hokensha)||'—'}</dd><dt>医療保険</dt><dd>${esc(u.iryoType)||'—'}　${u.iryoEnd?'適用期間 '+ex(u.iryoEnd):''}</dd>
  ${isMgr()?`<dt>住所</dt><dd>${u.address?`${esc(u.address)}　<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(u.address)}" target="_blank" rel="noopener">地図</a>`:'—'}</dd>`:''}<dt>担当ケアマネ</dt><dd>${esc(u.careMgr)||'—'}　<span class="note">${esc(u.kyotaku)}</span></dd><dt>地域包括</dt><dd>${esc(u.houkatsu)||'—'}</dd>
  <dt>障害 負担上限</dt><dd>${u.jogen!=null?u.jogen.toLocaleString()+'円':'—'}</dd>
  <dt>関わる職員</dt><dd>${staffSeen.map(s=>`<span class="tag">${esc(s)}</span>`).join('')||'<span class="note">予定データなし</span>'}</dd></dl></div>
  <div class="card"><h2>今後の予定</h2>${vs.length?`<table><tr><th>日付</th><th>時間</th><th>種別</th><th>担当</th><th>内容</th></tr>${vs.map(v=>`<tr><td>${md(v.date)}</td><td>${v.start}〜${v.end}</td><td><span class="tag ${v.src==='訪看'?'blue':v.src==='デイ'?'':'green'}">${v.src}</span></td><td>${esc(v.staff||SRC_OFFICE[v.src]||'')}</td><td class="note">${esc(v.service)}</td></tr>`).join('')}</table>`:'<p class="note">取り込んだ予定の中に、今日以降の予定はありません。</p>'}</div>
  <div class="card"><h2>履歴 <span class="note">LINEの連絡・写真</span></h2>${hist.length?hist.map(h=>`<div style="padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px"><span class="note">${h.album?'以前の写真':`${h.at.slice(5,10).replace('-','/')} ${h.at.slice(11)}`}</span>　${h.html}</div>`).join(''):'<p class="note">まだ履歴はありません。</p>'}</div>
  <div class="card"><h2>写真</h2>${photoGrid(photosOf(u))}</div>`;
}
function photoGrid(list){
  if(!list.length) return '<p class="note">まだ写真はありません。</p>';
  return `<div class="photos">${list.map(p=>`<div class="photo">${photoImg(p,'',true)}<b style="color:var(--ink)">${esc(p.type)}</b><br>${p.src==='LINEアルバム'?'LINEアルバムから取り込み':`${new Date(p.at).toLocaleString('ja-JP',{year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}${p.by?'<br>'+esc(p.by):''}`}<br><a href="#" onclick="dlPhoto('${p.id}');return false">保存</a>　<a href="#" onclick="printPhoto('${p.id}');return false">印刷</a>${isOffice()?`　<a href="#" onclick="delPhoto('${p.id}');return false" style="color:var(--red)">削除</a>`:''}</div>`).join('')}</div>`;
}
const PHOTO_CACHE={};const PHOTO_WAIT=new Set();
const BLANK='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10"><rect width="10" height="10" fill="#eef2f6"/></svg>');
// 写真の時刻（保存は世界標準時）を日本時間の「YYYY-MM-DD HH:MM」に
function localAt(at){const d=new Date(at);return isNaN(d)?String(at||''):`${iso(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`;}
// 一覧の小さい写真は縮小画像を、端末に保存して次からすぐ出す
const THUMB={};
const tdb=(()=>{let p=null;return ()=>p||(p=new Promise(res=>{try{const r=indexedDB.open('aloha-thumbs',1);r.onupgradeneeded=()=>r.result.createObjectStore('t');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);}catch(e){res(null);}}));})();
async function tGet(id){const db=await tdb();if(!db)return null;return new Promise(res=>{try{const q=db.transaction('t').objectStore('t').get(id);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);}catch(e){res(null);}});}
async function tPut(id,v){const db=await tdb();if(!db)return;try{db.transaction('t','readwrite').objectStore('t').put(v,id);}catch(e){}}
function photoImg(p,style,zoomable){const src=THUMB[p.id]||PHOTO_CACHE[p.id];if(!src)PHOTO_WAIT.add(p.id);return `<img data-pid="${p.id}" src="${src||BLANK}" style="${style||''}" ${zoomable||style.includes('zoom')?`onclick="zoom('${p.id}')"`:''} alt="">`;}
// 写真から一覧用の縮小画像（長い辺240px）を作る
async function makeThumb(dataUrl){const im=await loadImg(dataUrl);const k=Math.min(1,240/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',0.75);}
async function loadPhotos(){const ids=[...PHOTO_WAIT].filter(id=>!THUMB[id]);PHOTO_WAIT.clear();
  const show=id=>document.querySelectorAll(`img[data-pid="${id}"]`).forEach(im=>im.src=THUMB[id]);
  const need=[];for(const id of ids){if(PHOTO_CACHE[id]){THUMB[id]=PHOTO_CACHE[id];show(id);continue;}const c=await tGet(id);if(c){THUMB[id]=c;show(id);}else need.push(id);}
  if(!need.length)return;
  // サーバーの縮小画像をまとめて受け取る
  let got={};for(let i=0;i<need.length;i+=30){try{Object.assign(got,await api('getThumbs',{ids:need.slice(i,i+30)},true));}catch(e){}}
  const miss=[];for(const id of need){if(got[id]){THUMB[id]=got[id];tPut(id,got[id]);show(id);}else miss.push(id);}
  // 縮小画像がまだない写真は元の写真を読み、縮小版を作ってサーバーに保存（次から速くなる）
  const work=async()=>{while(miss.length){const id=miss.shift();try{const full=await api('getPhoto',{id},true);PHOTO_CACHE[id]=full;let t=full;try{t=await makeThumb(full);api('putThumb',{id,data:t},true).catch(()=>{});}catch(e){}THUMB[id]=t;tPut(id,t);show(id);}catch(e){}}};
  await Promise.all([work(),work(),work(),work()]);}
async function getPhotoData(id){if(!PHOTO_CACHE[id])PHOTO_CACHE[id]=await api('getPhoto',{id});return PHOTO_CACHE[id];}
async function zoom(id){try{$('#zoomimg').src=await getPhotoData(id);$('#zoom').style.display='flex';}catch(e){alert(e.message);}}
async function dlPhoto(id){const p=PHOTOS.find(x=>x.id===id);try{const d=await getPhotoData(id);const a=document.createElement('a');a.href=d;a.download=`${p.userName}_${p.type}_${p.at.slice(0,10)}.jpg`;document.body.appendChild(a);a.click();a.remove();}catch(e){alert(e.message);}}
async function delPhoto(id){if(!confirm('この写真を削除しますか？（ドライブのゴミ箱に移り、30日間は元に戻せます）'))return;try{await api('deletePhoto',{id});}catch(e){alert(e.message);return;}PHOTOS=PHOTOS.filter(p=>p.id!==id);render();}

// ===== 誕生日カード（はがき 縦・横） =====
const CARD_TPL={
  tate:{src:'card/tate.png',w:519,h:785,name:[116,119,428,161],birth:[38,171,435,219],oval:[7,302,513,651],year:[505,37,18],scale:3},
  yoko:{src:'card/yoko.png',w:1138,h:751,name:[343,148,795,204],birth:[282,205,856,276],oval:[223,289,974,740],year:[1116,53,26],scale:1.6}};
const CARD_FONT='"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","YuGothic","Meiryo",sans-serif';
const TPL_IMG={};const CARD_ADJ={};
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('画像を読み込めませんでした'));i.src=src;});}
async function tplImg(o){if(!TPL_IMG[o])TPL_IMG[o]=await loadImg(CARD_TPL[o].src);return TPL_IMG[o];}
function cardYear(){return TODAY.getFullYear();}
// 誕生日カードの写真は、その年の誕生日の60日前より後に撮ったものだけ使う（去年の写真は使わない）
function bdayOf(u,year){if(!u||!u.birth)return '';if(year)return `${year}-${u.birth.slice(5)}`;const y=cardYear();const bd=`${y}-${u.birth.slice(5)}`;return daysTo(bd)<-60?`${y+1}-${u.birth.slice(5)}`:bd;}
function freshBdayPhoto(u,year){const bd=bdayOf(u,year);if(!bd)return null;const from=iso(new Date(new Date(bd+'T00:00').getTime()-60*864e5));return photosOf(u,'顔写真（誕生日）').find(p=>String(p.at).slice(0,10)>=from)||null;}
function cardPhoto(u){return freshBdayPhoto(u);}
async function cardAdj(u){
  if(CARD_ADJ[u.key])return CARD_ADJ[u.key];
  const ph=cardPhoto(u);const img=await loadImg(await getPhotoData(ph.id));
  return CARD_ADJ[u.key]={o:img.width>=img.height?'yoko':'tate',z:1,dx:0,dy:0,img};
}
function fitText(ctx,t,maxW,size,weight){let s=size;do{ctx.font=`${weight||''} ${s}px ${CARD_FONT}`;if(ctx.measureText(t).width<=maxW)break;s-=1;}while(s>8);return s;}
async function drawCard(cv,u,a){
  const T=CARD_TPL[a.o],S=T.scale,tpl=await tplImg(a.o);
  cv.width=Math.round(T.w*S);cv.height=Math.round(T.h*S);const c=cv.getContext('2d');
  c.setTransform(S,0,0,S,0,0);c.imageSmoothingQuality='high';
  c.fillStyle='#D9E2F3';c.fillRect(0,0,T.w,T.h);
  // 写真（楕円の中に、はみ出さないように）
  const [x0,y0,x1,y1]=T.oval,ow=x1-x0+4,oh=y1-y0+4,cx=(x0+x1)/2,cy=(y0+y1)/2,img=a.img;
  const k=Math.max(ow/img.width,oh/img.height)*a.z,iw=img.width*k,ih=img.height*k;
  c.save();c.beginPath();c.ellipse(cx,cy,ow/2,oh/2,0,0,Math.PI*2);c.clip();
  c.drawImage(img,cx-iw/2+a.dx*ow,cy-ih/2+a.dy*oh,iw,ih);c.restore();
  c.drawImage(tpl,0,0,T.w,T.h);
  // 年
  c.fillStyle='#111';c.textBaseline='alphabetic';c.textAlign='right';c.font=`${T.year[2]}px ${CARD_FONT}`;c.fillText(`${cardYear()} 年`,T.year[0],T.year[1]);
  // 名前
  c.textAlign='center';c.textBaseline='middle';
  const [nx0,ny0,nx1,ny1]=T.name;const nm=u.name.replace(/\s+/g,' ').trim();
  fitText(c,nm,(nx1-nx0)*0.92,Math.round((ny1-ny0)*0.62),'500');c.fillText(nm,(nx0+nx1)/2,(ny0+ny1)/2+1);
  // 生年月日・年齢
  const [bx0,by0,bx1,by1]=T.birth,bw=bx1-bx0,bh=by1-by0,[yy,mm,dd]=u.birth.split('-').map(Number);
  const bt=`${yy}年${mm}月${dd}日`;fitText(c,bt,bw*0.55,Math.round(bh*0.36));c.fillText(bt,bx0+bw*0.33,(by0+by1)/2+1);
  c.fillStyle='#E06BC8';const age=`${cardYear()-yy}歳`;fitText(c,age,bw*0.3,Math.round(bh*0.5));c.fillText(age,bx0+bw*0.77,(by0+by1)/2+1);
  return cv;
}
function openCard(key){STATE.cardUser=key;render();window.scrollTo(0,0);}
function closeCard(){STATE.cardUser='';render();}
function vCardEdit(){
  const u=IDX.userByKey.get(STATE.cardUser);if(!u||!cardPhoto(u))return '';
  return `<div class="card noprint"><div class="row"><h2 style="margin:0">🎂 ${esc(u.name)} 様の誕生日カード</h2><button class="btn sub" onclick="closeCard()">閉じる</button></div>
  <div class="cardedit" style="margin-top:12px"><div><canvas id="cardCv"></canvas><p class="note" id="cardMsg">読み込み中…</p></div>
  <div style="display:grid;gap:12px"><div><div class="note">向き</div><div class="seg"><button id="oTate" onclick="cardSet({o:'tate'})">縦</button><button id="oYoko" onclick="cardSet({o:'yoko'})">横</button></div></div>
  <label class="note">写真の大きさ<br><input type="range" id="cardZoom" min="1" max="3" step="0.05" value="1" style="width:100%" oninput="cardSet({z:+this.value})"></label>
  <p class="note" style="margin:0">写真は指（マウス）でドラッグすると位置を動かせます。</p>
  <button class="btn sub" onclick="cardSet({z:1,dx:0,dy:0})">写真の位置を元に戻す</button>
  <button class="btn" onclick="printCards([STATE.cardUser])">🖨 はがきに印刷</button>
  <button class="btn sub" onclick="saveCardImg()">画像を保存</button>
  <p class="note" style="margin:0">印刷するときは、用紙サイズを「はがき」、余白を「なし」にしてください。</p></div></div></div>`;
}
async function cardSet(ch){
  const u=IDX.userByKey.get(STATE.cardUser);if(!u)return;const a=await cardAdj(u);
  if('o' in ch&&ch.o!==a.o){a.dx=0;a.dy=0;}Object.assign(a,ch);
  if($('#cardZoom'))$('#cardZoom').value=a.z;
  if($('#oTate')){$('#oTate').classList.toggle('on',a.o==='tate');$('#oYoko').classList.toggle('on',a.o==='yoko');}
  const cv=$('#cardCv');if(cv){await drawCard(cv,u,a);cv.style.maxWidth=a.o==='tate'?'420px':'640px';}
}
async function bindCardEdit(){
  const cv=$('#cardCv');if(!cv)return;const u=IDX.userByKey.get(STATE.cardUser);
  try{await cardSet({});$('#cardMsg').textContent='';}catch(e){$('#cardMsg').textContent='写真を読み込めませんでした：'+e.message;return;}
  let drag=null;
  cv.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing';};
  cv.onpointermove=async e=>{if(!drag)return;const a=CARD_ADJ[u.key],T=CARD_TPL[a.o],r=cv.getBoundingClientRect(),px=T.w/r.width;
    a.dx+=(e.clientX-drag.x)*px/(T.oval[2]-T.oval[0]);a.dy+=(e.clientY-drag.y)*px/(T.oval[3]-T.oval[1]);drag={x:e.clientX,y:e.clientY};await drawCard(cv,u,a);};
  cv.onpointerup=cv.onpointercancel=()=>{drag=null;cv.style.cursor='grab';};
}
async function saveCardImg(){
  const u=IDX.userByKey.get(STATE.cardUser);const a=await cardAdj(u);const cv=await drawCard(document.createElement('canvas'),u,a);
  const l=document.createElement('a');l.href=cv.toDataURL('image/jpeg',0.92);l.download=`誕生日カード_${u.name.replace(/\s+/g,'')}_${cardYear()}.jpg`;document.body.appendChild(l);l.click();l.remove();
}
function startPrint(cls){
  const box=$('#cardPrint');document.body.classList.add(cls);
  const done=()=>{document.body.classList.remove(cls);box.innerHTML='';window.removeEventListener('afterprint',done);const g=$('#printGo');if(g)g.remove();};
  window.addEventListener('afterprint',done);
  const touch=navigator.maxTouchPoints>1||/iPad|iPhone|Android/.test(navigator.userAgent);
  if(touch){const g=document.createElement('div');g.id='printGo';g.className='noprint';g.innerHTML='<div><p style="margin:0 0 14px;font-size:15px">印刷の準備ができました</p><button class="btn" id="printGoBtn">🖨 印刷する</button> <button class="btn sub" id="printNoBtn">やめる</button></div>';document.body.appendChild(g);
    $('#printGoBtn').onclick=()=>{g.style.display='none';print();};$('#printNoBtn').onclick=done;}
  else{print();}
  setTimeout(()=>{if(document.body.classList.contains(cls)&&!matchMedia('print').matches&&!$('#printGo'))done();},60000);
}
// 写真1枚を印刷（保険証などをA4に）
async function printPhoto(id){
  const p=PHOTOS.find(x=>x.id===id);if(!p)return;let d;try{d=await getPhotoData(id);}catch(e){alert('写真を読み込めませんでした');return;}
  const box=$('#cardPrint');box.innerHTML=`<div class="pp"><p>${esc(p.userName||'')} 様　${esc(p.type)}　${esc(String(p.at).slice(0,10))}</p><img src="${d}"></div>`;
  await Promise.all([...box.querySelectorAll('img')].map(i=>i.decode().catch(()=>{})));
  startPrint('pphoto');
}
async function retakeBday(key){go('camera',{autoCam:1,camUser:key,camType:'顔写真（誕生日）'});}
async function printCards(keys){
  const box=$('#cardPrint');box.innerHTML='';let n=0;
  for(const k of keys){const u=IDX.userByKey.get(k);if(!u||!cardPhoto(u))continue;
    try{const a=await cardAdj(u);const cv=await drawCard(document.createElement('canvas'),u,a);
      box.insertAdjacentHTML('beforeend',`<div class="pg ${a.o}"><img src="${cv.toDataURL('image/jpeg',0.92)}"></div>`);n++;}catch(e){}}
  if(!n){alert('印刷できるカードがありません（誕生日用の顔写真を撮ってください）');return;}
  await Promise.all([...box.querySelectorAll('img')].map(i=>i.decode().catch(()=>{})));
  startPrint('pcards');
}
function printMonthCards(){
  const all=birthdays(STATE.month).filter(b=>b.u&&(isOffice()||MYUSERS.has(b.u.key))&&cardPhoto(b.u));
  if(!all.length){alert(`${STATE.month}月の方で、誕生日用の顔写真がある方がいません`);return;}
  printCards(all.map(b=>b.u.key));
}

const GUIDE={'介護保険証':['paper','保険証を枠に合わせてください'],'医療保険証':['card','保険証を枠に合わせてください'],'負担割合証':['paper','負担割合証を枠に合わせてください'],'受給者証':['paper','受給者証を枠に合わせてください'],'上限管理票':['paper','用紙全体が入るように撮ってください'],'顔写真（基本情報）':['face','お顔を枠に合わせてください'],'顔写真（誕生日）':['face','笑顔で撮りましょう'],'その他':['','']};
function vCamera(){
  const us=visibleUsers();const u=IDX.userByKey.get(STATE.camUser);const g=GUIDE[STATE.camType]||['',''];
  return `<div class="card"><h2>写真を撮る</h2>
  <p class="note">1. 利用者を選ぶ　2. 撮るものを選ぶ　3. 「カメラを起動」を押してシャッター</p>
  <input list="ulist" id="camUserIn" placeholder="利用者名を入力して選ぶ" value="${u&&MYUSERS.has(u.key)?esc(u.name):''}" style="width:100%;font-size:16px;padding:10px"><datalist id="ulist">${us.map(x=>`<option value="${esc(x.name)}">${esc(x.kana)}</option>`).join('')}</datalist>
  <div class="typebtns" style="margin-top:12px">${PHOTO_TYPES.map(t=>`<button class="${t===STATE.camType?'on':''}" onclick="STATE.camUser=selUserKey();STATE.camType='${t}';render()">${t}</button>`).join('')}</div>
  <div class="row" style="margin-top:14px"><button class="btn" id="camBtn" style="font-size:16px;padding:12px 20px">📷 カメラを起動</button><a href="#" id="pickBtn" class="note">写真ファイルから選ぶ</a><span class="note" id="camMsg"></span></div>
  <div class="camwrap hide" id="camWrap"><div class="camview"><video id="camVideo" playsinline muted autoplay></video>
    <div class="camguide">${g[0]?`<i class="g-${g[0]}"></i>`:''}<span>${esc(g[1]||STATE.camType)}</span></div></div>
    <div class="cambar"><button class="cbtn" id="camClose">閉じる</button><button class="shutter" id="shutter" aria-label="撮影"></button><button class="cbtn" id="camFlip">🔄 切替</button></div></div>
  <img id="preview" alt=""><div class="row hide" id="saveRow" style="margin-top:10px"><button class="btn" id="saveBtn" style="font-size:16px;padding:12px 20px">この写真を保存</button><button class="btn sub" id="retakeBtn">撮り直す</button></div></div>
  ${u&&MYUSERS.has(u.key)?`<div class="card"><h2>${esc(u.name)} 様の写真</h2>${photoGrid(photosOf(u))}</div>`:''}`;
}
function selUserKey(){const v=$('#camUserIn')&&$('#camUserIn').value;const u=visibleUsers().find(x=>x.name===v)||IDX.byName.get(normName(v));return u&&MYUSERS.has(u.key)?u.key:'';}
let PENDING=null,CAM_STREAM=null;
function stopCam(){if(CAM_STREAM){CAM_STREAM.getTracks().forEach(t=>t.stop());CAM_STREAM=null;}}
function showPending(){$('#preview').src=PENDING;$('#preview').style.display='block';$('#saveRow').classList.remove('hide');$('#camWrap').classList.add('hide');$('#saveRow').scrollIntoView({behavior:'smooth',block:'nearest'});}
function openFile(useCapture){const cam=$('#cam');if(useCapture)cam.setAttribute('capture','environment');else cam.removeAttribute('capture');cam.value='';cam.click();}
async function startCam(){
  STATE.camUser=selUserKey();if(!STATE.camUser){$('#camMsg').textContent='先に利用者を選んでください';return;}
  $('#camMsg').textContent='';PENDING=null;$('#preview').style.display='none';$('#saveRow').classList.add('hide');
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){openFile(true);return;}
  stopCam();const facing=STATE.camFacing||'environment';
  try{CAM_STREAM=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1080}}});}
  catch(e){$('#camMsg').textContent=(e&&e.name==='NotAllowedError')?'カメラの使用が許可されていません。ブラウザの設定でこのページのカメラを「許可」にしてください。':'カメラを起動できませんでした。';openFile(true);return;}
  if(TAB!=='camera'){stopCam();return;}
  const v=$('#camVideo');v.srcObject=CAM_STREAM;v.style.transform=facing==='user'?'scaleX(-1)':'';
  $('#camWrap').classList.remove('hide');try{await v.play();}catch(e){}
  $('#camWrap').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function snap(){
  const v=$('#camVideo');if(!v||!v.videoWidth)return;
  const max=1600,r=Math.min(1,max/Math.max(v.videoWidth,v.videoHeight));const c=document.createElement('canvas');c.width=Math.round(v.videoWidth*r);c.height=Math.round(v.videoHeight*r);
  c.getContext('2d').drawImage(v,0,0,c.width,c.height);PENDING=c.toDataURL('image/jpeg',0.85);stopCam();showPending();
}
function bindCamera(){
  const cam=$('#cam');
  $('#camUserIn').onchange=()=>{STATE.camUser=selUserKey();render();};
  $('#camBtn').onclick=startCam;
  $('#pickBtn').onclick=e=>{e.preventDefault();STATE.camUser=selUserKey();if(!STATE.camUser){$('#camMsg').textContent='先に利用者を選んでください';return;}openFile(false);};
  $('#shutter').onclick=snap;
  $('#camClose').onclick=()=>{stopCam();$('#camWrap').classList.add('hide');};
  $('#camFlip').onclick=()=>{STATE.camFacing=(STATE.camFacing||'environment')==='environment'?'user':'environment';startCam();};
  cam.onchange=async()=>{const f=cam.files[0];if(!f)return;PENDING=await shrink(f);showPending();};
  $('#retakeBtn').onclick=startCam;
  $('#saveBtn').onclick=async()=>{const u=IDX.userByKey.get(STATE.camUser);if(!u||!PENDING)return;$('#saveBtn').disabled=true;let p;try{let th='';try{th=await makeThumb(PENDING);}catch(e){}p=await api('uploadPhoto',{userKey:u.key,type:STATE.camType,data:PENDING,thumb:th});}catch(e){$('#saveBtn').disabled=false;alert('保存できませんでした：'+e.message);return;}PHOTO_CACHE[p.id]=PENDING;PHOTOS.push(p);PENDING=null;render();$('#camMsg').textContent=`${u.name} 様の「${p.type}」を保存しました`;};
  if(STATE.autoCam){STATE.autoCam=0;if(selUserKey())startCam();}
}
function shrink(file){return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{const max=1600,r=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.85));};img.onerror=rej;img.src=url;});}

function docGuess(fname){
  const n=normName(fname),act=S.staffList.filter(s=>s.active);let st=act.find(s=>n.includes(normName(s.name)));
  if(!st){const sur=x=>String(x.name).split(/[\s　]/)[0];const c=act.filter(s=>sur(s).length>1&&n.includes(sur(s)));if(c.length===1)st=c[0];}
  const type=/労働条件/.test(fname)?'労働条件通知書':/採用/.test(fname)?'採用通知書':/契約/.test(fname)?'雇用契約書':'その他';
  const dm=fname.match(/(20\d\d)[-_.年]?(\d{1,2})[-_.月]?(\d{1,2})/);const date=dm?`${dm[1]}-${dm[2].padStart(2,'0')}-${dm[3].padStart(2,'0')}`:TODAY_ISO;
  return {staffId:st?st.id:'',type,date,title:type};
}

  <div class="row" style="margin-top:8px"><label><input type="checkbox" id="docNotify" checked> 本人にLINE WORKSで知らせる</label><button class="btn" id="docUpBtn" onclick="docUpload()">${DOC_PENDING.length}件を登録</button><a href="#" onclick="DOC_PENDING=[];$('#docPend').innerHTML='';return false">やめる</a></div>`;

function docPick(files){DOC_PENDING=[...files].filter(f=>/\.pdf$/i.test(f.name)||f.type==='application/pdf').map(f=>Object.assign({file:f},docGuess(f.name)));$('#docPend').innerHTML=DOC_PENDING.length?docPendHtml():'<p class="note" style="color:var(--red)">PDFを選んでください</p>';}
const readPdf=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res('data:application/pdf;base64,'+String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(f);});
async function docUpload(){
  if(DOC_PENDING.some(x=>!x.staffId)){alert('職員が選ばれていないファイルがあります');return;}
  const notify=$('#docNotify').checked;$('#docUpBtn').disabled=true;const msg=[];
  for(const x of DOC_PENDING){
    if(x.file.size>20*1024*1024){msg.push(`${x.file.name}：大きすぎます（20MBまで）`);continue;}
    try{const r=await api('docUpload',{staffId:x.staffId,type:x.type,date:x.date,title:x.title||x.type,data:await readPdf(x.file),notify});msg.push(`${r.meta.staffName}：${r.meta.title} を登録${r.notified==='sent'?'（LINE WORKSで通知済み）':r.notified==='failed'?'（LINE WORKSには届かず）':''}`);}
    catch(e){msg.push(`${x.file.name}：${e.message}`);}

async function docOpen(id){

    const url=URL.createObjectURL(new Blob([u8],{type:'application/pdf'}));if(w)w.location.href=url;else location.href=url;}
  catch(e){if(w)w.close();alert(e.message);}
}

async function shareOpen(id){

  try{const r=await api('shareGet',{id});const [head,b64]=r.data.split(',');const mime=head.slice(5).replace(';base64','');const bin=atob(b64);const u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
    const url=URL.createObjectURL(new Blob([u8],{type:mime||'application/octet-stream'}));
    if(w)w.location.href=url;else{const a=document.createElement('a');a.href=url;a.download=r.name;document.body.appendChild(a);a.click();a.remove();}}
  catch(e){if(w)w.close();alert(e.message);}
}

// ===== LINEアルバムの写真を取り込む（写真に書いてある利用者名で振り分け） =====
let ALB=[];
const ALB_TYPES=['顔写真（誕生日）','顔写真（基本情報）','その他'];
function albMatch(text){
  const t=normName(String(text||'').replace(/[様さま\s]/g,''));if(t.length<2)return '';
  let best=null,bs=0;
  for(const u of S.users){const n=normName(u.name);if(!n)continue;let i=0,hit=0;for(const c of n){const k=t.indexOf(c,i);if(k>=0){hit++;i=k+1;}}
    const sc=hit/n.length;if(sc>bs||(sc===bs&&best&&n.length>normName(best.name).length)){bs=sc;best=u;}}
  return best&&bs>=0.75?best.key:'';
}
function loadOcr(){return window.Tesseract?Promise.resolve():new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';sc.onload=res;sc.onerror=()=>rej(new Error('文字読み取りの部品を読み込めませんでした'));document.head.appendChild(sc);});}
let OCRW=null;
async function albOcr(dataUrl){
  await loadOcr();if(!OCRW)OCRW=await Tesseract.createWorker('jpn');
  const im=await loadImg(dataUrl);const out=[];
  for(const [y0,h] of [[0,0.11],[0.89,0.11]]){const c=document.createElement('canvas');c.width=im.width;c.height=Math.round(im.height*h);c.getContext('2d').drawImage(im,0,Math.round(im.height*y0),im.width,c.height,0,0,c.width,c.height);
    const r=await OCRW.recognize(c.toDataURL('image/png'));out.push(r.data.text||'');}
  return out.join(' ');
}
async function albPick(files){
  const list=[...files].filter(f=>/^image\//.test(f.type)||/\.(jpe?g|png|heic)$/i.test(f.name));
  ALB=list.map(f=>({f,key:albMatch(f.name),type:$('#albType').value,state:'',url:URL.createObjectURL(f)}));
  $('#albList').innerHTML=albListHtml();
  if($('#albOcr').checked){
    $('#albMsg').textContent='写真に書いてある名前を読み取っています…（はじめは1分ほどかかります）';
    for(let i=0;i<ALB.length;i++){const a=ALB[i];if(a.key)continue;try{const t=await albOcr(await shrink(a.f));a.ocr=t;a.key=albMatch(t);}catch(e){$('#albMsg').textContent=e.message+'。名前は手で選んでください。';break;}albRepaint(i);}
    if(!/部品/.test($('#albMsg').textContent))$('#albMsg').textContent='読み取りが終わりました。名前が合っているか確認して「保存」を押してください。';
  }
}
function albRowHtml(a,i){
  const u=IDX.userByKey.get(a.key);
  return `<div id="albRow${i}" style="display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)"><img src="${a.url}" style="width:70px;height:90px;object-fit:cover;border-radius:6px"><div style="flex:1"><input list="albUsers" value="${u?esc(u.name):''}" placeholder="利用者の名前" onchange="albSet(${i},this.value)" style="width:100%;max-width:260px"> ${u?'<span class="tag green">OK</span>':'<span class="tag red">未選択</span>'}<div class="note">${esc(a.f.name)}${a.ocr?`　読み取り：${esc(a.ocr.replace(/\s+/g,'').slice(0,20))}`:''}</div></div><select onchange="ALB[${i}].type=this.value">${ALB_TYPES.map(t=>`<option ${t===a.type?'selected':''}>${t}</option>`).join('')}</select><span class="note" style="width:70px">${a.state}</span></div>`;
}
function albListHtml(){return ALB.length?`<datalist id="albUsers">${S.users.map(u=>`<option value="${esc(u.name)}">`).join('')}</datalist>${ALB.map(albRowHtml).join('')}<div class="row" style="margin-top:8px"><button class="btn" id="albBtn" onclick="albSave()">名前が入っている${ALB.length}枚を保存</button></div>`:'';}
function albRepaint(i){setTimeout(()=>{const el=$('#albRow'+i);if(el&&el.isConnected){const t=document.createElement('template');t.innerHTML=albRowHtml(ALB[i],i).trim();el.replaceWith(t.content.firstChild);}},0);}
function albSet(i,v){const u=S.users.find(x=>normName(x.name)===normName(v));ALB[i].key=u?u.key:'';albRepaint(i);}
async function albSave(){
  const todo=ALB.filter(a=>a.key&&a.state!=='保存済み');if(!todo.length){alert('利用者が選ばれている写真がありません');return;}
  $('#albBtn').disabled=true;let ok=0;
  for(let i=0;i<ALB.length;i++){const a=ALB[i];if(!a.key||a.state==='保存済み')continue;a.state='保存中…';albRepaint(i);
    try{const data=await shrink(a.f);let th='';try{th=await makeThumb(data);}catch(e){}
      const p=await api('uploadPhoto',{userKey:a.key,type:a.type,data,thumb:th,src:'LINEアルバム',at:new Date(a.f.lastModified||Date.now()).toISOString()},true);PHOTO_CACHE[p.id]=data;PHOTOS.push(p);a.state='保存済み';ok++;}
    catch(e){a.state='失敗';}
    albRepaint(i);}
  $('#albBtn').disabled=false;$('#albMsg').textContent=`${ok}枚を保存しました。利用者ページの写真に入っています。`;
}

// ===== ランチミーティングのレジュメの締め切り =====
let DL_PEND=null;
function loadXlsxLib(){return window.XLSX?Promise.resolve():new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';sc.onload=res;sc.onerror=()=>rej(new Error('Excelを読む部品を読み込めませんでした'));document.head.appendChild(sc);});}
// 「行う職員」の言葉 → 職員ID
function dlTokens(who){return String(who||'').replace(/\s/g,'').split(/[・、,と]/).filter(Boolean);}
function dlResolve(tok){
  const act=S.staffList.filter(s=>s.active),map=(S.settings.dlWho||{})[tok];
  if(map) return map.filter(id=>act.some(s=>s.id===id));
  if(/^(職員)?全員$/.test(tok)) return act.map(s=>s.id);
  if(tok==='正社員') return act.filter(s=>s.cls==='正社員').map(s=>s.id);
  if(tok==='役員') return act.filter(s=>s.cls==='役員'||s.role==='幹部').map(s=>s.id);
  if(/^(全事業所)?管理者$/.test(tok)) return act.filter(s=>s.role==='管理者').map(s=>s.id);
  const dm=tok.match(/(ナース|ヘルパー|ケアマネ|事務|デイ)/);
  if(dm&&/管理者/.test(tok)) return act.filter(s=>s.role==='管理者'&&s.depts.includes(dm[1])).map(s=>s.id);
  if(dm&&tok.replace(/^オンコール有/,'')===dm[1]) return act.filter(s=>s.depts.includes(dm[1])).map(s=>s.id);
  const sur=x=>String(x.name).split(/[\s　]/)[0];const c=act.filter(s=>sur(s)===tok||normName(s.name)===tok);
  return c.length===1?[c[0].id]:null;
}
function dlTo(who){const ids=new Set(),un=[];dlTokens(who).forEach(t=>{const r=dlResolve(t);if(r)r.forEach(i=>ids.add(i));else un.push(t);});return {to:[...ids],un};}
function parseResume(rows){
  const title=String((rows[0]||[])[0]||'');const tm=title.match(/(20\d\d)\D(\d{1,2})\D(\d{1,2})/);if(!tm) throw new Error('1行目に「ランチミーティングレジュメ　2026.9.15（火）」の形の日付が見つかりません');
  const y=+tm[1],mm=+tm[2];const head=rows.findIndex(r=>String(r[0]||'').trim()==='締切日');if(head<0) throw new Error('「締切日」の表が見つかりません');
  const list=[];
  for(let i=head+1;i<rows.length;i++){const r=rows[i]||[];const a=String(r[0]||'').trim();if(!a)break;
    const m=a.match(/(\d{1,2})月(\d{1,2})日/);if(!m)continue;let yy=y;if(+m[1]<mm-6)yy++;if(+m[1]>mm+6)yy--;
    const time=a.replace(/^.*?日(\([^)]*\)|（[^）]*）)?/,'').trim();
    list.push({date:`${yy}-${String(m[1]).padStart(2,'0')}-${String(m[2]).padStart(2,'0')}`,time,who:String(r[1]||'').trim(),what:String(r[2]||'').trim()});}
  return {src:`${y}-${String(mm).padStart(2,'0')}`,meet:`${y}-${String(mm).padStart(2,'0')}-${String(tm[3]).padStart(2,'0')}`,list};
}
async function dlPick(f){
  const box=$('#dlPend');box.innerHTML='<p class="note">読み込み中…</p>';
  try{await loadXlsxLib();const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''});DL_PEND=Object.assign(parseResume(rows),{file:f});box.innerHTML=dlPendHtml();}
  catch(e){DL_PEND=null;box.innerHTML=`<p class="note" style="color:var(--red)">${esc(e.message)}</p>`;}
}
function dlPendHtml(){
  if(!DL_PEND) return '';const un=new Set();DL_PEND.list.forEach(d=>dlTo(d.who).un.forEach(t=>un.add(t)));
  const act=S.staffList.filter(s=>s.active);
  return `<p><b>${DL_PEND.src.replace('-','年')}月のレジュメ</b>：締め切り ${DL_PEND.list.length}件</p>
  ${un.size?`<div style="background:#fff7ed;border-radius:8px;padding:8px 10px;margin-bottom:8px"><b>だれのことか決めてください</b><span class="note">（一度決めると次の月からも使います）</span>${[...un].map(t=>`<details style="margin-top:6px"><summary>「${esc(t)}」 → <span class="note">${((S.settings.dlWho||{})[t]||[]).map(id=>esc((act.find(s=>s.id===id)||{}).name||'')).join('、')||'未設定'}</span></summary><div>${act.map(s=>`<label style="display:inline-block;margin:0 10px 4px 0;white-space:nowrap"><input type="checkbox" onchange="dlSetWho('${esc(t)}','${esc(s.id)}',this.checked)" ${((S.settings.dlWho||{})[t]||[]).includes(s.id)?'checked':''}>${esc(s.name)}</label>`).join('')}</div></details>`).join('')}</div>`:''}
  <table><tr><th>締切日</th><th>行う職員</th><th>内容</th><th>届く人数</th></tr>${DL_PEND.list.map(d=>{const r=dlTo(d.who);return `<tr><td style="white-space:nowrap">${md(d.date)} ${esc(d.time)}</td><td>${esc(d.who)}</td><td>${esc(d.what)}</td><td>${r.un.length?'<span class="tag red">未設定あり</span>':r.to.length+'人'}</td></tr>`;}).join('')}</table>
  <div class="row" style="margin-top:8px"><label><input type="checkbox" id="dlShare" checked> レジュメのファイルを「書類」→「会社の資料」にも置く（全員が見られる）</label><button class="btn" id="dlBtn" onclick="dlSave()">取り込む</button></div><div id="dlMsg" class="note"></div>`;
}
async function dlSetWho(t,id,on){const m=S.settings.dlWho=S.settings.dlWho||{};const a=new Set(m[t]||[]);on?a.add(id):a.delete(id);m[t]=[...a];await save('settings');$('#dlPend').innerHTML=dlPendHtml();}

  if(!DL_PEND)return;const un=DL_PEND.list.some(d=>dlTo(d.who).un.length);if(un&&!confirm('だれのことか決まっていない行があります。その人には通知されませんが、取り込みますか？'))return;

    await api('shareUpload',{cat:'ランチミーティングレジュメ',scope:'all',date:DL_PEND.meet,title:`${DL_PEND.src.replace('-','年')}月 ランチミーティング レジュメ`,name:DL_PEND.file.name,data});msg.push('会社の資料にも置きました');}catch(e){msg.push('会社の資料には置けませんでした：'+e.message);}}
  $('#dlMsg').textContent=msg.join('　');$('#dlBtn').disabled=false;
}

  <table><tr><th>ID</th><th>氏名</th><th>区分</th><th>所属</th><th>役割</th><th>在籍</th><th>パスワード</th></tr>${S.staffList.map(s=>`<tr style="${s.active?'':'opacity:.5'}"><td>${esc(s.id)}</td><td>${esc(s.name)}</td><td class="note">${esc(s.cls)}</td><td>${DEPTS.map(d=>`<label style="white-space:nowrap;margin-right:6px;font-size:12.5px"><input type="checkbox" ${s.depts.includes(d)?'checked':''} onchange="setDept('${esc(s.id)}','${d}',this.checked)">${d}</label>`).join('')}</td><td>${!isExec()&&s.role==='幹部'?'幹部':`<select onchange="setStaff('${esc(s.id)}','role',this.value)"><option ${s.role==='一般'?'selected':''}>一般</option><option ${s.role==='管理者'?'selected':''}>管理者</option>${isExec()?`<option ${s.role==='幹部'?'selected':''}>幹部</option>`:''}</select>`}</td><td><input type="checkbox" ${s.active?'checked':''} ${!isExec()&&s.role==='幹部'?'disabled':''} onchange="setStaff('${esc(s.id)}','active',this.checked)"></td><td>${s.passSet?'<span class="tag green">設定済み</span>':'<span class="tag">初期のまま</span>'} ${!isExec()&&s.role==='幹部'?'':`<a href="#" onclick="resetPass('${esc(s.id)}');return false" class="note">初期化</a>`}</td></tr>`).join('')}</table></div>
  <div class="card"><h2>職員を追加</h2><div class="row"><input id="sId" placeholder="ID（職員番号）" style="width:120px"><input id="sName" placeholder="氏名"><input id="sBirth" type="date"><button class="btn" onclick="addStaff()">追加</button></div></div>`;
}
async function setDept(id,d,on){const s=S.staffList.find(x=>x.id===id);s.deptsManual=true;s.depts=on?[...new Set([...s.depts,d])]:s.depts.filter(x=>x!==d);await save('staff');render();}
async function setStaff(id,k,v){const s=S.staffList.find(x=>x.id===id);if(k==='role'&&v!=='幹部'&&s.id===ME.id&&!confirm('自分の幹部をはずすと、この画面に戻れなくなります。よろしいですか？')){render();return;}s[k]=v;if(k==='role')s.roleManual=true;await save('staff');render();}
async function resetPass(id){const s=S.staffList.find(x=>x.id===id);if(!confirm(`${s.name} さんのパスワードを初期（生年月日8桁）に戻しますか？`))return;try{await api('resetPass',{id});}catch(e){alert(e.message);return;}s.passSet=false;render();}
async function addStaff(){const id=$('#sId').value.trim(),n=$('#sName').value.trim();if(!id||!n)return;if(S.staffList.some(s=>s.id===id)){alert('そのIDはもう使われています');return;}S.staffList.push({id,name:n,birth:$('#sBirth').value,cls:'',depts:[],role:'一般',active:true});await save('staff');render();}
